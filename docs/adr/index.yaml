    "decision": "CTF owns one normalized communications domain for manual, static, timed, dynamic, RAES-runtime, and generation-bound range triggers. A draft campaign selects one immutable workspace scope, explicit event targets, a closed audience and trigger profile, an immutable locale-aware safe-content revision, channel policy, and acknowledgement policy; each occurrence becomes an immutable communication intent with server-resolved recipient snapshots and durable per-channel delivery state. The event-workspace portion becomes operative only after #2048's activation migration has backfilled every existing event, failed on unresolved mappings, made the scalar binding required, and routed supported new-event creation through workspaces.services; until then events remain deployment-global records under their existing event-native authorization. After activation, every CTF event has one immutable scalar workspace_id so every event in a cross-event campaign can be proved to share one tenant, while CTF teams and participants remain event-native membership and workspace membership grants no CTF authority. Interactive release requires both workspaces.services authorization and the existing per-event notification capability for every target; the only platform-root override is an explicitly audited Django superuser, and one campaign still cannot span workspaces. Only shared.raes interprets the released RAES Inject/Event/Script/Story/ParticipantInjectDelivery contracts; CTF persists a realization projection and never a competing portable schema. Disclosure, external direction, and intervention remain distinct, and an intervention without an exact generation-fenced participant-control mapping fails before persistence, delivery, or effect. Rich content uses a bounded Markdown profile with raw HTML, executable behavior, remote media, and non-allowlisted links prohibited. PostgreSQL is workflow truth; the CTF scheduler provides timing, a CTF-owned durable command/attempt worker provides at-least-once delivery, shared.email and shared.notifications remain transports, WebSocket writes are not reads, explicit acknowledgement is participant-authenticated state, and shared.audit is evidence rather than queue state. Participant-controlled range assets are treated as compromised and may name only an allowlisted declaration/occurrence under exact workload, deployment, range generation, event, workspace, scenario, and package bindings; they can never choose content, recipients, scope, links, channels, schedules, or control actions. CTF-014 constrains this design to the existing Django-app extension, event-branding, and gettext/i18n incumbents; communication profiles and adapters are closed application policy, not a new plugin, theming, or translation surface.",
