# Project identity (key, organization) is repository deployment configuration,
# not shared analysis configuration, so it does not travel with the source
# (ADR-003-R7). The scan step in `.github/workflows/_quality.yml` supplies it
# from the SONAR_PROJECT_KEY / SONAR_ORGANIZATION repository variables. The rest
# of this file is shared analysis policy and belongs in the repo.
sonar.projectVersion=2.3.2

# Quality gate: the SonarCloud project uses the org ``raes-strict`` gate. Gate
# association is server-side on SonarCloud; its conditions (verified 2026-07-12,
# #1529 / REV1 Q6) are the changed-code authority and fail a PR on any of:
#   new_coverage < 80            (changed-code coverage floor)
#   new_violations > 0
#   new_duplicated_lines_density > 3
#   new_reliability_rating / new_security_rating / new_maintainability_rating > 1
#   new_security_hotspots_reviewed < 100
# PR analysis waits for the gate (``-Dsonar.qualitygate.wait=true`` in _quality.yml).
# The per-package absolute ``fail_under`` floors in each pyproject are the
# complementary non-regression metric; see docs/dev/testing.md.

# Source paths
sonar.sources=shifter/shifter_platform,shifter/engine/provisioner,shifter/packer,shifter/installation,scripts/bootstrap,scripts/check_layer_imports,scripts/adr_guard,mcp/ngfw,mcp/ops,mcp/planner,mcp/shared
sonar.tests=shifter/shifter_platform/tests,shifter/engine/provisioner/tests,shifter/packer/tests,shifter/installation/tests,scripts/bootstrap/tests,scripts/check_layer_imports/tests

# Exclusions (including test files - don't need bug/smell analysis on tests)
# scenario-dev/** holds intentionally-vulnerable CTF target content; temp/** is scratch
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/__pycache__/**,**/migrations/**,**/.venv/**,**/staticfiles/**,**/static/js/vendor/**,**/tests/**,**/test_*.py,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/frontend/e2e/**,**/frontend/src/api/schema.d.ts,**/frontend/index.html,**/__mocks__/**,**/babel.config.cjs,**/conftest.py,**/documentation/**,**/Dockerfile.dockerignore,docs/ctf/**,scenario-dev/**,temp/**
sonar.test.exclusions=**/tests/**,**/test_*.py,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/frontend/e2e/**,**/__mocks__/**,**/conftest.py

# Security hotspot exclusions (test files contain mock credentials, docs have decorative JS)
sonar.security.exclusions=**/tests/**,**/test_*.py,**/conftest.py,**/documentation/**,docs/ctf/**,scenario-dev/**,temp/**

# Django templates are first-class HTML sources, but their inline Django tags
# are not valid standalone JavaScript. Keep Web/HTML analysis active while
# keeping the JavaScript analyzer on static JS assets it can parse.
sonar.javascript.exclusions=**/templates/**/*.html

# CPD (copy-paste detection) exclusions:
# - mcp/**/*.test.js — test files across MCP packages intentionally
#   share fixture shapes (recording runners, metacharacter-payload
#   tables) because they assert behavior of the same shared helpers
#   in `mcp/shared/aws-helpers.js`. Production code in `mcp/shared/`
#   is intentionally NOT excluded so future copy-paste into the
#   shared helpers will still be caught by CPD.
sonar.cpd.exclusions=mcp/**/*.test.js

# Coverage exclusions (test fixtures, dev-only code).
# mcp/** is excluded from coverage measurement for now: mcp/planner and
# mcp/shared have no test suite, and mcp/ngfw + mcp/ops use the Node
# built-in test runner without lcov coverage output on the pinned
# Node 20. Excluding them keeps the new-code coverage gate fair; remove
# mcp/** here once those packages have a coverage harness.
#
# frontend/** (the ADR-029 SPA, #1302) runs Vitest coverage in the SPA CI job;
# its lcov is uploaded there (coverage-shifter-platform-spa) and restored into
# frontend/coverage/ by the sonarcloud job, so SPA code is now measured against
# the new-code coverage gate (#1526) and is no longer coverage-excluded.
#
# static/js/vendor/** are third-party minified bundles (Chart.js and its
# date-fns adapter). They are already excluded from issue analysis via
# sonar.exclusions, but the shifter_platform jest lcov still reports their
# thousands of minified branch conditions, which then count as uncovered new
# code on the branch analyses (the dev->main promotion's branch=main new_coverage
# was sunk almost entirely by chart.umd.min.js's ~4,590 uncovered conditions).
# Vendor bundles are not first-party code and are never tested, so mirror the
# sonar.exclusions vendor glob here to keep the new-code coverage gate honest.
#
# frontend/e2e/** are Playwright E2E specs (test code, also excluded from issue
# analysis above) and frontend/*.config.ts are Vite/Playwright build+test config;
# neither is exercised by the Vitest unit lcov, so they are not first-party
# production code for the coverage gate (#1526).
sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/dev_auth.py,mcp/**,**/static/js/vendor/**,**/frontend/e2e/**,**/frontend/*.config.ts

# Coverage report paths. The Python coverage.xml files and the JS
# lcov.info are generated by the _quality.yml test jobs and passed to the
# sonarcloud job as artifacts; the paths below are where that job
# restores them.
sonar.python.coverage.reportPaths=shifter/shifter_platform/coverage.xml,shifter/engine/provisioner/coverage.xml,shifter/packer/coverage.xml,shifter/installation/coverage.xml,scripts/bootstrap/coverage.xml,scripts/check_layer_imports/coverage.xml,scripts/adr_guard/coverage.xml
sonar.javascript.lcov.reportPaths=shifter/shifter_platform/coverage/lcov.info,shifter/shifter_platform/frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Rule suppressions
# python:S1722 ("Add inheritance from object") conflicts with ruff UP004 which
# *removes* explicit object inheritance as redundant in Python 3. Both rules
# cannot be satisfied simultaneously — one says add ``(object)``, the other
# strips it on every save. The repo treats ruff as the authoritative style
# (it auto-formats on pre-commit), so S1722 is suppressed globally.
#
# Web:HeaderCheck false-positive on Django templates: Sonar's HTML analyzer
# does not always recognize Django ``{# #}`` comment syntax as a file header
# even when the bytes match ``sonar.html.fileHeader`` below. The header IS
# present and IS stripped at template-compile time so users never see it; the
# rule is gated to admin disposition on a per-file basis. Suppress globally
# for Django templates so the analyzer's mis-parse cannot keep the PR gate
# red. (Original first surfaced on terminal.html; reaffirmed on
# participant_detail.html in PR #856.)
#
# Web:S1829 ("absolute URI for src") fires on vendored CDN scripts; for
# templates that import jsdelivr-hosted assets WITH subresource-integrity
# hashes plus crossorigin=anonymous, that pattern IS the tamper-detection
# guarantee the rule wants the developer to add. PR #856 self-hosts chart.js
# under ``static/js/vendor/``; no global suppression needed.
#
# python:S1309 ("review this noqa pragma") fires on every ruff ``# noqa: X``
# pragma. The repo's pattern is to document each suppression with an inline
# rationale comment above the line; further admin disposition for every
# noqa is paperwork, not signal. Suppress globally for production Python.
#
# Bootstrap deployment CLI suppressions are scoped to scripts/bootstrap only.
# Issue #687 split a legacy operator script into cloud-domain modules; Sonar
# treats the moved code as new and flags generic rules that do not match this
# surface:
# - pythonsecurity:S8705: bootstrap commands are argv lists, never shell strings,
#   and the shared gateway validates argv before execution; Bandit remains the
#   security gate for subprocess call sites.
# - python:S1313: fixed RFC1918/GCP CIDR defaults are infrastructure topology
#   inputs, not accidentally hardcoded public endpoints.
# - python:S104/python:S1142: provider bootstrap workflows remain procedural
#   by cloud operation boundary; the repo's active complexity gate is Ruff C901.
# - python:S139: inline ``# nosec``/``# noqa`` pragmas must stay on the guarded
#   line for the local scanners that consume them.
#
# The installation package (shifter/installation, backend bundles + the #727
# setup/doctor UX) carries the same constraint as bootstrap: its ``# nosec``
# subprocess/urllib pragmas must stay on the guarded line for Bandit, so
# python:S139 is suppressed there too (installation_inline_suppressions), with
# the identical rationale as bootstrap above.
sonar.issue.ignore.multicriteria=s1722,header_check_django,noqa_review_python,bootstrap_subprocess_argv,bootstrap_fixed_networks,bootstrap_module_length,bootstrap_control_flow,bootstrap_inline_suppressions,installation_inline_suppressions,ssh_protocol_async,ssh_receive_timeout_protocol,executor_protocol_params,email_inline_styles,email_inline_style_check,email_favicon_hook_protected,aria_group_role,dc_bootstrap_gate_intentional
sonar.issue.ignore.multicriteria.s1722.ruleKey=python:S1722
sonar.issue.ignore.multicriteria.s1722.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.header_check_django.ruleKey=Web:HeaderCheck
sonar.issue.ignore.multicriteria.header_check_django.resourceKey=**/templates/**/*.html
sonar.issue.ignore.multicriteria.noqa_review_python.ruleKey=python:S1309
sonar.issue.ignore.multicriteria.noqa_review_python.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.bootstrap_subprocess_argv.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.bootstrap_subprocess_argv.resourceKey=scripts/bootstrap/**
sonar.issue.ignore.multicriteria.bootstrap_fixed_networks.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.bootstrap_fixed_networks.resourceKey=scripts/bootstrap/**
sonar.issue.ignore.multicriteria.bootstrap_module_length.ruleKey=python:S104
sonar.issue.ignore.multicriteria.bootstrap_module_length.resourceKey=scripts/bootstrap/**
sonar.issue.ignore.multicriteria.bootstrap_control_flow.ruleKey=python:S1142
sonar.issue.ignore.multicriteria.bootstrap_control_flow.resourceKey=scripts/bootstrap/**
sonar.issue.ignore.multicriteria.bootstrap_inline_suppressions.ruleKey=python:S139
sonar.issue.ignore.multicriteria.bootstrap_inline_suppressions.resourceKey=scripts/bootstrap/**
sonar.issue.ignore.multicriteria.installation_inline_suppressions.ruleKey=python:S139
sonar.issue.ignore.multicriteria.installation_inline_suppressions.resourceKey=shifter/installation/**
# engine/ssh.py send()/resize() implement the async TerminalConnection protocol
# (shared/remote_access.py); they wrap synchronous stdin/resize calls with nothing
# to await, but must stay `async def` to satisfy the protocol and every `await`
# call site. Removing `async` (S7503) would break the interface contract.
sonar.issue.ignore.multicriteria.ssh_protocol_async.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.ssh_protocol_async.resourceKey=shifter/shifter_platform/engine/ssh.py
# engine/ssh.py receive() implements the async TerminalConnection protocol
# (shared/remote_access.py:75 -> `async def receive(self, timeout: float = 0.1)`).
# The `timeout` parameter is part of that shared contract (callers poll with a
# short timeout and get b"" back), so S7483's "drop the param, use a caller-side
# timeout context manager" cannot apply without breaking the protocol and every
# implementation/caller. Protocol-contract false positive.
sonar.issue.ignore.multicriteria.ssh_receive_timeout_protocol.ruleKey=python:S7483
sonar.issue.ignore.multicriteria.ssh_receive_timeout_protocol.resourceKey=shifter/shifter_platform/engine/ssh.py
# The provisioner executors implement the CommandExecutor protocol
# (executors/base.py). SSH ignores `document_name` and SSM ignores `stdin_input`,
# but both params are part of the shared signature every executor must accept, so
# S1172 (unused parameter) is a protocol-contract false positive.
sonar.issue.ignore.multicriteria.executor_protocol_params.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.executor_protocol_params.resourceKey=shifter/engine/provisioner/executors/**
# HTML email templates must use inline styles: email clients strip <style> blocks
# and external CSS, so inline `style=` is the correct, required approach for these
# notification templates. S1808/InlineStyleCheck is a false positive for email.
sonar.issue.ignore.multicriteria.email_inline_styles.ruleKey=Web:S1808
sonar.issue.ignore.multicriteria.email_inline_styles.resourceKey=shifter/shifter_platform/templates/ctf/email/**
# Same rationale, the other inline-style rule key SonarCloud raises on the same
# email templates: clients strip <style>/external CSS, so inline `style=` is
# required. Web:InlineStyleCheck is a false positive for HTML email.
sonar.issue.ignore.multicriteria.email_inline_style_check.ruleKey=Web:InlineStyleCheck
sonar.issue.ignore.multicriteria.email_inline_style_check.resourceKey=shifter/shifter_platform/templates/ctf/email/**
# ctf/email/credentials.html cannot be edited to add the favicon <link>: the
# repo PreToolUse guard (.claude/hooks/protect_files.sh) refuses edits to any
# file named credentials.html. The sibling email templates carry the favicon; this
# one needs a hand-applied edit or a hook allowlist (tracked separately).
sonar.issue.ignore.multicriteria.email_favicon_hook_protected.ruleKey=Web:PageWithoutFaviconCheck
sonar.issue.ignore.multicriteria.email_favicon_hook_protected.resourceKey=shifter/shifter_platform/templates/ctf/email/credentials.html
# The challenge rating control uses role="group" (valid WAI-ARIA grouping). The
# native <fieldset> S6819 wants adds UA border/margin that the custom CTF theme
# (no CSS reset for fieldset) renders visibly wrong; role="group" gives the same
# assistive-tech semantics without the styling regression.
sonar.issue.ignore.multicriteria.aria_group_role.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.aria_group_role.resourceKey=**/challenge_detail.html
# dc_setup._run_dc_bootstrap_plan guards on state_helpers._should_run_dc_bootstrap_plan(),
# which INTENTIONALLY returns False always (documented safety control: the DC
# BootstrapPlan renames the guest / mutates a pre-baked domain controller's AD
# identity, which must never run at runtime; there is deliberately no provider
# default and no env escape hatch). The plan + gate are retained, and tests
# monkeypatch the gate to exercise both branches. S2583 fires only because Sonar
# constant-folds the `return False` gate into the caller; the always-true guard is
# the intended, safety-critical behavior, not a defect.
sonar.issue.ignore.multicriteria.dc_bootstrap_gate_intentional.ruleKey=pythonbugs:S2583
sonar.issue.ignore.multicriteria.dc_bootstrap_gate_intentional.resourceKey=shifter/engine/provisioner/dc_setup.py

# File-header enforcement (ADR-015). Web:HeaderCheck compares the start of every
# HTML file against this literal block. Django `{# #}` comment syntax is used so
# the header is stripped at template-compile time and never reaches clients.
sonar.html.fileHeader={# SPDX-FileCopyrightText: 2026 Palo Alto Networks, Inc. #}\n{# SPDX-License-Identifier: MIT #}
