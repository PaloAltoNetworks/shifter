id: smoke_linux
name: Smoke (Linux)
description: >-
  Post-deploy platform smoke. Provisions a Kali attacker and an Ubuntu
  victim from the base range AMIs (no XDR agent, no scenario content),
  verifies SSH connectivity, and tears the range down. Not user-facing;
  used only by run_post_deploy_smoke.
enabled: false
ngfw: false

instances:
  - name: Attacker
    role: attacker
    os_type: kali
    xdr_agent: false

  - name: Workstation
    role: victim
    os_type: ubuntu
    xdr_agent: false

subnets:
  - name: core
    instances: [Attacker, Workstation]
