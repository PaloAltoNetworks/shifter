        "id": "ADR-051-R10",
        "description": "Shipping the capability requires maintained authorization/isolation, content-safety, RAES conformance, adversarial-ingress/replay, PostgreSQL concurrency/recovery, delivery/load, retention/redaction, configuration-parity, migration/API-contract, and browser tests, plus participant, organizer, scenario-author, technical, operator, and API documentation. The completed feature is recorded as ctf-communications in docs/adr/documentation-coverage.yaml only when the referenced user and technical docs describe the shipping behavior and are index-reachable (ADR-022-R1).",
        "checks": [
          "documentation-coverage"
