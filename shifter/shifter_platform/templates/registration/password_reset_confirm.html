<!doctype html>
{% load i18n static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />
    <title>{% trans "Set a new password" %}</title>
  </head>
  <body>
    <main>
      <h1>{% trans "Set a new password" %}</h1>
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">{% trans "Set password" %}</button>
        </form>
      {% else %}
        <p id="reset-invalid">
          {% trans "This password reset link is invalid or has expired. Ask an administrator to send a new one." %}
        </p>
      {% endif %}
    </main>
  </body>
</html>
