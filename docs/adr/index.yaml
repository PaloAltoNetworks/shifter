        "description": "Release automation runs from protected main on a GitHub-hosted runner, serializes writes, uses full-SHA-pinned actions and job-scoped least privilege, and prefers ephemeral GITHUB_TOKEN plus OIDC signing over a PAT or static key. Untrusted titles/API data are parsed as data; tokens and signing material never enter argv, URLs, generated files, release notes, artifacts, summaries, or logs.",
