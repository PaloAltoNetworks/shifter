name: Quality

on:
  workflow_call:
    inputs:
      skip_tests:
        description: 'Skip test jobs (linting still runs)'
        required: false
        type: boolean
        default: false
      run_full_matrix:
        description: >-
          Run every quality job regardless of path filters. Set by the caller
          for workflow_dispatch full-validation runs.
        required: false
        type: boolean
        default: false
      run_stack_smoke:
        description: >-
          Run the built-image stack-smoke job. Driven by the caller from the
          portal_image / shifter_platform path filters so it only builds and
          boots the portal image when the image's inputs change.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud analysis token (sonarcloud job)'
        required: true

jobs:
  # ===========================================================================
  # Path detection (issue #774)
  #
  # Categories live in .github/quality-path-filters.yaml. Workflow-file
  # changes force the full matrix so a broken pipeline cannot slip through.
  # ===========================================================================

  paths:
    permissions:
      contents: read
    name: Detect quality paths
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ steps.detect.outputs.run_all }}
      run_sonar: ${{ steps.detect.outputs.run_sonar }}
      ci_workflows: ${{ steps.detect.outputs.ci_workflows }}
      shifter_platform: ${{ steps.detect.outputs.shifter_platform }}
      provisioner: ${{ steps.detect.outputs.provisioner }}
      cyberscript: ${{ steps.detect.outputs.cyberscript }}
      packer: ${{ steps.detect.outputs.packer }}
      bootstrap: ${{ steps.detect.outputs.bootstrap }}
      gcp_scripts: ${{ steps.detect.outputs.gcp_scripts }}
      check_layer_imports: ${{ steps.detect.outputs.check_layer_imports }}
      check_rds_pending_modifications: ${{ steps.detect.outputs.check_rds_pending_modifications }}
      handle_sd_replacement: ${{ steps.detect.outputs.handle_sd_replacement }}
      assert_portal_inspection: ${{ steps.detect.outputs.assert_portal_inspection }}
      installation: ${{ steps.detect.outputs.installation }}
      event_load_harness: ${{ steps.detect.outputs.event_load_harness }}
      terraform: ${{ steps.detect.outputs.terraform }}
      k8s: ${{ steps.detect.outputs.k8s }}
      mcp_ngfw: ${{ steps.detect.outputs.mcp_ngfw }}
      mcp_ops: ${{ steps.detect.outputs.mcp_ops }}
      mcp_planner: ${{ steps.detect.outputs.mcp_planner }}
      mcp_shared: ${{ steps.detect.outputs.mcp_shared }}
      adr_guard: ${{ steps.detect.outputs.adr_guard }}
      ctfd_workshop: ${{ steps.detect.outputs.ctfd_workshop }}
      polaris_aws_range: ${{ steps.detect.outputs.polaris_aws_range }}
      scenario_smoketest: ${{ steps.detect.outputs.scenario_smoketest }}
      stack_smoke: ${{ steps.detect.outputs.stack_smoke }}
      mcp_lint_any: ${{ steps.detect.outputs.mcp_lint_any }}
      mcp_test_any: ${{ steps.detect.outputs.mcp_test_any }}
      mcp_lint_packages: ${{ steps.detect.outputs.mcp_lint_packages }}
      mcp_test_packages: ${{ steps.detect.outputs.mcp_test_packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Classify changed paths
        id: detect
        env:
          RUN_FULL_MATRIX: ${{ inputs.run_full_matrix }}
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DIFF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run --python 3.11 --with 'pyyaml==6.0.2' python3 <<'PY'
          import fnmatch
          import json
          import os
          import subprocess
          from pathlib import Path

          import yaml

          CONFIG = Path(".github/quality-path-filters.yaml")
          SONAR_CATEGORIES = {
              "shifter_platform",
              "provisioner",
              "packer",
              "bootstrap",
              "check_layer_imports",
              "installation",
          }
          MCP_LINT_PACKAGES = ["ngfw", "ops", "planner", "shared"]
          MCP_TEST_PACKAGES = ["ngfw", "ops", "planner"]

          def matches(path: str, pattern: str) -> bool:
              if pattern.endswith("/**"):
                  prefix = pattern[:-3].rstrip("/")
                  return path == prefix or path.startswith(prefix + "/")
              return fnmatch.fnmatchcase(path, pattern)

          def load_filters() -> dict[str, list[str]]:
              with CONFIG.open(encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              return {name: list(globs) for name, globs in data.items()}

          def changed_files() -> list[str] | None:
              if os.environ.get("RUN_FULL_MATRIX", "false").lower() == "true":
                  return None
              head = os.environ.get("DIFF_HEAD_SHA") or os.environ.get("GITHUB_SHA", "")
              base = os.environ.get("DIFF_BASE_SHA", "")
              if base and base != ("0" * 40):
                  cmd = ["git", "diff", "--name-only", f"{base}...{head}"]
              else:
                  cmd = ["git", "diff", "--name-only", "HEAD~1", "HEAD"]
              out = subprocess.check_output(cmd, text=True)
              return [line.strip() for line in out.splitlines() if line.strip()]

          filters = load_filters()
          files = changed_files()
          outputs: dict[str, str] = {}

          if files is None:
              run_all = "true"
              for name in filters:
                  outputs[name] = "true"
          else:
              for name, globs in filters.items():
                  hit = any(
                      matches(path, glob)
                      for path in files
                      for glob in globs
                  )
                  outputs[name] = "true" if hit else "false"
              run_all = "true" if outputs.get("ci_workflows") == "true" else "false"

          outputs["run_all"] = run_all
          outputs["run_sonar"] = (
              "true"
              if run_all == "true"
              or any(outputs.get(name) == "true" for name in SONAR_CATEGORIES)
              else "false"
          )

          if run_all == "true" or outputs.get("mcp_shared") == "true":
              lint_packages = list(MCP_LINT_PACKAGES)
              test_packages = list(MCP_TEST_PACKAGES)
          else:
              lint_packages = [
                  pkg
                  for pkg in MCP_LINT_PACKAGES
                  if outputs.get(f"mcp_{pkg}") == "true"
              ]
              test_packages = [
                  pkg for pkg in MCP_TEST_PACKAGES if pkg in lint_packages
              ]
          outputs["mcp_lint_any"] = "true" if lint_packages else "false"
          outputs["mcp_test_any"] = "true" if test_packages else "false"
          outputs["mcp_lint_packages"] = json.dumps(lint_packages)
          outputs["mcp_test_packages"] = json.dumps(test_packages)

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

  # ===========================================================================
  # Linting
  # ===========================================================================

  adr-conformance:
    permissions:
      contents: read
    name: Architecture (adr conformance)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.adr_guard == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The self-hosted runner ships with Python 3.9, but `adr_guard.py`
      # imports the stdlib `tomllib` module added in 3.11. `uv` brings its
      # own Python and is already the Python toolchain every other job in
      # this workflow uses, so it's the portable fix: no OS-package upgrade
      # on the runner VMs, no dependency on `actions/setup-python`'s
      # version manifest (which doesn't cover the runner distro).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Helm for ADR guard chart rendering (hermetic, version-pinned, checksum-verified)
        env:
          HELM_VERSION: v3.15.4
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          # Verify the downloaded tarball against the published SHA256 checksum
          # before extraction or execution. Trust boundary is get.helm.sh; if
          # it is compromised both files compare equal, but this prevents
          # CDN/transport tampering and silent corruption.
          expected=$(curl -fsSL \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" \
            | awk '{print $1}')
          echo "${expected}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm-bin/helm" version --short

      - name: Run ADR guard
        run: |
          uv run --python 3.11 --with 'pyyaml==6.0.2' \
            python scripts/adr_guard/adr_guard.py --all --level ci

  workflow-lint:
    permissions:
      contents: read
    name: Lint (GitHub Actions)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.ci_workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: devops-actions/actionlint@467e2ce19b2310e93c9ffa0b50fe31f86b5a7f23 # v0.1.10

  terraform-lint:
    permissions:
      contents: read
    name: Lint (terraform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4

      - name: Init TFLint
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Run TFLint
        working-directory: platform/terraform
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      # ADR-004-R10 / issue #52: the kms:Decrypt grant for the portal
      # Secrets Manager CMK on roles that read Secrets Manager. Wired
      # alongside terraform-lint because the inputs are .tf files and
      # this is the natural "terraform architecture" gate; runs in the
      # same job to avoid an extra runner pool slot. Pre-commit also
      # enforces it locally, but CI must enforce it independently so a
      # commit that didn't run pre-commit cannot land the regression.
      # Scope must mirror the pre-commit hook's `files:` regex —
      # every module that defines an IAM role whose attached policies
      # grant secretsmanager:GetSecretValue on a portal-CMK secret.
      - name: Run check-tf-kms-secrets-grant
        run: |
          python3 scripts/check_tf_kms_secrets_grant/check_tf_kms_secrets_grant.py \
            platform/terraform/modules/engine-provisioner/iam.tf \
            platform/terraform/modules/portal/ec2/main.tf \
            platform/terraform/modules/guacamole/iam.tf

      # Issue #46: ELBv2 (Gateway Load Balancer) IAM scoping on the
      # engine provisioner ECS task role. Mirrors check-tf-iam-ec2-scope:
      # rejects Resource=* and wildcard ELBv2 actions on the GWLB
      # mutation statements and requires the Shifter ownership tag
      # conditions. Pre-commit also enforces it locally.
      - name: Run check-tf-iam-elb-scope
        run: |
          python3 scripts/check_tf_iam_elb_scope/check_tf_iam_elb_scope.py \
            platform/terraform/modules/engine-provisioner/iam.tf

      # Issue #1179: SSM Run Command IAM scoping on the engine provisioner
      # ECS task role. Mirrors check-tf-iam-ec2-scope: rejects account-wide
      # ssm:SendCommand / ec2:RebootInstances and requires the range-instance
      # tag conditions so a provisioner compromise cannot command portal or
      # runner instances. Pre-commit also enforces it locally.
      - name: Run check-tf-iam-ssm-scope
        run: |
          python3 scripts/check_tf_iam_ssm_scope/check_tf_iam_ssm_scope.py \
            platform/terraform/modules/engine-provisioner/iam.tf

      - name: Run check-tf-iam-role-naming
        run: |
          python3 scripts/check_tf_iam_role_naming/check_tf_iam_role_naming.py

      # ADR-004-R20 / issue #1222: the self-hosted deploy runner must not be
      # placed in the account default VPC (a range's private-DNS VPC endpoints
      # can hijack its AWS API resolution). Mirrors the check-tf-runner-network
      # pre-commit hook so a commit that skipped pre-commit cannot drop the
      # fail-closed default-VPC precondition from the runner stack.
      - name: Run check-tf-runner-network
        run: |
          python3 scripts/check_tf_runner_network/check_tf_runner_network.py

      # Issue #1178: the shared range guest instance role must not grant SSM
      # Parameter Store access on a Resource that wildcards the environment or
      # range segment (parameter/shifter/*/range/*). Mirrors the
      # check-tf-iam-ssm-range-scope pre-commit hook so a commit that skipped
      # pre-commit cannot land the cross-range regression.
      - name: Run check-tf-iam-ssm-range-scope
        run: |
          python3 scripts/check_tf_iam_ssm_range_scope/check_tf_iam_ssm_range_scope.py \
            platform/terraform/modules/range/vpc/iam.tf

      # ADR-004-R12 / issue #140: first-party RDS instances must keep
      # IAM DB auth enabled and explicitly pin a CA identifier. Checkov
      # enforces IAM auth, but CKV_AWS_211 currently passes when the CA
      # attribute is absent, so this repo-native guard closes that gap.
      - name: Run check-tf-rds-security
        run: |
          python3 scripts/check_tf_rds_security/check_tf_rds_security.py \
            platform/terraform/modules/portal/rds/main.tf \
            platform/terraform/modules/guacamole/rds.tf

      # ADR-004-R11 / issue #147: Checkov pre-commit hook args must match
      # the security-iac job (config, directory, download_external_modules,
      # soft_fail=false).
      - name: Run check-checkov-invocation-parity
        run: python3 scripts/check_checkov_invocation_parity/check_checkov_invocation_parity.py

      # #911 NET-2 / #933: the portal target-service SGs (Django:8000,
      # Guacamole client:8080) must source ingress only from a security-group
      # reference or the ALB-only alb_ingress_subnet_cidrs output, never the
      # whole public tier (where CTFd lives). Guards the env-root SG rules so a
      # future edit cannot re-widen the source back to public_subnet_cidrs.
      - name: Run check-portal-target-sg-sources
        run: |
          python3 scripts/check_portal_target_sg_sources/check_portal_target_sg_sources.py \
            platform/terraform/environments/dev/portal/main.tf \
            platform/terraform/environments/prod/portal/main.tf

      # Pin the behavior of the check_tf_* IAM/security checkers
      # themselves. The live-file invocations above only exercise the
      # happy-path shape; the test suites cover wildcards, list
      # resources, scoped conditions, missing grants, etc. Run them so
      # a parser regression can't slip through merely because the
      # current production .tf files happen to remain in the
      # happy-path shape. Invoked as fully-qualified modules from the
      # repo root because each test uses `from .check_tf_X import …`
      # (relative imports require the package path, which
      # `unittest discover` doesn't preserve).
      - name: Run check_tf_* checker tests
        run: |
          python3 -m unittest scripts.check_tf_iam_ec2_scope.test_check_tf_iam_ec2_scope
          python3 -m unittest scripts.check_tf_iam_elb_scope.test_check_tf_iam_elb_scope
          python3 -m unittest scripts.check_tf_iam_ssm_scope.test_check_tf_iam_ssm_scope
          python3 -m unittest scripts.check_tf_iam_role_naming.test_check_tf_iam_role_naming
          python3 -m unittest scripts.check_tf_iam_ssm_range_scope.test_check_tf_iam_ssm_range_scope
          python3 -m unittest scripts.check_tf_sg_cidrs.test_check_tf_sg_cidrs
          python3 -m unittest scripts.check_tf_kms_secrets_grant.test_check_tf_kms_secrets_grant
          python3 -m unittest scripts.check_tf_rds_security.test_check_tf_rds_security
          python3 -m unittest scripts.check_portal_target_sg_sources.test_check_portal_target_sg_sources
          python3 -m unittest scripts.check_tf_runner_network.test_check_tf_runner_network

  # Pin the behavior of the Polaris CTFd workshop sync helpers. Issue #702
  # shipped 38/39 challenges unsubmittable because flag-row reconciliation
  # sat behind a category allowlist; these tests exercise the flag/hint
  # reconciliation, manifest validation, and post-sync verification with a
  # fake CTFd client. The scripts import siblings by bare name, so the test
  # runs from the package directory (its name contains a hyphen, so the
  # `unittest scripts.<pkg>` form the check_tf_* tests use is unavailable).
  # Pure stdlib — no dependency install needed.
  ctfd-workshop-tests:
    permissions:
      contents: read
    name: Test (ctfd-workshop)
    needs: [paths]
    if: ${{ !inputs.skip_tests && (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.ctfd_workshop == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Polaris CTFd sync tests
        working-directory: scripts/ctfd-workshop
        run: python3 -m unittest test_sync_polaris_ctfd

  shifter-platform-lint:
    permissions:
      contents: read
    name: Lint (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Lint Python
        working-directory: shifter/shifter_platform
        run: |
          uv run ruff check .
          uv run ruff format --check .

  shifter-platform-lint-js:
    permissions:
      contents: read
    name: Lint JavaScript/CSS (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: npm ci

      - name: Lint JavaScript
        working-directory: shifter/shifter_platform
        run: npx eslint static/js/

      - name: Lint CSS
        working-directory: shifter/shifter_platform
        run: npx stylelint static/css/

  shifter-platform-spa:
    permissions:
      contents: read
    name: SPA (shifter_platform frontend)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: shifter/shifter_platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: shifter/shifter_platform/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: shifter/shifter_platform/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: shifter/shifter_platform/frontend
        run: npm run typecheck

      - name: Unit tests (Vitest + axe)
        working-directory: shifter/shifter_platform/frontend
        run: npm run test:coverage

      - name: Build (Vite)
        working-directory: shifter/shifter_platform/frontend
        run: npm run build

  provisioner-lint:
    permissions:
      contents: read
    name: Lint (provisioner)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.provisioner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: shifter/engine/provisioner
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  packer-lint:
    permissions:
      contents: read
    name: Lint (packer)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.packer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: shifter/packer
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  bootstrap-lint:
    permissions:
      contents: read
    name: Lint (bootstrap)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.bootstrap == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/bootstrap
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  gcp-scripts-lint:
    permissions:
      contents: read
    name: Lint (gcp scripts)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.gcp_scripts == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/gcp
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  check-layer-imports-lint:
    permissions:
      contents: read
    name: Lint (check_layer_imports)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.check_layer_imports == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/check_layer_imports
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  handle-sd-replacement-lint:
    permissions:
      contents: read
    name: Lint (handle_sd_replacement)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.handle_sd_replacement == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/handle_sd_replacement
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  check-rds-pending-modifications-lint:
    permissions:
      contents: read
    name: Lint (check_rds_pending_modifications)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.check_rds_pending_modifications == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lint Python
        working-directory: scripts/check_rds_pending_modifications
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

  assert-portal-inspection-lint:
    permissions:
