[
  {
    "id": "ADR-001",
    "title": "Cross-layer access goes through service boundaries",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "Cross-layer imports may target shared contracts and explicitly allowed service seams only.",
    "rules": [
      {
        "id": "ADR-001-R1",
        "description": "Cross-layer imports must conform to scripts/check_layer_imports/layer_imports.yaml; service-package imports expose only the public facade (for example, cms.services), not private split-package implementation submodules such as cms.services._range_pause or from cms.services import _range_pause. CyberScript is retired and no layer, including shared, may import it; retained Shifter-owned contracts live natively under shared.",
        "checks": [
          "layer-imports"
        ]
      },
      {
        "id": "ADR-001-R2",
        "description": "Direct cross-layer model imports are disallowed by default and must be introduced intentionally.",
        "checks": [
          "cross-layer-model-imports"
        ]
      },
      {
        "id": "ADR-001-R3",
        "description": "Every first-party Django app is classified in scripts/check_layer_imports/layer_imports.yaml as a domain, presentation, support/contracts, or support/composition layer. An unclassified first-party app in INSTALLED_APPS, a stale classification entry with no local AppConfig, or a dynamic INSTALLED_APPS entry the checker cannot resolve fails closed. The retired documentation package (ADR-038) is not classified.",
        "checks": [
          "installed-apps-classified"
        ]
      },
      {
        "id": "ADR-001-R4",
        "description": "Mission Control calls the public service facade of the domain that owns the operation: cms.services for catalog, desired-state lifecycle, and control-plane orchestration; engine.services directly only for realized runtime/data-plane access such as terminal creation, SSH/RDP connection resolution, and NGFW terminal access. The mission_control -> engine.services seam is narrowed to a per-symbol allowlist in the allowed_symbols block of scripts/check_layer_imports/layer_imports.yaml (SSHConnection, connect_terminal, connect_ngfw_terminal, get_ssh_connection_info, get_rdp_connection_info, get_ranges_for_ngfw); importing any other engine.services symbol, or a bare engine.services module import that hides the symbol, is a violation, so control-plane engine operations still front through cms.services. A CMS pass-through must not be added solely to give presentation one downstream dependency; both paths remain limited to their public service facades.",
        "checks": [
          "layer-imports"
        ]
      }
    ],
    "exceptions": [],
    "enforcement": [
      "pre-commit",
      "ci",
      "claude-hook",
      "agent-policy"
    ],
    "evidence": [
      "scripts/check_layer_imports/layer_imports.yaml",
      "scripts/check_layer_imports/check_layer_imports.py",
      "scripts/adr_guard/adr_guard.py",
      ".importlinter",
      "shifter/shifter_platform/management/management/commands/check_model_fks.py",
      "docs/architecture/mission-control-runtime-service-boundary-preflight-994.md"
    ]
  },
  {
