{{- $policyBound := and .Values.openfga.enabled (ne .Values.openfga.storeId "") (ne .Values.openfga.modelId "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  namespace: {{ .Values.namespaces.platform }}
  {{- if .Values.capacityProfile.id }}
  annotations:
    shifter.dev/capacity-profile: {{ .Values.capacityProfile.id | quote }}
  {{- end }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: portal
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: portal
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: portal
        {{- if .Values.capacityProfile.id }}
        shifter.dev/capacity-profile: {{ .Values.capacityProfile.id | quote }}
        {{- end }}
      annotations:
        checksum/runtime-config: {{ include "shifter.runtimeConfigChecksum" . }}
        {{- if .Values.capacityProfile.id }}
        shifter.dev/capacity-profile: {{ .Values.capacityProfile.id | quote }}
        {{- end }}
    spec:
      {{- include "shifter.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ .Values.serviceAccounts.portal.name }} # NOSONAR - bound by rbac-job-launcher.yaml.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.portal.terminationGracePeriodSeconds }}
      {{- include "shifter.accessNodePlacement" . | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: shifter
                    app.kubernetes.io/component: portal
                topologyKey: kubernetes.io/hostname
      {{- include "shifter.cloudSqlProxyPod" (dict "root" . "autoIam" true) | nindent 6 }}
      containers:
        - name: portal
          image: {{ include "shifter.portalImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "shifter.containerSecurityContextApp" . | nindent 10 }}
          # readOnlyRootFilesystem is on (containerSecurityContextApp); the portal
          # writes media under MEDIA_ROOT=/app/media (Django FileSystemStorage, also
          # exercised by the storage health check on /health/), so it needs a
          # writable volume there in addition to /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: media
              mountPath: /app/media
            {{- if $policyBound }}
            - name: openfga-token
              mountPath: /run/secrets/openfga
              readOnly: true
            - name: openfga-ca
              mountPath: /run/secrets/openfga-ca
              readOnly: true
            {{- end }}
          envFrom:
            - configMapRef:
                name: platform-runtime
          {{- if or $policyBound .Values.cloudSqlProxy.enabled }}
          env:
            {{- include "shifter.databaseUserEnv" (dict "root" . "role" "portal") | nindent 12 }}
            {{- if $policyBound }}
            - name: OPENFGA_ENABLED
              value: "true"
            - name: OPENFGA_API_URL
              value: {{ printf "https://%s" .Values.openfga.hostname | quote }}
            - name: OPENFGA_STORE_ID
              value: {{ .Values.openfga.storeId | quote }}
            - name: OPENFGA_MODEL_ID
              value: {{ .Values.openfga.modelId | quote }}
            - name: OPENFGA_API_TOKEN_FILE
              value: /run/secrets/openfga/token
            - name: OPENFGA_CA_CERT_PATH
              value: /run/secrets/openfga-ca/ca.crt
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
        - name: media
          emptyDir:
            sizeLimit: {{ .Values.mediaVolume.sizeLimit | quote }}
        {{- if $policyBound }}
        - name: openfga-token
          secret:
            secretName: {{ .Values.openfga.runtimeSecretName }}
            items:
              - key: runtime-preshared-key
                path: token
        - name: openfga-ca
          configMap:
            name: {{ .Values.openfga.caConfigMapName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
