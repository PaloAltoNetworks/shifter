    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-global-dev-box
    path: platform/terraform/global/dev-box
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
      - registry.terraform.io/hashicorp/random
  - id: aws-global-se-admins
    path: platform/terraform/global/se-admins
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-global-ctfd-workshop
    path: platform/terraform/global/ctfd-workshop
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-polaris-range
    path: scripts/polaris-aws-range
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: provisioner-range
    path: shifter/engine/provisioner/terraform/modules/range
    owner: "@Brad-Edwards"
    toolchain: provisioner-1.14.3
    providers:
      - registry.terraform.io/hashicorp/aws
      - registry.terraform.io/hashicorp/random
      - registry.terraform.io/hashicorp/tls
  - id: provisioner-ngfw
    path: shifter/engine/provisioner/terraform/modules/ngfw
    owner: "@Brad-Edwards"
    toolchain: provisioner-1.14.3
    providers:
      - registry.terraform.io/hashicorp/aws
      - registry.terraform.io/hashicorp/tls

