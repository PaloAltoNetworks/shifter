    "id": "ADR-048",
    "title": "Organization administrator authority is a persisted org-scoped role, distinct from workspace roles, with a platform-superuser override",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "ADR-046-R8 deliberately left the organization/workspace tenancy layer with no organization-wide role, and ADR-046-R12 requires a separately accepted, service-owned authority rule before any organization mutation. This is that separately accepted rule. Organization authority is a persisted OrganizationMembership row with a closed org-scoped role (initially admin), owned by the workspaces domain and reachable only through workspaces.services. It is never derived at authorization time from a workspace role, Django staff/groups, Django model permissions, identity-provider claims, API-token scopes, or cloud roles; those derivations remain forbidden by ADR-046-R8/R12. A personal organization (ADR-046-R4) seeds its personal workspace owner as its bootstrap admin once, at creation and by backfill, after which authority is read only from the persisted membership. The single deliberate exception is a Django superuser (is_superuser), the platform-root operator that may read and update any organization as a platform-operator action recorded distinctly in audit; is_staff and model permissions alone still grant nothing. Organization profile reads and updates address the organization by its immutable public uuid, expose a closed scalar projection, and never emit the integer primary key. Updates are atomic: they lock the organization row, re-check live authority under the lock, write only changed fields, and emit one strict shared.audit event carrying changed field names and the internal organization id (never the field values) in the same transaction, so an audit-write failure rolls the update back. A missing organization, an organization outside the actor's authority, and insufficient authority share one opaque outcome. Mutable profile fields are explicit typed domain fields (name, description, support_email, support_url) with one validation path; there is no generic settings/branding/defaults JSON, and organization branding assets are out of scope until they have their own storage, content-type, and CSP contract. There is no organization create/delete/transfer, org-admin grant/revoke, or organization-wide role beyond admin in this iteration; a future shared-organization creation path must seed an admin so the last-admin invariant holds.",
