    "id": "ADR-033",
    "title": "Product, distribution, and development surfaces",
    "status": "superseded",
    "superseded_by": "ADR-053",
    "scope": "repository",
    "decision": "Shifter separates product (tenant), distribution, and development surfaces. A capability is product-plane when a bare operator tenant needs it to run or extend Shifter; content ingestion and supported artifact-preparation capabilities therefore cannot exist only in maintainer CI. Maintainers reuse a product capability when the same contract and policy apply, while genuinely distribution-only publication, promotion, replication, and credentialed preparation remain distribution-plane. Published artifacts may be exact requirements, allowed candidates, or optimizations and are not assumed to be caches or reproducible outputs. The CI/build/deploy runner fleet is development-plane and must not live in a product/operator deploy-target account (see ADR-033-R2, amended by #1546 for maintainer-owned dev tenants). Operator content acquisition and entitlement are resolved outside the platform.",
    "rules": [
      {
        "id": "ADR-033-R1",
        "description": "Capabilities a bare operator tenant needs to run or extend Shifter, including content ingestion and each artifact-preparation mechanism Shifter promises operators, are product-plane rather than maintainer-only CI. Maintainers reuse a product capability when the same inputs, policy, timing, and output contract apply; distribution-only publication, promotion, replication, or credentialed preparation may use separate operated workflows. This rule does not imply that every requirement is buildable or that every published artifact is reproducible.",
        "checks": []
      },
      {
        "id": "ADR-033-R2",
        "description": "The CI/build/deploy runner fleet is development-plane and must not reside in a product/operator deploy-target account; environment deploy/bake uses ephemeral compute in the target tenant or maintainer-isolated infrastructure, so environment teardown never removes the deploy mechanism. Amended by #1546 for maintainer-owned dev tenants (the only deployments that exist today; there is no product deployment model yet): a self-contained per-tenant runner MAY live in that tenant's own project when (a) it is a dedicated, re-creatable Terraform execution root with a state prefix separate from the platform root, so a platform destroy never removes it, and (b) the deploy mechanism itself remains the repo's bootstrap CLI (scripts/bootstrap, deploy.py runners), not tenant-resident state. Dev tenants must not depend on another tenant's runner fleet (cross-tenant containment): a GCP dev tenant runs its own CI/deploy rather than borrowing the AWS fleet.",
        "checks": []
      },
      {
        "id": "ADR-033-R3",
        "description": "Operator content acquisition and entitlement are resolved outside the platform; the platform contains no entitlement system (see ADR-034).",
        "checks": []
      }
