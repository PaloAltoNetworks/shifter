[project]
name = "range-functional-smoke"
version = "0.1.0"
description = "On-demand functional smoke that drives the terminal data-exchange and Guacamole-to-ready participant flows against a known-up example range (#987)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
# Resolving the login credential from GCP Secret Manager. The operator
# session-cookie actor source (the default) needs none of this.
gcp = [
    "google-cloud-secret-manager>=2.20",
]

[project.scripts]
range-functional-smoke = "range_functional_smoke.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["range_functional_smoke*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "T20", "SIM", "RUF", "C901"]
# T201: print is the operator-facing CLI output channel.
# S101: assert is the normal pytest idiom.
ignore = ["S101", "T201"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# S105/S106/S107: test fixtures use obviously-fake literal tokens ("TOK123") to
# assert that real ones are decoded and kept out of reports. No credential here.
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# B101 assert (pytest idiom).
skips = ["B101"]
