  {
    "id": "ADR-034",
    "title": "Uniform content-ingestion contract",
    "status": "accepted",
    "scope": "repository",
    "decision": "Content ingestion is one uniform, source-agnostic, entitlement-blind contract. The pack is the universal unit and no ingestion origin is a privileged path. Repo pack identity is bound to the canonical RAES associated-artifact digest at registration and verified again before native launch. Artifact satisfaction preserves the RAES exact, constrained, open, and absent author postures; the backend chooses a realization only where the authored requirement permits it and the selected backend declares support. Exact artifacts, existing backend artifacts, upstream-published pack candidates, dynamic composition, and explicitly permitted materialization specifications are possible mechanisms rather than an exhaustive pull-or-bake choice. Acquisition transport, satisfaction mechanism, and realization timing remain separate. Packs may carry no images or parameterized experiment runs. Ingestion validates realizability against the backend manifest and surfaces non-realizability to the author without creating loopholes. An upstream-published artifact may be authoritative, an allowed candidate, or an optimization; it is not inherently a cache or rebuildable substitute.",
    "rules": [
      {
        "id": "ADR-034-R1",
        "description": "Registering a pack is a single source-agnostic, entitlement-blind operation; packs from any origin (upstream-published, private, or self-authored) use the identical import path and no ingestion origin is a privileged path.",
        "checks": []
      },
      {
        "id": "ADR-034-R2",
        "description": "Artifact satisfaction preserves RAES author intent: exact artifacts must be honored, constrained requirements admit only conforming candidates, open concerns may be delegated only to a capable backend, and absence is not an implicit artifact request. Exact artifacts, existing backend inventory, pack-published candidates, dynamic composition, and explicitly permitted materialization specifications are possible mechanisms, not a closed pull-or-bake menu. Acquisition transport and realization timing are independent. Packs may carry zero images and may define parameterized experiment runs.",
        "checks": []
      },
      {
        "id": "ADR-034-R3",
        "description": "Ingestion validates realizability against the backend manifest and does not create loopholes; non-realizable packs are flagged and surfaced to the author.",
        "checks": []
      },
      {
        "id": "ADR-034-R4",
        "description": "The portable RAES artifact requirement is semantic authority. An upstream-published artifact may be the exact required artifact, an allowed candidate, or an optimization over a reproducible path; it is not inherently a cache, substitute, or rebuildable output. Entitlement for restricted or privately distributed content is resolved at acquisition, outside the platform; the platform contains no entitlement system.",
        "checks": []
      },
      {
        "id": "ADR-034-R5",
        "description": "A repo package_ref identifies a containment-checked pack root. Registration validates the upstream pack contract and binds the advertised package_digest to the exact canonical RAES associated-artifact inventory and bytes; native launch verifies that persisted digest again before SDL resolution, parsing, planning, or dispatch. Repo pack staging is immutable, and an object-backed pack becomes launchable only after its resolver provides equivalent bounded extraction, containment, immutable-object identity, contract validation, and digest guarantees.",
        "checks": []
      },
      {
        "id": "ADR-034-R6",
        "description": "Source-backed RAES content is resolved and deterministically materialized only while the containing pack is immutable, containment-checked, contract-validated, and digest-verified. Every source must bind explicitly to pack-associated input and a supported materialization format; path/name/extension sniffing, filesystem-order selection, and package-supplied executable code are prohibited. Materialized bytes use the existing provider-neutral object-storage boundary under a normalized content-addressed key, and only the immutable delivery identity permitted by ADR-032-R3 crosses to the provisioner; Shifter does not add a standalone artifact store or let guests access object storage.",
        "checks": []
      },
      {
        "id": "ADR-034-R7",
        "description": "Source-backed RAES feature artifacts reuse the uniform pack trust and delivery machinery without becoming content placements. A versioned discriminated projection binds feature type plus source name/version to an inventory-covered deterministic payload and bounded data-only install policy; content and feature entries keep distinct match semantics while sharing containment, size, digest, content-addressed storage, authenticated guest transport, and readback. Filename/extension inference, ambiguous wildcard resolution, contributor-supplied executable installers/probes, and a parallel feature artifact store are prohibited.",
        "checks": []
      },
      {
        "id": "ADR-034-R8",
        "description": "Shifter must evaluate artifact satisfiability before provisioning and report whether failure is due to an unavailable exact artifact, unsatisfied constraints, unsupported open realization, missing locked input, unavailable candidate, or unsupported backend mechanism. Long-running VM-image construction never starts on the provisioning critical path; bounded backend composition may occur during realization only when RAES author intent permits it and the backend declares and evidences that capability.",
        "checks": []
      },
      {
        "id": "ADR-034-R9",
        "description": "Optional in-tenant artifact preparation (#1583) uses explicit upstream permission and exact materialization profile/specification/input identity, a separately authorized preparation operation and isolated worker, independent output verification, and fenced admission into the existing backend inventory before normal launch. Shifter maintains the adapters and concrete build material needed by its supported scenarios. Built-in and private adapters use one versioned preparation/admission interface; authorized private-pack ingestion and administrator-controlled adapter installation remain possible after setup without a Shifter release, platform rebuild or upstream publication. A pack dependency grants neither executable installation nor tenant authority. Tenant registration binds immutable manifest/adapter/image versions, backend/profile support, input/output/verifier contracts and explicit grants; each operation pins those identities. Upgrade, disable and retirement preserve exact-version in-flight execution, provenance and bounded cleanup; cancellation or emergency revocation fences admission. Runtime capability/admission projections remain validated and tenant-confined under ADR-054; private extensions never widen the provisioner identity or command policy or become public discovery metadata. Existing admitted supply is reused without a worker; missing inventory, absent concerns and exact/non-buildable artifacts never imply build permission. This preparation boundary does not relax R6/R7's prohibition on executable content/feature-delivery hooks and does not own publication, promotion, replication or distribution (ADR-053).",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": [
      "agent-policy"
    ],
    "evidence": [
