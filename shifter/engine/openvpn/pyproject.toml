[project]
name = "shifter-openvpn"
version = "0.1.0"
description = "Shared participant OpenVPN server pool: OpenVPN plus its authorizing controller (#2480)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.13",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "T20", "SIM", "RUF", "C901"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["shifter_openvpn"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["shifter_openvpn"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
