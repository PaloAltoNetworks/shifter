apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-communication-worker
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: ctf-communication-worker
spec:
  replicas: {{ .Values.workers.ctfCommunicationWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: ctf-communication-worker
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: ctf-communication-worker
      annotations:
        checksum/runtime-config: {{ include "shifter.runtimeConfigChecksum" . }}
    spec:
      {{- include "shifter.podSecurityContext" . | nindent 6 }}
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.workers.name }}
      {{- include "shifter.podAntiAffinity" (dict "component" "ctf-communication-worker") | nindent 6 }}
      containers:
        - name: ctf-communication-worker
          image: {{ include "shifter.portalImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "shifter.containerSecurityContextApp" . | nindent 10 }}
          {{- include "shifter.tmpVolumeMount" . | nindent 10 }}
          args: ["python", "manage.py", "drain_ctf_communication_deliveries", "--loop", "--interval", "10"]
          envFrom:
            - configMapRef:
                name: platform-runtime
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/ctf-communication-worker-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.workers.ctfCommunicationWorker.resources | nindent 12 }}
      {{- include "shifter.tmpVolume" . | nindent 6 }}
