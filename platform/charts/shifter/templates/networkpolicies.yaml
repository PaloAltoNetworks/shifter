{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-platform
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-jobs
  namespace: {{ .Values.namespaces.jobs }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-dns-egress
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jobs-dns-egress
  namespace: {{ .Values.namespaces.jobs }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-ingress-to-platform-backends
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - portal
          - guacamole-client
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.gclbSourceRanges }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-guacamole-client-to-guacd
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: guacd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: guacamole-client
      ports:
        - protocol: TCP
          port: 4822
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-guacamole-client-egress-to-guacd
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: guacamole-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: guacd
      ports:
        - protocol: TCP
          port: 4822
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-google-apis-egress
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.googleApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jobs-google-apis-egress
  namespace: {{ .Values.namespaces.jobs }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.googleApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- if .Values.networkPolicy.rangeClusterApiCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jobs-range-cluster-egress
  namespace: {{ .Values.namespaces.jobs }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  # GDC range provisioning runs as Jobs that drive Terraform against the
  # range cluster's kube-apiserver. The control plane is fronted by an
  # internal TCP load balancer on the peered range network; allow egress
  # to that endpoint on the apiserver port (default 6444).
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.rangeClusterApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.rangeClusterApiPort | default 6444 }}
{{- end }}
{{- if .Values.networkPolicy.privateServiceCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-private-service-egress
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.privateServiceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          # Plaintext Redis (AWS ElastiCache + pre-#963 GCP Memorystore).
          port: 6379
        - protocol: TCP
          # Memorystore TLS endpoint (ADR-008-R6, #963).
          # `google_redis_instance.platform.port` returns 6378 when
          # transit_encryption_mode is SERVER_AUTHENTICATION; pods must be
          # able to reach it on egress or channels_redis cannot negotiate
          # TLS to the Memorystore instance.
          port: 6378
{{- end }}
{{- if .Values.networkPolicy.kubernetesApiCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-provisioner-launcher-kubernetes-api-egress
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker-provisioner-launcher
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.kubernetesApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if .Values.networkPolicy.rangeAccessCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-range-access-egress
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
spec:
  # Participant/operator range access (issue #1349): the portal ASGI pod dials
  # range guests for the browser SSH terminal, and guacd dials them for
  # Guacamole SSH/RDP. Range VMs are private-only, so without this egress the
  # GKE default-deny blocks the portal/guacd -> range path even though the
  # per-range GCE ingress firewall permits it. Scoped to just those two
  # workloads (not all platform pods; guacd, not guacamole-client, is the
  # dialer) and to the participant channel ports. AWS parity: the guacd egress
  # rule in platform/terraform/modules/guacamole/security.tf.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - portal
          - guacd
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.rangeAccessCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.rangeAccessPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
