        "id": "ADR-051-R12",
        "description": "The #2049 delivery engine extends the #2048 communication ledger rather than introducing another outbox or workflow owner. Occurrence release revalidates source authority and atomically commits bounded immutable audience, commands, in-app availability, and correlated strict audit; accepting a future declaration commits recoverable timing work without exposing future content. Release, lifecycle fencing, and worker claims share deterministic locking; claim leases fence stale completion, recovery, and retries without holding database locks across transport I/O. A claim is not evidence of a send. Reclaimed work rechecks cancellation and current scope; conflicting idempotent replay is rejected. Authored occurrence identity is separate from mutable retry/run-now timestamps; rescheduling fences superseded declarations, scheduler event routing never narrows campaign-wide authorization, and task controls cannot bypass communication policy. Lifecycle communication handoff is recoverable without browser polling. CMS retains range lease/credential-ceiling and expiry ownership independently of communication delivery. Scheduler completion, channel acceptance, participant receipt, and partial-failure aggregation retain distinct truthful meanings. Retry and backlog budgets are bounded and shared across processes, and all worker/configuration/secret/observability surfaces satisfy the #2049 preflight. These are architecture obligations; registry validation alone does not prove runtime delivery or recovery.",
