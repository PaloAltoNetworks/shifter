    "id": "ADR-032",
    "title": "How Shifter realizes RAES scenarios",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "Shifter realizes RAES by riding the RAES contract end to end, not by shadowing it. The pinned raes runtime (inside shared.raes) compiles a scenario into an RAES ProvisioningPlan; realization consumes that plan's authored intent and resolves concrete infrastructure at the backend. Authored intent is taken verbatim: the node image comes from the RAES source, sizing from resources, and os_family selects only the OS realization dialect. Concrete artifacts (image ids, machine sizes, subnet allocation, provider configuration, secrets) are resolved at realization time from the authored identity via backend-owned configuration, mirroring the reference RAES backends. A backend may fast-path a recognized authored identity or compiled-plan signature to a prebaked artifact for efficiency, but such recognition is a lookup keyed on authored/compiled content that must fail loud or fall through -- it must never sniff a scenario and reshape parsing or the model (the cyberscript/Polaris hardcoded-scenario anti-pattern is prohibited). Because Shifter realizes across a process boundary (the separate provisioner deployable), the authored provisioning-intent artifact that crosses the boundary is the serialized RAES ProvisioningPlan itself, read by a version-gated plain-data consumer whose semantics are tested against released public RAES accessors without importing the RAES module family. Source-backed content delivery may accompany dispatch only as a separately validated, immutable identity binding governed by ADR-032-R3; it is not authored intent or a second provisioning model. Participant-domain interactive-access intent may accompany it only as the separately validated, immutable compiled-address sidecar governed by ADR-032-R10; it never becomes provisioning-plan content or a participant-runtime capability claim. A consumer may materialize a bounded, process-local realization projection after validating the envelope, exact producer version, resource identities, resource types, payload shape, and topology references; that projection is not an authored contract, persistence schema, API DTO, or substitute RAES model. Shifter introduces no parallel SDL or re-modeled provisioning schema. RAES is a deliberate stack commitment: Shifter depends on the raes PyPI distribution pinned to a released version.",
    "interface_contract": {
      "kind": "raes-plan-accessor-boundary/v1",
      "transport": {
        "input": "serialized-raes-provisioning-plan",
        "owner": "shifter",
        "producer": "shared.raes",
        "consumer": "standalone-provisioner-plain-data-reader",
        "provisioner_imports_raes": false,
        "competing_projection": false
      },
      "ownership": {
        "semantics": "raes",
        "producer_validation": "shared.raes",
        "serialization": "shared.raes.runtime_target",
        "cross_process_validation": "shifter.engine.provisioner.raes_plan",
        "payload_access": "standalone-versioned-reader",
        "backend_policy": "shifter-provider-realization"
