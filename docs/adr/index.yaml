      {
        "id": "ADR-004-R25",
        "description": "Request-owned AWS OpenVPN gateways MUST preserve least-privilege IAM and ELBv2 delegation across both policy evaluators. The shared CI permissions boundary may exclude from `DenyIamEscalation` only the environment-scoped `role/shifter-${var.environment}-*-vpn-gateway` and `instance-profile/shifter-${var.environment}-*-vpn-gateway` namespaces, while a separate explicit deny prevents changing or deleting the gateway role's permissions boundary. The engine-provisioner identity policy remains the grant boundary: CreateRole requires the installation boundary, managed-policy attachment is limited to AmazonSSMManagedInstanceCore, and PassRole is limited to EC2. Its existing customer-managed ELB policy keeps GWLB and `shifter-vpn-*` NLB namespaces separate, authorizes CreateListener against the parent NLB ARN with both listener request tags and parent ownership resource tags, and permits AddTags only as a create-action dependency. The runtime `aws_lb_listener.vpn` sends `local.common_tags` in the create request. `scripts/check_tf_iam_role_naming` and `scripts/check_tf_iam_elb_scope` enforce these exact boundary, ARN, action, condition, and listener-tag shapes with focused negative tests; pre-commit and `_quality.yml` inspect both the policy and runtime Terraform inputs. Binding design note: `docs/architecture/proof-vpn-gateway-permissions-preflight-1755.md`. Established by #1755.",
        "checks": []
      },
      {
        "id": "ADR-004-R26",
        "description": "The GitHub Actions OIDC deploy-role stack `platform/terraform/global/iam` is applied out-of-band (not by the deploy pipeline), so a merged `github-oidc.tf` change can go un-applied and the live role drifts behind committed config - the recurring \"new resource -> next deploy 403s\" churn (issue #247). A CI drift-check workflow at `.github/workflows/iam-drift-check.yml` MUST run `terraform plan -detailed-exitcode -refresh=false` scoped to `platform/terraform/global/iam` and fail the build on a non-empty plan (exit code 2 = committed config diverged from the last-applied state). `-refresh=false` compares committed config against the last-applied remote state (the out-of-band-apply gap), so the read-only plan needs only S3 state read plus `sts:GetCallerIdentity` and never `iam:Get*`/`iam:List*` on the deploy role's own role or the GitHub OIDC provider - which the role is deliberately NOT granted (its IAM read is scoped to `role/shifter-*` and `role/${env}-*`, not `github-actions-shifter-${env}`), so a refreshing plan would fail closed on AccessDenied. The check is read-only (plan, never apply) and adds no permissions to the role. It MUST run only on push to a protected branch (a non-empty subset of {dev, main}) - never `pull_request`, `pull_request_target`, or any event other than push/workflow_dispatch, because the plan assumes the deploy role and a deploy-role job may not be reachable from an untrusted event (ADR-003-R5) - and MUST be path-scoped to global/iam; credential-free `terraform validate` at PR time is already provided by ADR-004-R11. Enforced by the `global-iam-drift-check` adr_guard check (`scripts/adr_guard/_guard/checks/_deploy_workflow_iam_drift.py`) at the `fast` and `ci` levels, which binds the push-only trigger, the {dev,main} branch allowlist, the global/iam path filter, and one designated plan step's real `terraform plan -detailed-exitcode` command, global/iam-scoped working directory, and non-swallowed exit status (no `|| true`, `exit 0`, or `continue-on-error`) together, so the gate cannot be silently removed or weakened by a `pull_request_target` variant, a wrong branch/path, an echoed or commented plan, a cross-job scope match, or a swallowed exit code. Anchored on GEN-002 (Executable Architecture Governance). Established by #247.",
