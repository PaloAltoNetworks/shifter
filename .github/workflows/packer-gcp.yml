name: Packer GCE Image Build

# Builds a Shifter guest image on Google Compute Engine, parallel to the AWS
# packer.yml flow (issue #505, PLAT-001.10). Runs on a GitHub-hosted runner
# (the self-hosted pool is AWS-only and cannot reach a GCE builder VM) and
# authenticates with Workload Identity Federation — no long-lived SA keys.
#
# The published image is the contract: each build writes image
# `${image_prefix}-<type>-<timestamp>` into image family `${image_prefix}-<type>`.
# Consumers resolve the newest non-deprecated image in the family (the GCP-native
# analog of the AWS /shifter/ami/* SSM parameter — there is no SSM equivalent).

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: 'GCE image to build'
        required: true
        type: choice
        options:
          - ubuntu
          - brokenbk
          - kali
          - windows
          - dc
          - dc-prebaked
      environment:
        description: 'GCP environment to build in'
        required: true
        type: choice
        options:
          - gcp-dev
          - orthanc
          - sauron
          - balrog
        default: gcp-dev
      dc_profile:
        description: 'Pre-promoted DC profile (dc-profiles/<name>.pkrvars.hcl); only used when image_type=dc-prebaked'
        required: false
        type: string
        default: ''
      publish_target:
        description: 'Reusable base image destination: ghcr (cross-tenant registry) or tenant (native image stays in the build project only)'
        required: false
        type: choice
        options:
          - ghcr
          - tenant
        default: ghcr

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.image_type }} GCE image in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The gcp-dev tenant's purpose Environments keep their historical short
    # suffix (gcp-build-dev), so map the gcp-dev tenant name back to `dev` here;
    # every other tenant uses its own name verbatim (gcp-build-<tenant>).
    environment: gcp-build-${{ inputs.environment == 'gcp-dev' && 'dev' || inputs.environment }}
    outputs:
      gce_image_id: ${{ steps.build_gce_image.outputs.image_id }}
      # Object name only: the bucket name embeds the project ID, a secret, and
      # Actions drops any job output that may contain a secret. The publish job
      # rebuilds the URI from the same environment's bucket variable.
      gce_base_disk_object: ${{ steps.export_gce_base_disk.outputs.object }}
      gce_base_disk_role: ${{ steps.export_gce_base_disk.outputs.role }}
      gce_base_disk_published: ${{ steps.export_gce_base_disk.outputs.published }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: shifter/packer
    env:
      IMAGE_TYPE: ${{ inputs.image_type }}
      DC_PROFILE: ${{ inputs.dc_profile }}
    steps:
      - name: Reject non-protected dispatch refs
        working-directory: ${{ github.workspace }}
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev|refs/heads/main) ;;
            *)
              echo "::error::packer-gcp builds may only run from dev or main; got '${GITHUB_REF}'."
              exit 1
              ;;
          esac

      # Build from the dispatched ref (github.sha), which GitHub already gates
      # by workflow_dispatch permission. No free-form `inputs.ref` is accepted:
      # a privileged, cloud-credentialed build must not run code from an
      # arbitrary caller-supplied branch (#505 codex security review).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate DC profile
        run: |
          if [[ "$IMAGE_TYPE" == "dc-prebaked" ]]; then
            if [[ ! "$DC_PROFILE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || [[ ! -f "gcp/dc-profiles/${DC_PROFILE}.pkrvars.hcl" ]]; then
              echo "::error::dc-prebaked requires an existing, explicitly selected DC profile."
              exit 1
            fi
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Packer tests
        run: uv run pytest tests/ -v

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: latest

      - name: Ensure GCP build auth is configured
        env:
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "${GCP_PACKER_BUILD_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_PACKER_BUILD_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured for GCE image builds. See docs/dev/deploy-secrets.md."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"

      - name: Resolve Packer variables from secrets/variables
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GCP_PACKER_ZONE: ${{ vars.GCP_PACKER_ZONE }}
          GCP_PACKER_NETWORK: ${{ vars.GCP_PACKER_NETWORK || 'default' }}
          GCP_PACKER_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK || 'default' }}
          GCP_PACKER_MACHINE_TYPE: ${{ vars.GCP_PACKER_MACHINE_TYPE || 'e2-standard-2' }}
          GCP_PACKER_USE_INTERNAL_IP: ${{ vars.GCP_PACKER_USE_INTERNAL_IP || 'false' }}
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Required secret GCP_PROJECT_ID is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          ZONE="${GCP_PACKER_ZONE:-${GCP_REGION}-a}"
          # The WIF caller, builder VM, Cloud Build job, and export worker share
          # the one purpose-scoped build identity. There is no fallback identity.
          BUILDER_SA="${GCP_PACKER_BUILD_SERVICE_ACCOUNT}"
          MACHINE_TYPE="${GCP_PACKER_MACHINE_TYPE}"
          # Export as PKR_VAR_* so Packer reads them from the environment — never
          # as -var CLI flags (which would expose values in the process list).
          {
            echo "PKR_VAR_project_id=${GCP_PROJECT_ID}"
            echo "PKR_VAR_zone=${ZONE}"
            echo "PKR_VAR_network=${GCP_PACKER_NETWORK}"
            echo "PKR_VAR_subnetwork=${GCP_PACKER_SUBNETWORK}"
            echo "PKR_VAR_service_account_email=${BUILDER_SA}"
            echo "PKR_VAR_image_prefix=shifter"
            echo "PKR_VAR_source_revision=${GITHUB_SHA}"
            echo "PKR_VAR_machine_type=${MACHINE_TYPE}"
            echo "PKR_VAR_use_internal_ip=${GCP_PACKER_USE_INTERNAL_IP}"
          } >> "$GITHUB_ENV"
          # Kali has no public GCP image; the kali builder instead converts the
          # debian-12 GCE base into Kali Rolling in its first provisioning script
          # (no imported base image, so no source-image secret is required).

      - name: Generate WinRM bootstrap secret (Windows/DC only)
        if: inputs.image_type == 'windows' || inputs.image_type == 'dc' || inputs.image_type == 'dc-prebaked'
        run: |
          # Throwaway local-admin password for the build-time WinRM connection.
          # For the sysprepped windows/dc images the sysprep discards it; the
          # un-sysprepped dc-prebaked image overwrites it (a2_setup resets the
          # domain Administrator, then plans/dc_setup.py rotates it per range).
          # Masked in logs and written via $GITHUB_ENV, never echoed or on argv.
          WINRM_PW="$(openssl rand -base64 24)"
          echo "::add-mask::${WINRM_PW}"
          echo "PKR_VAR_winrm_bootstrap_password=${WINRM_PW}" >> "$GITHUB_ENV"

      - name: Generate DSRM secret (pre-promoted DC only)
        if: inputs.image_type == 'dc-prebaked'
        run: |
          # Build-only DSRM (Directory Services Restore Mode) password for the
          # baked forest. Generated per build so no shared, source-controlled
          # DSRM secret ships in the image; promote-bake.ps1 requires it and
          # cleanup.ps1 strips the build transcript before capture. Masked and
          # passed via $GITHUB_ENV as a sensitive PKR var, never echoed or argv.
          DSRM_PW="$(openssl rand -base64 24)"
          echo "::add-mask::${DSRM_PW}"
          echo "PKR_VAR_dc_dsrm_password=${DSRM_PW}" >> "$GITHUB_ENV"

      - name: Initialize Packer
        working-directory: shifter/packer/gcp
        run: packer init .

      - name: Validate template
        working-directory: shifter/packer/gcp
        run: |
          # dc-prebaked bakes many DC images from one template; the profile
          # var-file supplies the domain / NetBIOS / content / purpose.
          VARFILE=""
          if [ "${IMAGE_TYPE}" = "dc-prebaked" ]; then
            VARFILE="-var-file=dc-profiles/${DC_PROFILE}.pkrvars.hcl"
          fi
          # shellcheck disable=SC2086
          packer validate -only="googlecompute.${IMAGE_TYPE}" ${VARFILE} .

      - name: Build GCE image
        id: build_gce_image
        working-directory: shifter/packer/gcp
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          VARFILE=""
          if [ "${IMAGE_TYPE}" = "dc-prebaked" ]; then
            VARFILE="-var-file=dc-profiles/${DC_PROFILE}.pkrvars.hcl"
          fi
          # shellcheck disable=SC2086
          packer build -color=false -only="googlecompute.${IMAGE_TYPE}" ${VARFILE} .
          IMAGE_NAME=$(jq -r '.builds[-1].artifact_id' "${IMAGE_TYPE}-manifest.json")
          IMAGE_ID="$(gcloud compute images describe "${IMAGE_NAME}" \
            --project="${GCP_PROJECT_ID}" --format='value(id)')"
          IMAGE_FAMILY="$(gcloud compute images describe "${IMAGE_NAME}" \
            --project="${GCP_PROJECT_ID}" --format='value(family)')"
          IMAGE_SOURCE_REVISION="$(gcloud compute images describe "${IMAGE_NAME}" \
            --project="${GCP_PROJECT_ID}" --format='value(labels.source-revision)')"
          if ! printf '%s' "${IMAGE_ID}" | grep -qE '^[0-9]+$'; then
            echo "::error::Built image has no valid server-assigned numeric ID."
            exit 1
          fi
          if [ "${IMAGE_SOURCE_REVISION}" != "${GITHUB_SHA}" ]; then
            echo "::error::Built image source-revision label does not match the dispatched commit."
            exit 1
          fi
          {
            echo "BUILT_IMAGE_NAME=${IMAGE_NAME}"
            echo "BUILT_IMAGE_ID=${IMAGE_ID}"
            echo "BUILT_IMAGE_FAMILY=${IMAGE_FAMILY}"
          } >> "${GITHUB_ENV}"
          echo "image_id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ inputs.environment }} GCE Image Build Complete"
            echo "- **Type:** ${IMAGE_TYPE}"
            echo "- **Environment:** ${{ inputs.environment }}"
            echo "- **Image:** \`${IMAGE_NAME}\` (ID \`${IMAGE_ID}\`)"
            echo "- **Family:** \`${IMAGE_FAMILY}\` (consumers resolve newest in family)"
            echo ""
            echo "**Next step:** Verify in ${{ inputs.environment }} before promoting to prod."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store immutable build-source evidence
        working-directory: shifter/packer/gcp
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          evidence="${RUNNER_TEMP}/gce-build-evidence.json"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow ".github/workflows/packer-gcp.yml" \
            --arg source_ref "${GITHUB_REF}" \
            --arg source_revision "${GITHUB_SHA}" \
            --arg image_name "${BUILT_IMAGE_NAME}" \
            --argjson image_id "${BUILT_IMAGE_ID}" \
            --arg image_family "${BUILT_IMAGE_FAMILY}" \
            --arg image_type "${IMAGE_TYPE}" \
            --arg environment "${{ inputs.environment }}" \
            --argjson build_run "${GITHUB_RUN_ID}" \
            --argjson build_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              schema_version: 1,
              repository: $repository,
              workflow: $workflow,
              source_ref: $source_ref,
              source_revision: $source_revision,
              image_name: $image_name,
              image_id: $image_id,
              image_family: $image_family,
              image_type: $image_type,
              environment: $environment,
              build_run: $build_run,
              build_run_attempt: $build_run_attempt
            }' > "${evidence}"
          if ! gcloud storage cp --quiet "${evidence}" \
            "gs://${GCP_PROJECT_ID}-release-evidence/packer-builds/${BUILT_IMAGE_ID}/build-evidence.json" \
            >/dev/null 2>&1; then
            echo "::error::Failed to store immutable build-source evidence."
            exit 1
          fi

      # A packer build publishes a native GCE image (the AWS-AMI analog) into
      # family shifter-<type>. For cross-tenant reuse (publish_target=ghcr),
      # export that image to GCS as a GCE-native disk tarball: the default
      # `gcloud compute images export` output is a .tar.gz of disk.raw, the exact
      # artifact `gcloud compute images create --source-uri` re-imports with no
      # conversion. The publish job then pushes that tarball to GHCR so a fresh
      # tenant bootstrap imports it instead of re-baking (issue #2309). The
      # reusable minimum base set is kali, ubuntu, and DC. With
      # publish_target=tenant the native image already lives in the build
      # project's family, so no export or GHCR publish runs.
      - name: Export image to GCS as a reusable GCE base disk
        id: export_gce_base_disk
        if: inputs.publish_target == 'ghcr' && (inputs.image_type == 'kali' || inputs.image_type == 'ubuntu' || inputs.image_type == 'dc-prebaked')
        working-directory: shifter/packer/gcp
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_GCE_BASE_IMAGE_BUCKET: ${{ vars.GCP_GCE_BASE_IMAGE_BUCKET }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GCP_PACKER_ZONE: ${{ vars.GCP_PACKER_ZONE }}
          GCP_PACKER_SUBNETWORK: ${{ vars.GCP_PACKER_SUBNETWORK }}
          GCP_PACKER_BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${GCP_GCE_BASE_IMAGE_BUCKET}" ]; then
            echo "::error::Required variable GCP_GCE_BASE_IMAGE_BUCKET (the reusable GCE base-image staging bucket) is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          IMAGE_NAME=$(jq -r '.builds[-1].artifact_id' "${IMAGE_TYPE}-manifest.json")
          ZONE="${GCP_PACKER_ZONE:-${GCP_REGION}-a}"
          # The reusable DC base is the pre-promoted dc-prebaked image - the only
          # DC the GCE range backend can boot (the generic 'dc' needs first-boot
          # promotion, disabled at runtime). Publish it under the 'dc' role so the
          # bootstrap consumer wires it into GCP_RANGE_DC_IMAGE.
          ROLE="${IMAGE_TYPE}"
          [ "${IMAGE_TYPE}" = "dc-prebaked" ] && ROLE="dc"
          # Immutable-by-name object keyed on the numeric image ID; the publish
          # job consumes only this object. Use BUILT_IMAGE_ID (exported to
          # GITHUB_ENV by the build step) - IMAGE_ID is local to that step and
          # would expand empty here, overwriting one <role>.tar.gz per build.
          # GCE-native tarball (disk.raw in a .tar.gz), not qcow2 - re-imported
          # directly by `gcloud compute images create --source-uri`, no conversion.
          OBJECT="${ROLE}-${BUILT_IMAGE_ID}.tar.gz"
          DEST="gs://${GCP_GCE_BASE_IMAGE_BUCKET}/${OBJECT}"
          # The export runs as a Cloud Build job that spins up a daisy worker VM.
          # Pin BOTH identities to the build SA: --cloudbuild-service-account so
          # the build itself runs as our least-priv SA (this project's builds
          # otherwise default to the Compute Engine default SA, which the build
          # SA has no actAs on), and --compute-service-account so the worker VM
          # runs as the same SA. Pin the worker to the internal-IP builder subnet
          # so it complies with the compute.vmExternalIpAccess org policy.
          BUILD_SA="${GCP_PACKER_BUILD_SERVICE_ACCOUNT}"
          # A user-managed Cloud Build SA can't write to the default
          # gs://<projnum>.cloudbuild-logs bucket, so --log-location is required
          # alongside --cloudbuild-service-account. Point it at the image bucket,
          # where the build SA already holds storage.objectAdmin.
          gcloud compute images export \
            --image="${IMAGE_NAME}" \
            --destination-uri="${DEST}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${ZONE}" \
            ${GCP_PACKER_SUBNETWORK:+--subnet="${GCP_PACKER_SUBNETWORK}"} \
            --cloudbuild-service-account="${BUILD_SA}" \
            --compute-service-account="${BUILD_SA}" \
            --log-location="gs://${GCP_GCE_BASE_IMAGE_BUCKET}/export-logs"
          {
            echo "object=${OBJECT}"
            echo "role=${ROLE}"
            echo "published=true"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Reusable GCE base disk exported"
            echo "- **Image:** \`${IMAGE_NAME}\`"
            echo "- **Exported disk:** \`${DEST}\` (GCE-native disk.raw tarball)"
            echo "- **Next:** published to GHCR for cross-tenant bootstrap reuse (see docs/architecture/gcp-guest-images.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image_type }}-gce-manifest
          path: shifter/packer/gcp/${{ inputs.image_type }}-manifest.json

      - name: Remove local build-source evidence
        if: always()
        run: rm -f "${RUNNER_TEMP}/gce-build-evidence.json"

  publish-gce-base-image:
    name: Publish ${{ inputs.image_type }} GCE base image to GHCR
    needs: build
    # Publish the reusable GCE-native base image (kali, ubuntu, DC) so a fresh
    # tenant bootstrap imports it instead of re-baking with Packer (issue #2309).
    # Runs only for publish_target=ghcr; publish_target=tenant leaves the native
    # image in the build project's family with no registry copy.
    if: >-
      inputs.publish_target == 'ghcr' &&
      needs.build.outputs.gce_base_disk_published == 'true' &&
      (inputs.image_type == 'kali' || inputs.image_type == 'ubuntu' || inputs.image_type == 'dc-prebaked')
    runs-on: ubuntu-latest
    environment: gcp-build-${{ inputs.environment == 'gcp-dev' && 'dev' || inputs.environment }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Authenticate to GCP for the exported disk
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PACKER_BUILD_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Publish GCE base image to GHCR
        env:
          GCE_BASE_DISK_URI: gs://${{ vars.GCP_GCE_BASE_IMAGE_BUCKET }}/${{ needs.build.outputs.gce_base_disk_object }}
          GCE_IMAGE_ID: ${{ needs.build.outputs.gce_image_id }}
          IMAGE_TYPE: ${{ needs.build.outputs.gce_base_disk_role }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/dev|refs/heads/main) ;;
            *)
              echo "::error::GHCR base-image publication requires a protected dispatch ref."
              exit 1
              ;;
          esac
          case "${IMAGE_TYPE}" in kali|ubuntu|dc) ;; *) exit 1 ;; esac
          case "${GCE_BASE_DISK_URI}" in gs://?*/?*.tar.gz) ;; *)
            echo "::error::Expected a GCS GCE-native disk tarball export, got an invalid disk URI."
            exit 1
            ;;
          esac
          PACKAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shifter-gce-${IMAGE_TYPE}"
          TAG="gce-${GCE_IMAGE_ID}"
          DISK_DIR="$(mktemp -d "${RUNNER_TEMP}/gce-disk.XXXXXX")"
          DISK_FILE="${IMAGE_TYPE}.tar.gz"
          trap 'rm -f "${DISK_DIR}/${DISK_FILE}"; rmdir "${DISK_DIR}"' EXIT
          # ORAS hashes a file before upload. Keep the disk out of the checkout
          # and clean it even when the registry upload fails.
          gcloud storage cp --quiet "${GCE_BASE_DISK_URI}" "${DISK_DIR}/${DISK_FILE}"
          printf '%s' "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          # Provenance annotations bind the artifact to its protected build so the
          # tenant bootstrap can validate it before importing (issue #2309). The
          # digest-pinned reference (never the mutable tag) is the deploy input.
          # ORAS rejects absolute file paths, so push the file by its relative
          # name from its own directory.
          cd "${DISK_DIR}"
          DIGEST="$(oras push --format json \
            --artifact-type application/vnd.shifter.gce-image.v1 \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "com.shifter.image.role=${IMAGE_TYPE}" \
            --annotation "com.shifter.image.gce-image-id=${GCE_IMAGE_ID}" \
            --annotation "com.shifter.build.run-id=${GITHUB_RUN_ID}" \
            --annotation "com.shifter.build.repository=${GITHUB_REPOSITORY}" \
            "${PACKAGE}:${TAG}" "${DISK_FILE}:application/vnd.shifter.gce-image.tar.gz" | jq -er '.digest')"
          case "${DIGEST}" in sha256:[0-9a-f][0-9a-f]*) ;; *)
            echo "::error::ORAS did not return an OCI manifest digest."
            exit 1
            ;;
          esac
          {
            echo "## GHCR GCE base image published"
            echo "- **Package:** \`${PACKAGE}\`"
            echo "- **Version tag:** \`${TAG}\` (discovery only)"
            echo "- **Immutable source:** \`oci://${PACKAGE}@${DIGEST}\`"
            echo "- **Payload:** GCE-native disk.raw tarball; the tenant bootstrap imports it as a native GCE image."
            echo "- **Note:** set this package public once so bootstrap pulls it credential-free (private-package support: issue #2312)."
          } >> "$GITHUB_STEP_SUMMARY"
