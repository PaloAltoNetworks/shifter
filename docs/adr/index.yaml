    "decision": "Range egress uses one provider-neutral vocabulary (`mode` + `allowed_cidrs`) validated by shifter/installation/range_egress.py and translated into each cloud's native controls. `settings.range_egress` in shifter.yaml remains the deployment baseline and its provider Terraform inputs remain internal bridges. A workspace may select only the compatibility posture or the canonical `none` posture; CMS resolves that selector against the normalized deployment baseline at the locked launch-admission seam, pins one effective mode on the Engine range, and delivers it through the exact operation-generation input. The default preserves each backend's existing posture. CIDRs are non-secret operator configuration and remain deployment-global unless a later decision adds a workspace-owned allowlist shape.",
