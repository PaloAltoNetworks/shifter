name: GCP Dev

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      deploy_changes:
        required: true
        type: boolean
      require_active_certificate:
        description: >-
          Fail the deploy if the managed certificate is not Active for the public
          hostname (the portal is rendered for https://<hostname> only). Set false
          for first-time bootstrap before DNS is pointed at the ingress IP.
        required: false
        type: boolean
        default: true
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_BOOTSTRAP_ADMIN_EMAIL:
        required: false
      GCP_BOOTSTRAP_ADMIN_PASSWORD:
        required: false
      PLATFORM_BOOTSTRAP_STAFF_EMAILS:
        required: false
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS:
        required: false
      # Deployment-owned identity values rendered into local.auto.tfvars at
      # deploy time. See docs/dev/deploy-secrets.md for the canonical list.
      GCP_PROJECT_ID:
        required: false
      GCP_PUBLIC_HOSTNAME:
        required: false
      GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN:
        required: false
      GCP_MASTER_AUTHORIZED_CIDRS:
        required: false
      # Deployment shifter.yaml (full root installation config). The range egress
      # allowlist (range_egress_mode + range_egress_allowed_cidrs) is rendered from
      # its settings.range_egress, so it is the single source for the deployed
      # firewall. required: false for dispatch-time evaluation; the render step
      # fails loud when it is empty.
      SHIFTER_CONFIG_GCP_DEV:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ inputs.environment }})
    # Validation does not need deploy-network access; keep PR checks off the deploy runner pool.
    runs-on: ubuntu-latest
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.7.1"
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.34.1
      - name: Install kubeconform
        run: |
          # ADR-037-R3: verify the download against the release CHECKSUMS
          # manifest before extraction. The archive is saved under the exact name
          # the manifest references so `sha256sum -c` matches.
          curl -fsSL -o /tmp/kubeconform-linux-amd64.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o /tmp/kubeconform.CHECKSUMS \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS"
          (cd /tmp && grep "kubeconform-linux-amd64.tar.gz" kubeconform.CHECKSUMS | sha256sum -c -)
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
      - run: terraform fmt -check -recursive
        working-directory: platform/terraform/gcp
      - run: terraform init -backend=false
        working-directory: platform/terraform/gcp/environments/${{ inputs.environment }}
      - run: terraform validate
        working-directory: platform/terraform/gcp/environments/${{ inputs.environment }}
      - run: |
          (
            kubectl kustomize "platform/k8s/gcp/overlays/${GCP_ENVIRONMENT}"
            printf '\n---\n'
            cat "platform/k8s/gcp/overlays/${GCP_ENVIRONMENT}/platform-edge.generated.yaml"
          ) > /tmp/gcp-platform.yaml
      - run: /tmp/kubeconform -strict -summary /tmp/gcp-platform.yaml

  deploy:
    # Runs on the GCP tenant's own runner (label gcp-dev), provisioned by
    # `deploy.py runners --cloud gcp` (issue #1546), so a GCP dev tenant deploys
    # without borrowing the AWS self-hosted fleet. gcp-dev is self-hosted-class
    # to the ADR-003-R5 exposure checker, so the PR gate below still applies.
    name: Deploy (${{ inputs.environment }})
    runs-on: gcp-dev
    environment: ${{ inputs.github_environment }}
    needs: validate
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GCP_ENVIRONMENT: ${{ inputs.environment }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      TF_DIR: platform/terraform/gcp/environments/${{ inputs.environment }}
      K8S_OVERLAY_DIR: platform/k8s/gcp/overlays/${{ inputs.environment }}
      TF_BACKEND_PREFIX: shifter/${{ inputs.environment }}/platform-core
      EDGE_CERT_NAME: platform-managed-cert
      PLATFORM_BOOTSTRAP_STAFF_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_STAFF_EMAILS }}
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS: ${{ secrets.PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS }}
      GCP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.GCP_BOOTSTRAP_ADMIN_EMAIL }}
      GCP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.GCP_BOOTSTRAP_ADMIN_PASSWORD }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      # Explicit, audited opt-out for the first Identity Platform operator bootstrap.
      # Set the repo variable to "true" to deliberately skip operator creation; the
      # preflight downgrades the missing-credential failure to a logged warning and
      # the seed step below is skipped. Unset/false keeps operator creds required.
      SHIFTER_SKIP_OPERATOR_BOOTSTRAP: ${{ vars.SHIFTER_SKIP_OPERATOR_BOOTSTRAP }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Ensure GCP deploy auth is configured
        run: |
          if [ -z "${GCP_SERVICE_ACCOUNT}" ] || [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT and GCP_WORKLOAD_IDENTITY_PROVIDER must be configured for gcp-dev deploys"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 416.0.0"
          install_components: gke-gcloud-auth-plugin
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.34.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.7.1"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Preflight - validate deploy prerequisites
        # Shared fail-safe gate (scripts/bootstrap/preflight.py): reports every
        # missing prerequisite up front before Terraform/Helm run, so a missing
        # secret fails here in seconds rather than mid-run. The bootstrap operator
        # credentials are required unless SHIFTER_SKIP_OPERATOR_BOOTSTRAP=true.
        # See docs/dev/deploy-secrets.md.
        working-directory: scripts/bootstrap
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_MASTER_AUTHORIZED_CIDRS: ${{ secrets.GCP_MASTER_AUTHORIZED_CIDRS }}
        run: uv run python -m preflight --cloud gcp --env "${GCP_ENVIRONMENT}" --headless
      - name: Render local.auto.tfvars from secrets/variables
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          GCP_PUBLIC_HOSTNAME: ${{ secrets.GCP_PUBLIC_HOSTNAME }}
          GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN: ${{ secrets.GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN }}
          GCP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.GCP_BOOTSTRAP_ADMIN_EMAIL }}
          GCP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.GCP_BOOTSTRAP_ADMIN_PASSWORD }}
        # The committed `terraform.tfvars` ships an example.com baseline that
        # fails-loud on apply. Each deployment provides its real values via
        # the GitHub secrets/variables listed above; this step renders them
        # into a `local.auto.tfvars` that Terraform auto-loads alongside the
        # baseline (deployment values override). See docs/dev/deploy-secrets.md
        # for the full required surface.
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Required secret GCP_PROJECT_ID is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          if [ -z "${GCP_PUBLIC_HOSTNAME}" ]; then
            echo "::error::Required secret GCP_PUBLIC_HOSTNAME is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          if [ -z "${GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN}" ]; then
            echo "::error::Required secret GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          # The GKE control plane is PRIVATE (#1723): it has no public endpoint,
          # so there is no public IP to allowlist and no runner-IP merging to do.
          # The deploy reaches the control plane over Connect Gateway (the fleet
          # membership; see the "Configure kubectl for the GKE cluster" step),
          # which is IAM-authenticated rather than network-allowlisted. A private
          # endpoint requires master_authorized_networks to be enabled but permits
          # an empty cidr_blocks list, so pin it empty.
          cat > "${TF_DIR}/local.auto.tfvars" <<EOF
          # Auto-generated by .github/workflows/_gcp-dev.yml; do not commit.
          project_id                    = "${GCP_PROJECT_ID}"
          region                        = "${GCP_REGION}"
          artifact_registry_location    = "${GCP_REGION}"
          public_hostname               = "${GCP_PUBLIC_HOSTNAME}"
          identity_allowed_email_domain = "${GCP_IDENTITY_ALLOWED_EMAIL_DOMAIN}"
          gke_master_authorized_cidrs   = []
          EOF
          # First Identity Platform operator credentials (issue #1570). The
          # bootstrap script (scripts/bootstrap/gcp_control_plane.py) reads these
          # from this overlay as the authoritative source, so a rotated password
          # persists across redeploys instead of being lost. Appended only when
          # the secrets are set; unset leaves the create-if-absent bootstrap on
          # its existing fallback. Written by redirection, never echoed (#1015).
          if [ -n "${GCP_BOOTSTRAP_ADMIN_EMAIL}" ]; then
            printf 'gcp_bootstrap_admin_email    = "%s"\n' "${GCP_BOOTSTRAP_ADMIN_EMAIL}" >> "${TF_DIR}/local.auto.tfvars"
          fi
          if [ -n "${GCP_BOOTSTRAP_ADMIN_PASSWORD}" ]; then
            printf 'gcp_bootstrap_admin_password = "%s"\n' "${GCP_BOOTSTRAP_ADMIN_PASSWORD}" >> "${TF_DIR}/local.auto.tfvars"
          fi
      - name: Render range egress allowlist from shifter.yaml
        env:
          SHIFTER_CONFIG_GCP_DEV: ${{ secrets.SHIFTER_CONFIG_GCP_DEV }}
        run: |
          if [ -z "${SHIFTER_CONFIG_GCP_DEV}" ]; then
            echo "::error::Required secret SHIFTER_CONFIG_GCP_DEV is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          # Write the deployment config to an ephemeral file outside the repo tree,
          # then render its settings.range_egress into the GCP bridge tfvars
          # (range_egress_mode + range_egress_allowed_cidrs) as a SEPARATE file from
          # the generated local.auto.tfvars, so re-rendering the allowlist never
          # clobbers the project/hostname/control-plane overrides. shifter.yaml holds
          # secret *references*, not values, but is still treated as sensitive:
          # written by redirection, never echoed, passed in argv, or uploaded (#1015).
          CONFIG_FILE="${RUNNER_TEMP}/shifter.yaml"
          printf '%s\n' "${SHIFTER_CONFIG_GCP_DEV}" > "${CONFIG_FILE}"
          uv run --project "${GITHUB_WORKSPACE}/shifter/installation" \
            shifter-config render "${CONFIG_FILE}" \
            --output "${TF_DIR}/range_egress.auto.tfvars"
      - name: Bootstrap Terraform backend metadata
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          TF_STATE_BUCKET="${PROJECT_ID}-terraform-state"
          TF_STATE_RETENTION_DAYS=30
          TF_STATE_RETENTION_PERIOD_SECONDS=$((TF_STATE_RETENTION_DAYS * 24 * 60 * 60))
          {
            echo "PROJECT_ID=${PROJECT_ID}"
            echo "REGION=${REGION}"
            echo "TF_STATE_BUCKET=${TF_STATE_BUCKET}"
            echo "TF_STATE_RETENTION_DAYS=${TF_STATE_RETENTION_DAYS}"
            echo "TF_STATE_RETENTION_PERIOD_SECONDS=${TF_STATE_RETENTION_PERIOD_SECONDS}"
          } >> "$GITHUB_ENV"
      - name: Bootstrap Terraform state bucket
        run: |
          if ! gcloud storage buckets describe "gs://${TF_STATE_BUCKET}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${TF_STATE_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --uniform-bucket-level-access \
              --public-access-prevention
          fi
          gcloud storage buckets update "gs://${TF_STATE_BUCKET}" --versioning
          RETENTION_DESCRIBE_ERR_FILE=$(mktemp)
          if ! CURRENT_RETENTION_SECONDS=$(gcloud storage buckets describe "gs://${TF_STATE_BUCKET}" --project "${PROJECT_ID}" --format='value(retentionPolicy.retentionPeriod)' 2>"${RETENTION_DESCRIBE_ERR_FILE}"); then
            echo "::error::Failed to read Terraform state bucket retention policy for ${TF_STATE_BUCKET}: $(cat "${RETENTION_DESCRIBE_ERR_FILE}")"
            rm -f "${RETENTION_DESCRIBE_ERR_FILE}"
            exit 1
          fi
          rm -f "${RETENTION_DESCRIBE_ERR_FILE}"
          # Keep stricter existing retention policies; only raise retention when needed.
          if [ -z "${CURRENT_RETENTION_SECONDS}" ] || [ "${CURRENT_RETENTION_SECONDS}" -lt "${TF_STATE_RETENTION_PERIOD_SECONDS}" ]; then
            gcloud storage buckets update "gs://${TF_STATE_BUCKET}" --project "${PROJECT_ID}" --retention-period="${TF_STATE_RETENTION_PERIOD_SECONDS}s"
          fi
          # Remove broad/public bucket bindings only when present so real IAM errors still fail the workflow.
          remove_bucket_binding_if_present() {
            local member="$1"
            local role="$2"
            local has_binding
            # `gcloud storage buckets get-iam-policy` does not accept --filter on
            # all gcloud versions, so pull the policy as JSON and test the
            # (role, member) pair with python instead.
            has_binding=$(gcloud storage buckets get-iam-policy "gs://${TF_STATE_BUCKET}" \
              --project="${PROJECT_ID}" --format=json \
              | python3 -c "import json,sys; p=json.load(sys.stdin); print('yes' if any(b.get('role')=='${role}' and '${member}' in (b.get('members') or []) for b in (p.get('bindings') or [])) else '')")
            if [ -n "${has_binding}" ]; then
              gcloud storage buckets remove-iam-policy-binding "gs://${TF_STATE_BUCKET}" \
                --project="${PROJECT_ID}" \
                --member="${member}" \
                --role="${role}" >/dev/null
              echo "Removed ${member} from ${role} on ${TF_STATE_BUCKET}"
            fi
          }
          gcloud storage buckets add-iam-policy-binding "gs://${TF_STATE_BUCKET}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:${GCP_SERVICE_ACCOUNT}" \
            --role="roles/storage.legacyBucketReader" >/dev/null
          gcloud storage buckets add-iam-policy-binding "gs://${TF_STATE_BUCKET}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:${GCP_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectAdmin" >/dev/null
          remove_bucket_binding_if_present "allUsers" "roles/storage.objectViewer"
          remove_bucket_binding_if_present "allAuthenticatedUsers" "roles/storage.objectViewer"
          remove_bucket_binding_if_present "projectOwner:${PROJECT_ID}" "roles/storage.legacyBucketOwner"
          remove_bucket_binding_if_present "projectEditor:${PROJECT_ID}" "roles/storage.legacyBucketOwner"
          remove_bucket_binding_if_present "projectViewer:${PROJECT_ID}" "roles/storage.legacyBucketReader"
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_BACKEND_PREFIX}"
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve
      - name: Capture Terraform outputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -json > /tmp/gcp-terraform-outputs.json
      - name: Configure kubectl for the GKE cluster
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        # The control plane is private (#1723): reach it over Connect Gateway via
        # the cluster's fleet membership (name == cluster name, location == cluster
        # region), not the (now non-existent) public endpoint. This is
        # IAM-authenticated; kubectl authorizes through GKE's IAM->RBAC mapping
        # (the CI service account holds roles/container.admin + the gkehub gateway
        # roles). Requires the connectgateway/gkeconnect/gkehub APIs (enabled by
        # platform-core) and the cluster's fleet { project } registration.
        run: |
          CLUSTER=$(python3 -c "import json;print(json.load(open('/tmp/gcp-terraform-outputs.json'))['gke_cluster_name']['value'])")
          LOCATION=$(python3 -c "import json;print(json.load(open('/tmp/gcp-terraform-outputs.json'))['gke_cluster_location']['value'])")
          gcloud container fleet memberships get-credentials "${CLUSTER}" \
            --location "${LOCATION}" --project "${GCP_PROJECT_ID}"
      - name: Seed Identity Platform bootstrap operator
        # Runs unless operator bootstrap is explicitly opted out. The preflight
        # step already failed the deploy if the credentials were missing without
        # the opt-out, so reaching here means creds are present (seed) or the
        # opt-out is set (skip) -- never a silent no-op on empty secrets.
        if: env.SHIFTER_SKIP_OPERATOR_BOOTSTRAP != 'true'
        # Run under the bootstrap project's interpreter (Python 3.12 + its deps);
        # the runner's system python3 is too old for deploy.py's `X | None` unions.
        run: |
          uv run --project scripts/bootstrap python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          module_path = Path("scripts/bootstrap/deploy.py")
          # deploy.py imports sibling modules (terraform_backend, ...); put its
          # directory on sys.path so those resolve when loaded by file location.
          sys.path.insert(0, str(module_path.parent))
          spec = importlib.util.spec_from_file_location("bootstrap_deploy", module_path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"Unable to load bootstrap module from {module_path}")
          module = importlib.util.module_from_spec(spec)
          # Register in sys.modules before exec_module (importlib docs recipe):
          # deploy.py runs `_THIS_MODULE = sys.modules[__name__]` at import time,
          # which KeyErrors when the module is exec'd without being registered.
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          outputs = json.loads(Path("/tmp/gcp-terraform-outputs.json").read_text())
          config = module.GDCBootstrapConfig(
              project_id=os.environ["PROJECT_ID"],
              cluster_id="cluster1",
          )
          module.ensure_gcp_identity_platform_operator(config, outputs)
          PY
      - name: Export deploy metadata
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outputs = json.loads(Path("/tmp/gcp-terraform-outputs.json").read_text())

          def value(key):
              return outputs[key]["value"]

          image_roots = value("artifact_registry_image_roots")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"GKE_CLUSTER_NAME={value('gke_cluster_name')}\n")
              env_file.write(f"GKE_CLUSTER_LOCATION={value('gke_cluster_location')}\n")
              env_file.write(f"PORTAL_IMAGE_ROOT={image_roots['portal']}\n")
              env_file.write(f"GUACD_IMAGE_ROOT={image_roots['guacd']}\n")
              env_file.write(f"GUACAMOLE_CLIENT_IMAGE_ROOT={image_roots['guacamole-client']}\n")
              env_file.write(f"PROVISIONER_IMAGE_ROOT={image_roots['pulumi-provisioner']}\n")
              env_file.write(f"ARTIFACT_REGISTRY_HOST={image_roots['portal'].split('/')[0]}\n")
              env_file.write(f"PUBLIC_HOSTNAME={value('public_hostname')}\n")
          PY
      - name: Login to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Rewrite overlay image project and service accounts
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["K8S_OVERLAY_DIR"]) / "kustomization.yaml"
          content = path.read_text(encoding="utf-8")

          # The committed newName values carry a placeholder Artifact Registry
          # project; rewrite it to the deployment's real AR project (taken from
          # the build's PORTAL_IMAGE_ROOT) so pods pull from where the images were
          # actually pushed, not the committed placeholder. Image identity is
          # pinned to a verified @sha256 digest AFTER the build (ADR-037-R6, the
          # "Pin overlay images to verified digests" step below), never a tag.
          project = re.search(r"pkg\.dev/([^/]+)/", os.environ["PORTAL_IMAGE_ROOT"]).group(1)
          updated, name_fixes = re.subn(
            r"(?m)^(\s*newName:\s*\S*?pkg\.dev/)[^/]+/",
            rf"\g<1>{project}/",
            content,
          )
          path.write_text(updated, encoding="utf-8")
          print(f"Rewrote {name_fixes} image projects to {project}")

          # The Workload Identity GSA annotations carry the same placeholder
          # project; point them at the deployment project so the pods' KSAs
          # impersonate real (existing) service accounts.
          sa_patch = Path(os.environ["K8S_OVERLAY_DIR"]) / "patch-serviceaccounts.patch"
          if sa_patch.exists():
            sa_updated, sa_fixes = re.subn(
              r"(@)[^.@]+(\.iam\.gserviceaccount\.com)",
              rf"\g<1>{project}\g<2>",
              sa_patch.read_text(encoding="utf-8"),
            )
            sa_patch.write_text(sa_updated, encoding="utf-8")
            print(f"Rewrote {sa_fixes} service-account GSA projects to {project}")
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and push portal image
        id: build-portal
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter
          file: ./shifter/shifter_platform/Dockerfile
          push: true
          tags: |
            ${{ env.PORTAL_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          # Build provenance (ADR-037-R5): SBOM + max provenance, attested below.
          provenance: mode=max
          sbom: true
      - name: Build and push provisioner image
        id: build-provisioner
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter
          file: ./shifter/engine/provisioner/Dockerfile
          push: true
          tags: |
            ${{ env.PROVISIONER_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push guacd image
        id: build-guacd
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter/engine/guacd
          push: true
          tags: |
            ${{ env.GUACD_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Build and push guacamole-client image
        id: build-guacamole-client
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./shifter/engine/guacamole
          push: true
          tags: |
            ${{ env.GUACAMOLE_CLIENT_IMAGE_ROOT }}:${{ env.SHORT_SHA }}
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Attest build provenance (portal)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.PORTAL_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-portal.outputs.digest }}
          push-to-registry: false
      - name: Attest build provenance (provisioner)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.PROVISIONER_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-provisioner.outputs.digest }}
          push-to-registry: false
      - name: Attest build provenance (guacd)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.GUACD_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-guacd.outputs.digest }}
          push-to-registry: false
      - name: Attest build provenance (guacamole-client)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.GUACAMOLE_CLIENT_IMAGE_ROOT }}
          subject-digest: ${{ steps.build-guacamole-client.outputs.digest }}
          push-to-registry: false
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_CLUSTER_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}
      - name: Render generated runtime env
        env:
          # ENGINE_TASK_IMAGE is pinned to the verified provisioner @sha256
          # digest (ADR-037-R6), not a mutable tag; the GKE admission policy
          # (ADR-006-R4) follows this exact value.
          PROVISIONER_DIGEST: ${{ steps.build-provisioner.outputs.digest }}
          # GCE range-cell backend config (issue #1387). Non-secret; sourced from
          # repository/environment variables so each account supplies its own
          # image families, zone, and service accounts. Unset variables fall back
          # to code defaults (config.py). The range backend defaults to gce; set
          # variable GCP_RANGE_BACKEND=gdc to roll back to GDC VM Runtime.
          GCP_RANGE_BACKEND: ${{ vars.GCP_RANGE_BACKEND }}
          RANGE_NETWORK_ZONE: ${{ vars.RANGE_NETWORK_ZONE }}
          GCP_RANGE_CELL_PROJECT_ID: ${{ vars.GCP_RANGE_CELL_PROJECT_ID }}
          GCP_RANGE_LINUX_IMAGE: ${{ vars.GCP_RANGE_LINUX_IMAGE }}
          GCP_RANGE_KALI_IMAGE: ${{ vars.GCP_RANGE_KALI_IMAGE }}
          GCP_RANGE_IMAGE_KEY_PROFILES_JSON: ${{ vars.GCP_RANGE_IMAGE_KEY_PROFILES_JSON }}
          GCP_RANGE_WINDOWS_IMAGE: ${{ vars.GCP_RANGE_WINDOWS_IMAGE }}
          GCP_RANGE_DC_IMAGE: ${{ vars.GCP_RANGE_DC_IMAGE }}
          GCP_RANGE_PRIVATE_GOOGLE_ACCESS: ${{ vars.GCP_RANGE_PRIVATE_GOOGLE_ACCESS }}
          # Host SA and Vertex SA are independent inputs and MAY be the same
          # service account in accounts that require it.
          GCP_RANGE_HOST_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_RANGE_HOST_SERVICE_ACCOUNT_EMAIL }}
          GCP_RANGE_VERTEX_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_RANGE_VERTEX_SERVICE_ACCOUNT_EMAIL }}
          GCP_RANGE_VERTEX_PROJECT_ID: ${{ vars.GCP_RANGE_VERTEX_PROJECT_ID }}
        run: |
          # The GCP portal runtime is always production-secure (DEBUG off,
          # secure cookies, Identity Platform auth, SITE_URL=https://<hostname>).
          # render_runtime_env.py fails closed if the Terraform outputs lack a
          # public hostname / managed TLS, so an insecure runtime is never
          # rendered or applied (ADR-008-R1/R3).
          python3 scripts/gcp/render_runtime_env.py \
            --terraform-output-json /tmp/gcp-terraform-outputs.json \
            --engine-image-digest "${PROVISIONER_DIGEST}" \
            --output "${K8S_OVERLAY_DIR}/platform-runtime.generated.env"
      - name: Render generated edge manifest
        run: |
          python3 scripts/gcp/render_edge_manifest.py \
            --environment "${GCP_ENVIRONMENT}" \
            > "${K8S_OVERLAY_DIR}/platform-edge.generated.yaml"
      - name: Render generated private-service NetworkPolicy
        run: |
          # ADR-008-R6 (#963): the Kustomize base ships a default-deny
          # egress policy for shifter-platform, so the platform pods need
          # an explicit allow rule to reach Cloud SQL / Memorystore. The
          # destination CIDRs are dynamic Terraform outputs, so the
          # NetworkPolicy is generated from /tmp/gcp-terraform-outputs.json
          # with per-endpoint /32 ipBlocks — matching the Helm chart's
          # `privateServiceCidrs` flow used by the bootstrap deploy path
          # rather than opening broad RFC1918 supernets.
          python3 scripts/gcp/render_private_service_netpol.py \
            --terraform-output-json /tmp/gcp-terraform-outputs.json \
            --output "${K8S_OVERLAY_DIR}/platform-private-service.generated.yaml"
      # Roll out the production-secure workload (new runtime ConfigMap + restart)
      # BEFORE (re-)applying the public edge, so the public Ingress never routes
      # to pods still running an older, less-secure runtime config.
      - name: Pin overlay images to verified digests
        env:
          PORTAL_DIGEST: ${{ steps.build-portal.outputs.digest }}
          GUACD_DIGEST: ${{ steps.build-guacd.outputs.digest }}
          GUACAMOLE_CLIENT_DIGEST: ${{ steps.build-guacamole-client.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          # ADR-037-R6: deploy the exact verified image@sha256, not a mutable tag.
          # Replace each overlay image's newTag with the digest built this run so
          # `kubectl apply` and the provenance verification below reference the
          # same immutable bytes; kustomize renders newName@digest.
          path = Path(os.environ["K8S_OVERLAY_DIR"]) / "kustomization.yaml"
          content = path.read_text(encoding="utf-8")
          digests = {
            "portal": os.environ["PORTAL_DIGEST"],
            "guacd": os.environ["GUACD_DIGEST"],
            "guacamole-client": os.environ["GUACAMOLE_CLIENT_DIGEST"],
          }
          for image, digest in digests.items():
            if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"::error::invalid digest for {image}: {digest!r}")
            pattern = re.compile(
              r"(?m)^(?P<pre>\s*-\s*name:\s*\S*/" + re.escape(image)
              + r"\s*\n\s*newName:\s*\S+\s*\n)\s*newTag:\s*\S+\s*$"
            )
            content, n = pattern.subn(rf"\g<pre>    digest: {digest}", content)
            if n != 1:
              raise SystemExit(
                f"::error::expected exactly one overlay image entry for {image}, found {n}"
              )
          path.write_text(content, encoding="utf-8")
          print("Pinned overlay images to verified digests:",
                {k: v[:19] + "..." for k, v in digests.items()})
          PY
      - name: Verify image build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAL_DIGEST: ${{ steps.build-portal.outputs.digest }}
          PROVISIONER_DIGEST: ${{ steps.build-provisioner.outputs.digest }}
          GUACD_DIGEST: ${{ steps.build-guacd.outputs.digest }}
          GUACAMOLE_CLIENT_DIGEST: ${{ steps.build-guacamole-client.outputs.digest }}
        run: |
          # ADR-037-R6: verify the GitHub OIDC-signed provenance attestation for
          # each built image@digest and the fixed Brad-Edwards/shifter identity
          # before the GKE rollout. These are the same digests the overlay was
          # just pinned to (and ENGINE_TASK_IMAGE), so the verified bytes are the
          # deployed bytes. No bypass mode.
          set -euo pipefail
          verify() {
            local root="$1" digest="$2" label="$3"
            if [[ -z "$digest" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${label} build did not produce a valid image digest to verify"
              exit 1
            fi
            echo "Verifying provenance for ${label} (${digest})"
            gh attestation verify "oci://${root}@${digest}" --repo Brad-Edwards/shifter
          }
          verify "${PORTAL_IMAGE_ROOT}" "${PORTAL_DIGEST}" "portal"
          verify "${PROVISIONER_IMAGE_ROOT}" "${PROVISIONER_DIGEST}" "provisioner"
          verify "${GUACD_IMAGE_ROOT}" "${GUACD_DIGEST}" "guacd"
          verify "${GUACAMOLE_CLIENT_IMAGE_ROOT}" "${GUACAMOLE_CLIENT_DIGEST}" "guacamole-client"

      - name: Apply GKE workload manifests
        run: kubectl apply -k "${K8S_OVERLAY_DIR}"
      - name: Apply private-service NetworkPolicy
        run: kubectl apply -f "${K8S_OVERLAY_DIR}/platform-private-service.generated.yaml"
      - name: Sync Guacamole runtime secret
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          outputs = json.loads(Path("/tmp/gcp-terraform-outputs.json").read_text())
          runtime_secret_ids = outputs["runtime_secret_ids"]["value"]

          def secret_name(resource_name: str) -> str:
              return resource_name.rstrip("/").split("/")[-1]

          guacamole_db_secret = secret_name(runtime_secret_ids["guacamole-db"])
          guacamole_json_secret = secret_name(runtime_secret_ids["guacamole-json-auth"])

          db_secret = subprocess.check_output(
              ["gcloud", "secrets", "versions", "access", "latest", "--secret", guacamole_db_secret, "--project", os.environ["PROJECT_ID"]],
              text=True,
          )
          json_auth_secret = subprocess.check_output(
              ["gcloud", "secrets", "versions", "access", "latest", "--secret", guacamole_json_secret, "--project", os.environ["PROJECT_ID"]],
              text=True,
          ).strip()

          db_payload = json.loads(db_secret)
          kubectl_args = [
              "kubectl",
              "create",
              "secret",
              "generic",
              "guacamole-runtime",
              "--namespace",
              "shifter-platform",
              f"--from-literal=POSTGRESQL_USER={db_payload['username']}",
              f"--from-literal=POSTGRESQL_PASSWORD={db_payload['password']}",
              f"--from-literal=JSON_SECRET_KEY={json_auth_secret}",
              "--dry-run=client",
              "-o",
              "yaml",
          ]
          secret_manifest = subprocess.check_output(kubectl_args, text=True)
          subprocess.run(["kubectl", "apply", "-f", "-"], input=secret_manifest, text=True, check=True)
          PY
      - name: Restart control-plane deployments
        run: |
          for deployment in portal-web guacd guacamole-client worker-cms worker-engine worker-mc ctf-scheduler; do
            kubectl rollout restart "deployment/${deployment}" -n shifter-platform
          done
      - name: Wait for rollouts
        run: |
          for deployment in portal-web guacd guacamole-client worker-cms worker-engine worker-mc ctf-scheduler; do
            kubectl rollout status "deployment/${deployment}" -n shifter-platform --timeout=15m
          done
      - name: Apply platform edge manifest
        run: kubectl apply -f "${K8S_OVERLAY_DIR}/platform-edge.generated.yaml"
      - name: Wait for ingress IP
        run: |
          for _ in $(seq 1 60); do
            INGRESS_IP=$(kubectl get ingress platform-external -n shifter-platform -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "${INGRESS_IP}" ]; then
              echo "Ingress IP: ${INGRESS_IP}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Ingress platform-external did not receive a load-balancer IP within 10 minutes"
          exit 1
      - name: Wait for managed certificate to cover the public hostname
        env:
          REQUIRE_ACTIVE_CERTIFICATE: ${{ inputs.require_active_certificate }}
        run: |
          # The portal is rendered for https://<public_hostname> only, so a
          # reachable deploy needs a ManagedCertificate that is Active for that
          # exact hostname. The certificate object name is fixed, so verify
          # .spec.domains covers ${PUBLIC_HOSTNAME} (a stale cert for a previous
          # hostname can read Active). The production-secure workload is already
          # rolled out by this point, so when this gate fails the cluster is left
          # in the secure config (just not yet HTTPS-reachable via the hostname),
          # not the old runtime.
          cert_covers_hostname() {
            local domains d
            local -a parsed
            domains=$(kubectl get managedcertificate "${EDGE_CERT_NAME}" -n shifter-platform -o jsonpath='{.spec.domains[*]}' 2>/dev/null || true)
            read -ra parsed <<< "${domains}"
            for d in "${parsed[@]}"; do
              [ "${d}" = "${PUBLIC_HOSTNAME}" ] && return 0
            done
            return 1
          }

          if [ "${REQUIRE_ACTIVE_CERTIFICATE}" != "true" ]; then
            # First-time bootstrap: DNS for the hostname cannot be pointed at the
            # ingress IP until the operator has it from this run, so don't park
            # the deploy on the Active wait. Confirm the certificate object was
            # rendered for the hostname, warn, and continue.
            for _ in $(seq 1 12); do
              if cert_covers_hostname; then
                echo "::warning::Bootstrap mode: ManagedCertificate ${EDGE_CERT_NAME} is configured for ${PUBLIC_HOSTNAME} but is not yet Active. Point DNS for ${PUBLIC_HOSTNAME} at the ingress IP, then re-run the deploy without gcp_require_active_certificate."
                exit 0
              fi
              sleep 10
            done
            echo "::error::Bootstrap mode: ManagedCertificate ${EDGE_CERT_NAME} did not appear with ${PUBLIC_HOSTNAME} in .spec.domains within 2 minutes"
            exit 1
          fi

          for _ in $(seq 1 120); do
            CERT_STATUS=$(kubectl get managedcertificate "${EDGE_CERT_NAME}" -n shifter-platform -o jsonpath='{.status.certificateStatus}' 2>/dev/null || true)
            if cert_covers_hostname && [ "${CERT_STATUS}" = "Active" ]; then
              echo "ManagedCertificate ${EDGE_CERT_NAME} is Active for ${PUBLIC_HOSTNAME}"
              exit 0
            fi
            echo "Waiting for ManagedCertificate ${EDGE_CERT_NAME} to cover ${PUBLIC_HOSTNAME} and become Active: status='${CERT_STATUS:-pending}'"
            sleep 30
          done
          echo "::error::ManagedCertificate ${EDGE_CERT_NAME} is not Active for ${PUBLIC_HOSTNAME} after 60 minutes; check that DNS for ${PUBLIC_HOSTNAME} points at the ingress IP. Re-run with gcp_require_active_certificate=false only for first-time bootstrap."
          exit 1
