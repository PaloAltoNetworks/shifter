name: Vale

# Prose linting for Markdown docs using Vale + the Google developer
# documentation style (config in .vale.ini). The gate runs at the config's
# error level and only against the Markdown files a PR actually changes, so new
# and edited docs must be clean without requiring a one-shot cleanup of the
# pre-existing backlog across the repo's Markdown corpus. See
# documentation/docs/technical/dev/adr-enforcement.md.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".github/workflows/vale.yml"

permissions:
  contents: read

concurrency:
  group: vale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Docs prose (changed Markdown)
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.9.1"
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Vale
        run: |
          set -euo pipefail
          url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL "$url" | sudo tar -xz -C /usr/local/bin vale
          vale --version

      - name: Sync styles
        run: vale sync

      - name: Lint changed Markdown (error level)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mapfile -t files < <(git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Markdown files; nothing to lint."
            exit 0
          fi
          printf 'Linting %d changed Markdown file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          vale "${files[@]}"
