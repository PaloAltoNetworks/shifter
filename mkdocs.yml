site_name: Shifter Documentation
site_description: Deploy, operate, and develop the Shifter cyber-range platform.
site_url: https://brad-edwards.github.io/shifter/
repo_url: https://github.com/Brad-Edwards/shifter
repo_name: Brad-Edwards/shifter
edit_uri: edit/dev/docs/
docs_dir: docs

# Single public docs site (issue #1591): the product/user docs and the
# engineering/deploy docs are consolidated under top-level docs/ and published
# here; the in-app Django docs app is retired. Internal design notes, machine
# registries, deprecated content, and scratch dirs are kept in-repo but off the
# public site via exclude_docs below.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Keep internal design notes, machine registries, deprecated content, and
# scratch dirs in the repo but off the public site (they are not published
# prose). Everything else is picked up by the auto-generated nav below.
exclude_docs: |
  architecture/
  audit/
  design/
  research/
  ctf/
  _deprecated/
  technical/notes/
  technical/plans/
  adr/*.yaml
  adr/complexity-backlog.md
  adr-enforcement-plan.md
  requirements.txt

# The docs were authored for a flat in-app renderer; some cross-references and
# anchors do not resolve one-to-one under mkdocs. Report those as info (not
# fatal) so --strict still guards genuine structural problems while the
# migrated content is preserved verbatim (no doc bodies rewritten). Remaining
# cross-link cleanup is tracked as follow-up.
validation:
  nav:
    omitted_files: info
    not_found: info
    absolute_links: info
  links:
    not_found: info
    anchors: info
    absolute_links: info
    unrecognized_links: info

# Nav is generated from the directory tree and each section's index.md. With
# ~85 published pages an explicit nav is not maintainable by hand; section
# ordering can be tuned later with a nav plugin if needed.
