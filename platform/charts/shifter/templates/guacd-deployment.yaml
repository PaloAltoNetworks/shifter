apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: guacd
spec:
  replicas: {{ .Values.guacd.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: guacd
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: guacd
    spec:
      securityContext:
        fsGroup: {{ .Values.security.guacd.runAsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: {{ .Values.security.pod.seccompProfile }}
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.workers.name }}
      {{- include "shifter.accessNodePlacement" . | nindent 6 }}
      {{- include "shifter.podAntiAffinity" (dict "component" "guacd") | nindent 6 }}
      containers:
        - name: guacd
          image: {{ include "shifter.guacdImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "shifter.containerSecurityContextGuacd" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # FreeRDP persists its server certificate store here. Keep the
            # root filesystem read-only while making only that store writable.
            - name: freerdp-config
              mountPath: /home/guacd/.config/freerdp
          ports:
            - name: guacd
              containerPort: 4822
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.guacd.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
        - name: freerdp-config
          emptyDir:
            sizeLimit: {{ .Values.guacd.freerdpConfigVolume.sizeLimit | quote }}
