        "description": "Reserve the set of all applicable deployment/event/user/group/collection/configured-range/grant/quota accounts atomically before dispatch using integer money and bounded billable-feature costs. Deduplicate shared account IDs without weakening distinct caps. Price validity, rate windows, ordered locking and database constraints are explicit. Unknown usage, timeout, disconnect and worker loss never create automatic refunds or replay; settle once and retain reconciliation obligations. Real PostgreSQL and provider-boundary tests must prove the runtime behavior.",
