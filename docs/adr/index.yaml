      {
        "id": "ADR-028-R1",
        "description": "Participant per-challenge solve history must be gated to the participant themselves or the event organizer. Scoreboard row drill-down links must render only for the viewer's own row; other rows stay display-only. Do not widen ctf:participant_solve_history to any-participant access to match CTF-401's literal wording -- CTF-1404 governs the semi-private posture.",
        "checks": []
      },
      {
        "id": "ADR-028-R2",
        "description": "Any solve-history projection must be correct-solves-only and must never expose submitted flag values, incorrect-attempt details, or attempt source IP addresses to a participant-visible surface. Reuse ctf.services.submission.get_participant_solve_history rather than serialising raw CTFSubmission rows.",
