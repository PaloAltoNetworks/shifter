id: smoke_windows
name: Smoke (Windows)
description: >-
  Post-deploy platform smoke. Provisions a Kali attacker and a Windows
  workstation from the base range AMIs (no domain join, no XDR agent, no
  scenario content), verifies RDP connectivity to the Windows box, and
  tears the range down. Not user-facing; used only by
  run_post_deploy_smoke.
enabled: false
ngfw: false

instances:
  - name: Attacker
    role: attacker
    os_type: kali
    xdr_agent: false

  - name: Workstation
    role: victim
    os_type: windows
    xdr_agent: false

subnets:
  - name: core
    instances: [Attacker, Workstation]
