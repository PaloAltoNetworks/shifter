    "id": "ADR-042",
    "title": "Repository releases use one Release Please umbrella lineage",
    "status": "accepted",
    "scope": "repository",
    "decision": "Shifter has one umbrella SemVer release line coordinated by Release Please on protected main. A release is a vX.Y.Z source tag plus GitHub Release created by the Release Please action on merge of its release PR (mirroring the sibling RAES repos), not a deployment or independently published component set. Release Please is the sole CHANGELOG.md writer after a lossless final Towncrier transition; Conventional Commit signals must survive the feature-to-dev and dev-to-main merge topology. Component package/chart versions and OCI digest-based deployment identity remain separate contracts.",
    "rules": [
      {
        "id": "ADR-042-R1",
        "description": "Release Please MUST configure exactly one root package for the Shifter umbrella release. The root manifest records last released state and the simple releaser's root version.txt is its committed mirror; Python, Node, Helm, Terraform, schema, protocol, and migration versions MUST NOT be swept into the umbrella bump unless a later ADR establishes an independently published lifecycle.",
        "checks": []
      },
      {
        "id": "ADR-042-R2",
        "description": "A Shifter release is a vX.Y.Z tag and GitHub Release bound to one protected-main source commit, created by the Release Please action via the ephemeral GITHUB_TOKEN (mirroring the sibling RAES repos); a CI-managed release tag is not required to carry a GPG/OIDC signature. Release creation MUST NOT deploy, publish packages or images, mint cloud credentials, or replace ADR-037's exact OCI digest and source-revision deployment identity. Existing tags are immutable and a mismatched same-version tag fails closed.",
        "checks": []
      },
      {
        "id": "ADR-042-R3",
        "description": "Release Please is the sole CHANGELOG.md writer after cutover. Every pending Towncrier fragment MUST first be consumed into a correctly rendered final transition release with a matching tag/Release, after which towncrier.toml, changelog.d, its template, merge driver, fragment gates, and fragment guidance are retired together; a hybrid or silent fragment deletion is prohibited.",
        "checks": []
      },
      {
        "id": "ADR-042-R4",
        "description": "The release signal is the Conventional Commit subject preserved on main: feat is minor, fix/perf is patch, and an explicit breaking marker is major; non-release maintenance and the retained Keep-a-Changelog types (security/added/changed/deprecated/removed/fixed) do not bump. Feature PRs to dev MUST be title-validated and squash-merged with that title as the commit subject, while dev-to-main promotion preserves those commits. The prior blanket exemption for PRs targeting dev is removed (pr-title-lint runs on PRs to dev); only dev-to-main promotion PRs, whose title never becomes a release commit, are left unlinted.",
