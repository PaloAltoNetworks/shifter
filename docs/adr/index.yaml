  {
    "id": "ADR-046",
    "title": "Organization/workspace tenancy is a domain boundary above range ownership",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "Organizations own workspaces; a workspace owns its user memberships and role codes; a range remains owned by its existing user/request identity and is additionally bound to exactly one workspace. The bounded workspaces domain is the sole owner of Organization, Workspace, and WorkspaceMembership persistence and authorization. It does not reuse Django auth groups, UserProfile, CTF teams/events, SPA navigation workspaces, Terraform workspaces, or cloud tenancy as the membership model. Engine and CMS retain their own range/request persistence under ADR-001: they carry a validated opaque workspace_id rather than a cross-layer ForeignKey or a second workspace model. Existing user-owned ranges are placed in the owning user's personal workspace, which is itself owned by a personal organization, so single-user installs retain the same owner, lifecycle, admission, access, and visible behavior. Identity-provider group/claim integration is a future, verified adapter into this domain, not a direct role authority in this data model.",
    "rules": [
      {
        "id": "ADR-046-R1",
        "description": "Organization, Workspace, and WorkspaceMembership are owned by one classified domain app and exposed to other layers only through its public service facade. The models may relate to Django auth.User, but no other domain may import them or add a cross-layer ForeignKey. Do not duplicate the schema in management, CMS, Engine, CTF, shared, frontend state, provider tags, or JSON blobs.",
        "checks": [
          "layer-imports",
          "cross-layer-model-imports"
        ]
      },
      {
        "id": "ADR-046-R2",
        "description": "A workspace belongs to exactly one organization and has at most one membership per user. Membership role is a closed domain value; its operation-to-role policy is owned by the workspace authorization service. Workspace membership does not replace Range.user, cms.Request.user, CMS range provenance, CTF participant/event/team membership, API-token scope, or per-range remote-access checks. A workspace role grants no implicit SSH, RDP, VPN, Guacamole, or CTF-event access to another user's range.",
        "checks": []
      },
      {
        "id": "ADR-046-R3",
        "description": "The trusted launch/reassignment path resolves and authorizes workspace scope once through the workspace service and persists the resulting internal workspace_id as an immutable scope binding on CMS request intent, the CMS RangeInstance projection, and Engine Range. These are scalar references rather than cross-layer FKs; no caller may trust a supplied internal ID, mutate only one projection, infer scope from a user/group, or silently rehome a range. A future explicit rehoming operation must validate the target membership and update all ownership projections transactionally.",
        "checks": []
      },
      {
        "id": "ADR-046-R4",
        "description": "The compatibility default is per user, never a deployment-global organization or workspace: every migrated user-owned range is bound to that user's personal workspace and an owner membership. The migration must fail loudly on conflicting or unresolvable Engine/CMS ownership evidence rather than choosing an arbitrary tenant, and current per-user active-range, lifecycle, terminal, VPN, CTF, and API behavior remains unchanged until a separately reviewed scoping policy changes it.",
        "checks": []
      },
      {
        "id": "ADR-046-R5",
        "description": "OIDC/Identity Platform claims may be considered only after the existing issuer, audience, authorized-party, subject, and verified-email gates bind the Django user. Provider group names are external evidence, not workspace IDs or role strings; any later mapping is allowlisted/configured at the identity adapter, provenance-aware, auditable, revocable, and cannot let a self-mutable claim or Django auth.Group create workspace authority.",
        "checks": []
      },
      {
        "id": "ADR-046-R6",
        "description": "Future organization/workspace APIs use the canonical /api/v1 DRF authentication, exact API-token scope registry, serializer validation, shared error envelope, request correlation, audit facade, and sanitized logging. Role/membership mutations and sensitive range rehoming are transactional and audit-strict. External IDs, claims, tokens, emails, membership lists, and database errors must not leak through logs, events, command argv, or public error bodies.",
        "checks": []
      },
      {
        "id": "ADR-046-R7",
        "description": "Tenancy scopes principals and range ownership, not platform configuration or catalog. The following remain deployment-global and MUST NOT acquire an organization or workspace binding as an implicit consequence of this layer: the scenario catalog and RAES package sources; the agent, operating-system, instance-type, and app catalogs; NGFW instances and platform network/infrastructure; cloud provider, range-backend, and deployment settings including the environment manifest; identity-provider configuration (issuer, audience, allowlists) and the API-token scope registry; the durable audit store; and feature flags. Before ADR-051's #2048 activation migration is deployed, CTF events, teams, and participants are deployment-global records governed by event-native authority, and a range's workspace binding is not an event binding. ADR-051 becomes operative only after every existing event is deterministically backfilled to its creator's personal workspace, unresolved mappings fail closed, the schema requires one immutable workspace_id, and supported new-event creation resolves that binding through workspaces.services. After activation, the event binding proves tenant confinement only: CTF teams and participants remain a separate event membership model, and workspace membership grants no CTF authority. The binding does not tenant-scope the global scenario, catalog, configuration, identity, audit, or infrastructure concerns in this rule. Any other scoping change requires its own ADR; a workspace-level policy surface is never added by implicit inheritance.",
        "checks": []
      },
      {
        "id": "ADR-046-R8",
        "description": "The initial membership roles are the closed, workspace-scoped owner, admin, and member values. The workspaces service owns their operation matrix and every interactive operation on a workspace-bound resource must pass that service in addition to existing owner, source, lifecycle, CTF, participant-channel, and remote-access checks. Owner/admin/member must not be derived from Django staff/groups, identity-provider claims/groups, CTF authority, API-token scopes, or cloud roles. Personal-workspace ownership is immutable compatibility state; all other membership and role mutations are locked, transactional, and strict-audited, with an owner-only ownership boundary and at least one owner retained. There is no OrganizationMembership or organization-wide role in this iteration: encoding org_admin on workspace rows, copying it across workspaces, or inferring it from one workspace is forbidden until a separate authority model is accepted.",
        "checks": []
      },
      {
        "id": "ADR-046-R9",
        "description": "An interactive range launch may select a workspace only by its public UUID; omission resolves the actor's personal compatibility workspace. CMS resolves and authorizes that scope through workspaces.services, then reauthorizes while holding the existing workspace mutation mutex through the atomic CMS request/range reservation so concurrent membership removal cannot create a range outside its owner's authority. The same internal workspace_id is persisted on CMS Request, CMS RangeInstance, and Engine Range before dispatch. Engine idempotent create must reject a replay whose workspace binding differs from the persisted range; neither a supplied invalid scope nor a conflicting replay may fall back, rehome, or reuse silently.",
        "checks": []
      },
      {
        "id": "ADR-046-R10",
        "description": "Workspace quota and workspace range-policy evaluation compose at one CMS pre-reservation launch-admission seam parameterized by authorized workspace, individual owner, server-derived range source, trusted instantiation purpose, and stable server-minted request correlation. Enforcing concurrent-range quota uses a workspaces-owned durable idempotent reservation identified by workspace, resource, and correlation under the workspace mutation mutex rather than a count-then-create race, remains distinct from the per-user/source active-range constraint and Engine's event/provider-capacity ledger, and releases only on terminal FAILED/DESTROYED convergence (not DESTROYING or CMS soft delete). Member-seat quota composes once in the common locked membership insert used by direct add and invitation acceptance; membership rows remain canonical usage and pending invitations are not seats. Missing policy preserves unlimited compatibility; soft/advisory overage warns and records while hard/enforcing overage records then blocks without rolling its decision evidence back. Quota reads reuse READ_WORKSPACE authority; policy authoring is a service-backed, strict-audited superuser operation reached through the Django-admin escape hatch, never workspace-role authority or a raw model save. Quota decisions pin bounded policy/usage/reason facts as append-only workspaces-domain evidence, with applied-limit audit events emitted transactionally through shared.audit. The workspace egress selector extends the canonical installation RangeEgressMode vocabulary, resolves under the workspace mutation mutex, pins one closed effective decision on the Engine range, and is replay-verified; workspace identity, membership, role, quota/policy documents, and decisions never enter scenario/RAES contracts, provisioner argv/environment, events, provider labels, or guest metadata.",
        "checks": []
      },
      {
        "id": "ADR-046-R11",
        "description": "A current-principal organization/workspace context is a read-only projection of the actor's existing workspace memberships, grouped by membership-reachable organizations and exposed only through the workspaces service facade with public UUIDs and server-derived operation capabilities. It does not establish a primary organization, persisted current workspace, organization-wide role, or new authority source; navigation, routes, flags, role labels, and cached client context remain advisory, and every resource endpoint repeats the applicable workspace service authorization. The read must not create or repair tenancy state.",
        "checks": []
      },
      {
        "id": "ADR-046-R12",
        "description": "Organization profile reads may expose a closed scalar projection only for membership-reachable organizations and address it by public organization UUID. Organization mutation requires a separately accepted, service-owned organization authority rule: staff admission, Django permissions, provider/cloud roles, cached UI capabilities, and owner/admin authority in one, every, or a selected workspace do not imply organization-wide authority. Mutable profile fields must be explicit typed domain fields with one validation/normalization path; generic settings/branding/default JSON and tenant-scoping the deployment-global concerns in R7 are prohibited. Any accepted mutation locks and updates through workspaces.services and writes request-attributed strict shared.audit state in the same transaction; its API uses the shared error/OpenAPI/generated-client boundaries and remains identical across providers.",
        "checks": []
      },
      {
        "id": "ADR-046-R13",
        "description": "As a narrow, explicit exception to R8's owner-only ownership boundary, a platform administrator may transfer a departing user's owned workspaces and ranges to a replacement during user offboarding (PLAT-236, #1943). This override is authorized only by a superuser session at the composition root (a superuser already holds cross-tenant root authority, so the transfer is not an escalation); it is never reachable through workspace-role authority or the auth.change_user model permission alone, and a visible Administer control does not otherwise become workspace or range authority. It is exposed only through a single bounded composition-root command that delegates per resource kind: workspace ownership goes through the workspaces.services facade command (admin_transfer_workspace_ownership) and range ownership through the existing cms.services reassign authority. Workspace transfer moves ownership of non-personal workspaces the source owns to a replacement who already holds a membership in each workspace (a non-member workspace is reported blocked, never silently rehomed and never given a fabricated membership, preserving ADR-048); it excludes personal compatibility workspaces (immutable), promotes the replacement to owner before demoting the source so the last-owner invariant holds throughout, locks each workspace row, and writes one request-attributed strict shared.audit event per transfer. Range transfer preserves the CMS/Engine ownership projections, the new owner's workspace membership requirement, active-range uniqueness, and the live-VPN refusal, and strict-audits each move. The command never removes memberships, changes CTF roles, transfers credential/agent ownership, unbinds identity, or rewrites provenance/attribution.",
        "checks": []
      },
      {
        "id": "ADR-046-R14",
        "description": "Range-scope administration is distinct from range-owner reassignment and interactive range access. Its closed workspace operations are owner/admin-only and never reuse REASSIGN_RANGE, READ_RANGE, staff status, organization authority, or the PLAT-236 superuser offboarding override as authority. The staff-session administration API lists only a bounded, paginated CMS projection for a workspace; it does not grant access to another user's range. Rebinding accepts only the range request UUID and a target workspace public UUID, reauthorizes the actor for scope administration in both the persisted source and target workspaces, requires the unchanged range owner to remain a member of the active target workspace, and never creates membership. One CMS-owned, request-attributed, strict-audited transaction locks and compare-and-set verifies the CMS Request, CMS RangeInstance, and Engine Range bindings, then changes all three or none; projection absence, multiplicity, or disagreement fails closed and is not silently repaired. Rebinding changes no user/owner, provenance, lifecycle, lease, credential, access-channel, backend, pinned egress, capacity, scenario, or cloud state. A range participating in another domain's immutable workspace aggregate, including an ADR-051-bound CTF event, cannot move independently unless that owning domain validates the same target through its public service boundary; absent that seam, the move fails closed. Public responses and logs remain bounded and non-enumerating, and workspace identities never enter scenario contracts, provider input, argv, environment, or guest metadata.",
        "checks": []
      },
      {
        "id": "ADR-046-R15",
        "description": "Mission Control runtime lease policy (#2169) is a CMS-owned product policy, not workspace tenancy. Its tenant scope is the standalone deployment; its optional group layer selects from committed membership in administrator-controlled, policy-eligible Django auth.Group rows and never from workspace/organization roles, raw provider/self-service claim strings, CTF teams/events, staff flags, cloud groups, or caller-supplied names/IDs. Self-service-synchronized groups are ineligible. Group policy can restrict the lease of an otherwise authorized owner but grants no launch, workspace, range, or remote-access authority. Multiple matching policies compose by the documented restrictive meet, while the existing workspace service remains an independent additive authorization gate. No organization/workspace lease policy or implicit workspace inheritance is introduced without a later ADR.",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": [
      "agent-policy",
      "ci"
    ],
    "evidence": [
      "https://github.com/Brad-Edwards/shifter/issues/1325",
