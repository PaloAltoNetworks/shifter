    name: guacamole-client
  minReplicas: {{ .Values.guacamoleClient.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.guacamoleClient.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.guacamoleClient.autoscaling.scaleDownStabilizationSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.guacamoleClient.autoscaling.cpuUtilizationPercentage }}
{{- end }}
