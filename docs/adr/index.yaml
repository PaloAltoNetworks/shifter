        "activation": "issue-2048-required-backfill-and-schema",
        "post_migration": "required-immutable-workspace-binding",
        "unresolved_backfill": "fail-closed",
        "event_authority": "event-native-before-and-after"
      },
      "ownership": {
        "api_services": "versioned-api-to-domain-service-facades",
        "iam": "deployment-operator-provider-policy",
        "datastore": "domain-owned-postgresql",
        "secrets": "deployment-local-secret-authority",
        "network": "platform-and-range-infrastructure",
        "evidence": "shared-audit-and-provider-observations"
      },
      "outages": {
        "identity_provider": "deny-new-idp-session",
        "datastore": "deny-state-dependent-admission",
        "registry": "deny-new-acquisition-without-validated-local-state",
        "secret_store": "deny-secret-dependent-effect",
        "model_provider": "fail-dependent-capability-without-authority-change",
        "provider_api": "retain-failed-or-indeterminate-truth",
        "audit": "strict-mutation-fails-or-degraded-state-visible"
      },
      "verification": [
        "session-token-parity",
        "revoked-authority",
        "cross-event-denial",
        "event-binding-migration",
        "remote-access-revocation",
        "audited-platform-override",
        "effective-iam-network-denial",
        "dependency-outage-behavior"
      ]
    },
    "rules": [
      {
        "id": "ADR-054-R1",
        "description": "One BigRAE deployment is one customer boundary. Unrelated customers do not share its product control plane, PostgreSQL authority, runtime secret authority, or product workload identities. A provider project, organization row, workspace, hostname, tag, or label alone is not proof of that boundary.",
        "checks": []
      },
      {
        "id": "ADR-054-R2",
        "description": "Organization, workspace, event, participant, application-operator, cloud-operator, and external-client authority remain distinct and compose only at their owning service boundaries. No role, identity claim, token scope, selected client context, source label, or external capability implies another authority.",
        "checks": []
      },
      {
        "id": "ADR-054-R3",
        "description": "Before #2048's activation migration, CTF events, teams, and participants use the deployment-global model governed by event-native authority. The migration point is the first deployed schema and application release that backfills every event to its creator's personal workspace, rejects an unresolved backfill, makes the binding required, and routes supported new-event creation through workspaces.services. After activation each event carries one immutable internal workspace_id; the binding proves tenant confinement only and never grants event participation, ownership, delegation, range access, organization authority, or secret access.",
        "checks": []
      },
      {
        "id": "ADR-054-R4",
        "description": "Deployment-local services remain authoritative for authentication admission, authorization, validation, persistence, lifecycle effects, secrets, audit, and result application. External clients use the versioned public API and obtain only the intersection of live actor authority, exact token scope when applicable, object policy, and current lifecycle. They cannot submit an authority source, bypass local admission, write domain tables, receive product workload credentials, or become the owner of a cloud effect.",
        "checks": []
      },
      {
        "id": "ADR-054-R5",
        "description": "GCP IAM, datastore, secret, network, and evidence ownership is explicit and least-privilege. Effective identities and denied paths, rather than names or labels, prove isolation. Product workloads, development runners, participant guests, external clients, application operators, and cloud operators remain separate trust domains.",
        "checks": []
      },
      {
        "id": "ADR-054-R6",
        "description": "Dependency loss never creates permission or asserts an unobserved effect. Each dependency has fail-closed or explicitly degraded behavior; durable operation state and reconciliation distinguish accepted, running, failed, indeterminate, and completed work. IdP, datastore, cache, registry, secret, audit, model, and provider outages never authorize a broader fallback.",
        "checks": []
      },
      {
        "id": "ADR-054-R7",
        "description": "Release evidence includes session/token parity, revoked authority, cross-event denial, event-binding migration, remote-access revocation, audited platform override, effective IAM and network denied paths, and dependency-failure tests against the real owning boundaries. Documentary assertions and labels do not substitute for runtime or migration proof.",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": [
