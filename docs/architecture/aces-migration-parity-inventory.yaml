    validation_evidence: docs/architecture/aces-domain-topology-preflight-1606.md; shifter/shifter_platform/tests/shared/aces/test_domain_topology_admission.py; shifter/engine/provisioner/tests/test_aces_plan.py
    next_issue_kind: none
    candidate_issue_title: "#1606: Consume released ACES domain topology without a Shifter dialect"
    notes: >-
      Domain topology is authored scenario meaning, not backend configuration.
      Shifter must not copy the legacy schemas, infer topology from names/OS/images,
      create a private extension, or reinterpret observed runtime identity inventory.
      Shifter consumes the released 0.23 public topology diagnostics while declaring
      no supported domain profiles; the existing serialized ProvisioningPlan remains
      the transport. Authority credentials and genuine DC/join/SPN realization remain
      backend-owned work for #1561.

