releaseNamespace: shifter-system

namespaces:
  platform: shifter-platform
  jobs: shifter-jobs

serviceAccounts:
  portal:
    name: portal
    annotations: {}
  workers:
    name: workers
    annotations: {}
  ctfScheduler:
    name: ctf-scheduler
    annotations: {}
  provisioner:
    name: provisioner
    annotations: {}

runtimeEnv: {}

# The guacamole-runtime Kubernetes Secret is created out of band by the deploy
# bootstrap (kubectl apply from the provider secret store), not by this chart.
# The chart references it by name only; Guacamole DB and JSON-auth values must
# never be placed in chart values or Helm release history. See issue #1180.
guacamoleRuntimeSecret:
  name: guacamole-runtime

images:
  portal:
    repository: "us-docker.pkg.dev/placeholder-project/shifter/portal"
    tag: "0.0.0"
    pullPolicy: Always
  guacd:
    repository: "us-docker.pkg.dev/placeholder-project/shifter/guacd"
    tag: "0.0.0"
    pullPolicy: Always
  guacamoleClient:
    repository: "us-docker.pkg.dev/placeholder-project/shifter/guacamole-client"
    tag: "0.0.0"
    pullPolicy: Always

portal:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 256Mi

workers:
  cms:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
  engine:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
  mc:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
  ctfScheduler:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
  guacamolePrune:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 256Mi
  acesOperationRecordPrune:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 256Mi
  outboxDrainer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
  reconciler:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi

guacd:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 256Mi

guacamoleClient:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 256Mi

security:
  pod:
    seccompProfile: RuntimeDefault
  app:
    runAsUser: 1000
    runAsGroup: 1000
  guacd:
    runAsUser: 1000
    runAsGroup: 1000
  guacamole:
    runAsUser: 1001
    runAsGroup: 1001

tmpVolume:
  sizeLimit: 256Mi

# Writable media volume for the portal (Django MEDIA_ROOT=/app/media) under
# readOnlyRootFilesystem. FileSystemStorage is per-pod; this satisfies the app's
# storage backend and the storage health check.
mediaVolume:
  sizeLimit: 1Gi

services:
  portal:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true
      name: portal-web
      securityPolicyName: ""
      healthCheck:
        type: HTTP
        requestPath: /health/
        port: 8000
        checkIntervalSec: 15
        timeoutSec: 5
        healthyThreshold: 1
        unhealthyThreshold: 2
  guacamoleClient:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: false
      name: guacamole-client
      securityPolicyName: ""

networkPolicy:
  enabled: true
  gclbSourceRanges:
    - 35.191.0.0/16 # NOSONAR - Google Cloud Load Balancer health check/proxy range.
    - 130.211.0.0/22 # NOSONAR - Google Cloud Load Balancer health check/proxy range.
  googleApiCidrs:
    - 199.36.153.4/30 # NOSONAR - restricted.googleapis.com VIP range.
    - 199.36.153.8/30 # NOSONAR - private.googleapis.com VIP range.
  privateServiceCidrs: []
  # CIDR(s) covering the GDC range cluster's control-plane endpoint (the
  # internal TCP load balancer fronting the apiserver on the peered range
  # network). Empty on AWS; set by the GCP bootstrap so range-provisioning
  # Jobs can reach the range cluster apiserver. See deploy.py gdc-bootstrap.
  rangeClusterApiCidrs: []
  rangeClusterApiPort: 6444

ingress:
  enabled: true
  class: gce
  staticIpName: ""
  host: ""
  managedTls:
    enabled: false
    certificateName: platform-managed-cert
    frontendConfigName: platform-frontend-config
