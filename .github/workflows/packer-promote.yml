name: Packer AMI Promote to Prod

on:
  workflow_dispatch:
    inputs:
      ami_type:
        description: 'AMI type to promote'
        required: true
        type: choice
        options:
          - kali
          - ubuntu
          - windows
          - dc
          - brokenbk

jobs:
  # DC AMIs are prebaked - just update SSM from config file
  update-dc:
    permissions:
      id-token: write
      contents: read
    name: Update DC AMI in prod SSM
    if: inputs.ami_type == 'dc'
    runs-on: self-hosted

    steps:
      # Fail-closed protected-ref gate (issue #1656). This job assumes the prod
      # deploy role and overwrites the /shifter/ami/dc runtime pointer, so
      # restrict it to a protected ref; a feature-branch dispatch could otherwise
      # publish an attacker-chosen DC id to prod. Runs before checkout.
      - name: Validate promote ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Gate on the full ref, not github.ref_name: a tag named dev or main
          # shares the short name and would otherwise pass this gate from
          # unprotected provenance (codex #1656). Only the protected branches
          # are accepted.
          case "$REF" in
            refs/heads/dev | refs/heads/main) ;;
            *)
              echo "::error::DC promotion may only run from a protected branch (refs/heads/dev or refs/heads/main); got '${REF}'"
              exit 1
              ;;
          esac

      # Read the DC registry AND the resolver from the canonical protected dev
      # branch, independent of the dispatched ref, so the same validated id backs
      # dev/proof seeding and prod promotion (issue #1656). refs/heads/dev (not
      # the short name dev) so a tag named dev cannot shadow the branch.
      # persist-credentials:false keeps the checkout token out of Git config.
      - name: Checkout trusted DC registry (protected provenance)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/heads/dev
          persist-credentials: false

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Update prod SSM from config
        env:
          TRUSTED_DC_JSON: ${{ github.workspace }}/shifter/packer/dc-amis.json
        run: |
          set -euo pipefail
          # Validate the prebaked prod DC id (shape + prod ownership + available)
          # via the resolver shared with packer.yml before touching the runtime
          # pointer; a failure leaves the previous /shifter/ami/dc intact.
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          PROVENANCE_SHA="$(git rev-parse HEAD)"
          AMI_ID="$(DC_AMIS_JSON="$TRUSTED_DC_JSON" \
            DC_ENV_KEY=prod \
            EXPECTED_ACCOUNT_ID="$ACCOUNT_ID" \
            bash shifter/packer/scripts/bake/resolve-dc-ami.sh)"
          {
            echo "## DC AMI Update (Prod)"
            echo "- **AMI ID:** \`$AMI_ID\`"
            echo "- **Source:** dc-amis.json (prebaked AMI)"
            echo "- **Provenance:** dev@${PROVENANCE_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

          aws ssm put-parameter \
            --name "/shifter/ami/dc" \
            --type String \
            --value "$AMI_ID" \
            --overwrite \
            --description "Prebaked DC AMI from dc-amis.json, run ${{ github.run_id }}"

          {
            echo "- **SSM Parameter:** \`/shifter/ami/dc\` updated"
            echo ""
            echo "**Done!** Prod DC AMI updated."
          } >> "$GITHUB_STEP_SUMMARY"

  # Other AMIs are copied from dev to prod
  promote:
    permissions:
      id-token: write
      contents: read
    name: Promote ${{ inputs.ami_type }} AMI to prod
    if: inputs.ami_type != 'dc'
    runs-on: self-hosted

    steps:
      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-2

      - name: Get dev AMI ID from SSM
        run: |
          DEV_AMI_ID=$(aws ssm get-parameter --name "/shifter/ami/${{ inputs.ami_type }}" --query Parameter.Value --output text)
          echo "DEV_AMI_ID=$DEV_AMI_ID" >> "$GITHUB_ENV"
          {
            echo "## Promoting ${{ inputs.ami_type }} AMI to prod"
            echo "- **Dev AMI ID:** \`$DEV_AMI_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get dev account ID
        run: |
          DEV_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "DEV_ACCOUNT_ID=$DEV_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Get prod account ID
        run: |
          PROD_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "PROD_ACCOUNT_ID=$PROD_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Switch back to dev to share AMI
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-2

      - name: Share AMI and snapshots with prod account
        run: |
          # Share the AMI
          aws ec2 modify-image-attribute \
            --image-id "$DEV_AMI_ID" \
            --launch-permission "Add=[{UserId=$PROD_ACCOUNT_ID}]"

          # Get and share all snapshots associated with the AMI
          SNAPSHOT_IDS=$(aws ec2 describe-images --image-ids "$DEV_AMI_ID" \
            --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' --output text)
          # shellcheck disable=SC2086
          for SNAPSHOT_ID in $SNAPSHOT_IDS; do
            if [ "$SNAPSHOT_ID" != "None" ] && [ -n "$SNAPSHOT_ID" ]; then
              aws ec2 modify-snapshot-attribute \
                --snapshot-id "$SNAPSHOT_ID" \
                --attribute createVolumePermission \
                --operation-type add \
                --user-ids "$PROD_ACCOUNT_ID"
              echo "- **Shared snapshot:** $SNAPSHOT_ID" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "- **Shared AMI with prod account:** $PROD_ACCOUNT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (prod) for copy
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Copy AMI to prod account
        run: |
          PROD_AMI_ID=$(aws ec2 copy-image \
            --source-region us-east-2 \
            --source-image-id "$DEV_AMI_ID" \
            --name "shifter-${{ inputs.ami_type }}-${{ github.run_id }}" \
            --description "Promoted from dev by GitHub Actions run ${{ github.run_id }}" \
            --query ImageId --output text)
          echo "PROD_AMI_ID=$PROD_AMI_ID" >> "$GITHUB_ENV"
          echo "- **Prod AMI ID:** \`$PROD_AMI_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for prod AMI to be available
        run: |
          echo "Waiting for AMI $PROD_AMI_ID to become available..."
          aws ec2 wait image-available --image-ids "$PROD_AMI_ID"
          echo "- **Prod AMI Status:** available" >> "$GITHUB_STEP_SUMMARY"

      - name: Update prod SSM Parameter
        run: |
          aws ssm put-parameter \
            --name "/shifter/ami/${{ inputs.ami_type }}" \
            --type String \
            --value "$PROD_AMI_ID" \
            --overwrite \
            --description "Promoted from dev by GitHub Actions run ${{ github.run_id }}"
          {
            echo "- **Prod SSM:** \`/shifter/ami/${{ inputs.ami_type }}\` updated"
            echo ""
            echo "**Done!** Prod now uses the same AMI as dev."
          } >> "$GITHUB_STEP_SUMMARY"
