  {
    "id": "ADR-003",
    "title": "ADR enforcement is a required architecture gate",
    "status": "accepted",
    "scope": "repository",
    "decision": "Architecture policy checks run independently of optional test skips.",
    "rules": [
      {
        "id": "ADR-003-R1",
        "description": "ADR conformance must run in CI even when tests are skipped.",
        "checks": [
          "adr-registry",
          "layer-imports",
          "cross-layer-model-imports"
        ]
      },
      {
        "id": "ADR-003-R2",
        "description": "AWS Terraform plan routing must stay scoped to Terraform-consumed files, while Quality routing must run by exclusion for pull requests and dev pushes: a dedicated quality_relevant output runs Quality unless the diff is ordinary docs-only, and guardrail docs such as .github/pull_request_template.md, .github/copilot-instructions.md, docs/adr/**, and adr-enforcement.md must remain quality-relevant. Non-deploy support/test paths such as scripts/polaris-aws-range/** and scenario-dev/polaris/tests/** must stay categorized through a dedicated quality_only filter/output without launching Terraform plans, image builds, or environment deploys. Commit-message or label-based test skips are not accepted. AWS deploy runs that can apply infrastructure must queue instead of cancelling an in-flight apply. Core, range, and platform Terraform plan and apply commands must wait for the backend state lock. Their apply jobs must create a local saved tfplan and apply that exact file instead of uploading raw binary plans as artifacts or running a fresh unplanned apply; platform Service Discovery replacement handling must inspect that same saved plan before apply. When the saved plan deletes an aws_service_discovery_service, the pre-apply handler must drain every ECS service registered against it (scale to desiredCount=0, wait for tasks to stop and Cloud Map to deregister all instances, failing the run on timeout rather than warning), snapshot the original desired counts, and restore them after apply; restoration is mandatory because aws_ecs_service.guacd sets lifecycle.ignore_changes=[desired_count], so Terraform will not bring the service back on its own. Portal application changes must keep reaching the portal image build/deploy path through the dedicated portal_image filter wired into the shifter_platform job trigger and the platform build job's portal_image_changes input, without widening the Terraform-scoped plan trigger.",
        "checks": [
          "deploy-workflow-plan-scope"
        ]
      },
      {
        "id": "ADR-003-R3",
        "description": "Deploy-verification steps must fail the run when the thing they verify did not happen, instead of warning and exiting 0. The Guacamole stabilization wait in _shifter-platform.yml must exit 1 on timeout (raise the timeout if first boot needs longer rather than downgrading the result). The engine ECS task-definition update in _shifter-engine.yml must exit 1 when the task-definition family cannot be described, with the only skip gated on the explicit first_deploy bootstrap input (surfaced as the aws_first_deploy workflow_dispatch input in deploy.yml, strict by default and settable only on manual dispatch). After portal deploy, the Verify job in _shifter-platform.yml must fail when portal ALB target health, /health/, Guacamole ECS rollouts, Guacamole target health, or /guacamole/ smoke probes are not satisfied; scripts/portal_deploy/portal_deploy.py verify-post-deploy must treat a non-ACTIVE Guacamole cluster as failure when Guacamole outputs are present.",
        "checks": [
          "deploy-verification-fail-loud"
        ]
      },
      {
        "id": "ADR-003-R6",
        "description": "After successful dev portal deploy verification, provider-specific reusable deploy workflows may run an advisory post-deploy range smoke job (post-deploy-smoke) that executes the shared run_post_deploy_smoke manage command through the provider's portal-exec transport. The job must remain dev-only (`inputs.is_dev` or the provider-equivalent dev-environment gate), continue-on-error so deploy success is not blocked, request `issues: write` only for failure issue creation, and declare SMOKE_* secrets on the reusable workflow. AWS keeps its existing `scripts/smoke-test.sh` -> `scripts/portal_deploy/portal_deploy.py run-manage-on-portal` SSM transport, and long-running AWS portal-manage commands must poll SSM command status until the requested timeout rather than relying on the fixed-limit `aws ssm wait command-executed` waiter. The shared smoke readiness loop must return only on READY and fail immediately on every canonical terminal ResourceStatus while preserving request-id cleanup, rather than waiting for the provision timeout after FAILED or DESTROYED. Provider parity must reuse the shared smoke command/variant contract rather than forking smoke lifecycle logic by cloud.",
        "checks": [
          "deploy-verification-fail-loud",
          "deploy-workflow-runner-exposure"
        ]
      },
      {
        "id": "ADR-003-R4",
        "description": "AWS portal deployment mode must have one authoritative source: the deploy workflow derives single-instance vs. ASG mode from Terraform outputs, not from a GitHub Actions variable. The single-instance path must fail unless exactly one running tagged portal instance matches Terraform state, and the ASG path must verify the deployed image digest on every in-service instance after refresh.",
        "checks": [
          "portal-deploy-mode-source-of-truth"
        ]
      },
      {
        "id": "ADR-003-R5",
        "description": "Deploy workflows must keep pull_request events on GitHub-hosted PR validation only. Jobs that can reach self-hosted deploy runners, assume deploy roles, push ECR images, mutate infrastructure, or restart runtime services must be gated to trusted push/workflow_dispatch runs and bind a separate GitHub Environment name such as aws-dev, aws-prod, or gcp-dev. AWS ECR repositories are immutable; AWS deploy consumers use repo@sha256 image digests instead of mutable latest/short-SHA image identity. The deploy-workflow-runner-exposure check enforces the pull_request half by evaluating each reusable workflow's self-hosted job if-expression for a pull_request event and requiring it to fail closed (semantic evaluation, not substring matching).",
        "checks": [
          "deploy-workflow-runner-exposure"
        ]
      },
      {
        "id": "ADR-003-R7",
        "description": "SonarCloud scanner identity is repository deployment configuration, not shared source-analysis configuration. The SonarQube Cloud scan step in `.github/workflows/_quality.yml` consumes the project key and organization from the non-secret `SONAR_PROJECT_KEY` and `SONAR_ORGANIZATION` repository variables; `sonar-project.properties` retains shared sources, exclusions, report paths, suppressions, encoding, version, and file-header policy but no `sonar.projectKey`, `sonar.organization`, or `sonar.projectName`. The scan attempt is gated on the canonical `github.repository`, never on either variable being present, so missing or renamed variables fail the scanner loudly on `Brad-Edwards/shifter`. Runs under any other repository slug skip: SonarCloud is this project's tooling choice and is not imposed on anyone who cloned the repository. Fork-origin pull requests also skip, because they execute in the base repository's context (passing the identity test) but receive no secrets, and a scan that cannot be given `SONAR_TOKEN` would hand an outside contributor an unfixable red check; their code is analyzed on the `dev` run after merge. The existing `SONAR_TOKEN` reusable-workflow secret boundary, path/coverage routing, and action SHA pinning remain unchanged. Every canonical analysis that runs MUST set `sonar.qualitygate.wait=true`; scanner upload success without the terminal quality-gate verdict is not an accepted release result. Repository-variable activation and readback are part of the same delivery as the workflow change. The `.ground-control.yaml` `sonarcloud` block remains Ground Control integration metadata and is not a scanner runtime input or an alternative source for workflow arguments.",
        "checks": []
      },
      {
        "id": "ADR-003-R8",
        "description": "Repository security analysis used as a release gate MUST fail closed on producer failure and governed findings. CodeQL analysis/upload cannot use `continue-on-error`; the existing Python and JavaScript `security-extended` analyses remain intact. OSV-Scanner MUST discover and scan every owned `package-lock.json` and `uv.lock` as a lockfile, fail the Quality workflow when any scan fails or reports a vulnerability, and preserve per-lock SARIF evidence. Every Python package root with `pyproject.toml` MUST have a corresponding Dependabot uv owner in `.github/dependabot.yml`. Advisory configuration scans remain explicitly named advisory and do not substitute for these blocking source/dependency results or exact deployed-artifact evidence.",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": [
      "ci"
    ],
    "evidence": [
      ".github/workflows/_quality.yml",
      ".github/workflows/deploy.yml",
      ".ground-control.yaml",
      ".gc/plan-rules.md",
      "sonar-project.properties",
      ".github/workflows/codeql-analysis.yml",
      ".github/dependabot.yml",
      ".github/workflows/_core.yml",
      ".github/workflows/_range.yml",
      ".github/workflows/_shifter-engine.yml",
      ".github/workflows/_shifter-platform.yml",
      "scripts/portal_deploy/portal_deploy.py",
      "scripts/portal-deploy/deploy_portal.sh",
      "scripts/adr_guard/tests/test_deploy_workflow.py",
      "platform/terraform/environments/dev/portal/outputs.tf",
      "platform/terraform/environments/prod/portal/outputs.tf"
    ]
  },
  {
    "id": "ADR-004",
    "title": "Use stack-appropriate off-the-shelf policy tooling where it fits",
    "status": "accepted",
    "scope": "repository",
    "decision": "Prefer mature ecosystem-native enforcement tools for workflows, Terraform, Python import contracts, and secret scanning, while keeping repo-specific rules in adr_guard.",
    "rules": [
      {
        "id": "ADR-004-R1",
        "description": "GitHub Actions workflows are linted with actionlint.",
        "checks": []
      },
      {
        "id": "ADR-004-R2",
        "description": "Terraform code is linted with TFLint in addition to fmt and validate. Every Terraform execution root is registered in platform/terraform/validation-inventory.yaml (classified against every tracked Terraform directory, with a validation owner, a named toolchain profile, and declared provider source addresses verified against its committed lockfile); scripts/check_tf_roots/ validates that inventory and emits the pull-request CI matrix that runs a credential-free, backendless `terraform init -backend=false -lockfile=readonly` plus `terraform validate` per affected root in .github/workflows/_quality.yml. The same inventory drives the credential-free `terraform test` contract-test job: every module whose `contract` ships a test, and every root that declares an optional `test` (run with the root's own toolchain profile and `-lockfile=readonly` against its committed lockfile). A tracked Terraform directory that is not classified fails the gate, so a new root cannot merge without validation ownership.",
        "checks": []
      },
      {
        "id": "ADR-004-R3",
        "description": "Python package import contracts are enforced with import-linter in addition to repo-specific checks.",
        "checks": []
      },
      {
        "id": "ADR-004-R4",
        "description": "New commits are scanned for secrets with gitleaks.",
        "checks": []
      },
      {
        "id": "ADR-004-R5",
        "description": "Kubernetes manifests are validated with kubeconform and linted with kube-linter on two tiers. Kustomize patch files use the .patch extension so directory-wide validators do not treat partial strategic-merge documents as standalone Deployments (no selector, no image, no securityContext). CI (.github/workflows/_quality.yml) runs `kustomize build` on every kustomization.yaml root under platform/k8s/ and runs both validators against the rendered output, which catches overlay-introduced regressions on the manifests that actually deploy.",
        "checks": []
      },
      {
        "id": "ADR-004-R6",
        "description": "GCP Terraform is linted with the tflint-ruleset-google plugin.",
        "checks": []
      },
      {
        "id": "ADR-004-R7",
        "description": "Committed Terraform variable files under platform/terraform/environments/ and platform/terraform/global/ must not assign string literals to secret-bearing suffixes: password, secret, token, key, credentials, authcode, or pin_value. Bare authcode and pin_value names are also blocked. Reference an out-of-band secret store (Secrets Manager, SSM, environment) instead. Backstops gitleaks for low-entropy committed credentials it ignores.",
        "checks": [
          "no-plaintext-secrets-in-tfvars"
        ]
      },
      {
        "id": "ADR-004-R8",
        "description": "Generated and pre-staging sensitive artifacts must not be tracked in source: Terraform plan outputs (tfplan, tfplan.binary, plan.out, *.tfplan) under platform/terraform/environments/ and platform/terraform/gcp/environments/, Polaris range build output under scenario-dev/polaris/build/, Polaris AWS operator run outputs (provisioning_state.json, provisioning_status.md, health_report.md, postprovision_status.md) under scripts/polaris-aws-range/, and license/authcode bootstrap material (authcodes, *.authcodes) under temp/bootstrap/. The blocked path/name set is centralized in scripts/adr_guard/adr_guard.py; the guardrail fails closed and emits repo-relative paths only, never file contents.",
        "checks": [
          "no-tracked-generated-artifacts"
        ]
      },
      {
        "id": "ADR-004-R9",
        "description": "Tracked *-secrets.env files under platform/k8s/ must contain only comments, blank lines, empty assignments (KEY=), or a small fixed synthetic-placeholder allowlist (REPLACE_AT_DEPLOY, CHANGE_ME, PLACEHOLDER, EXAMPLE, plus the matching bracketed forms <replace-at-deploy>, <change-me>, <placeholder>, <example>). The bracketed forms are an explicit fixed set, NOT a <...> pattern, to prevent hiding a real credential as <attacker-known-password>. Real runtime secrets must flow in at deploy time from GCP Secret Manager, a gitignored local env file, or a deploy-time Kubernetes Secret. Containment uses git ls-files so gitignored local-dev files (e.g. *.local.env) are intentionally not scanned. The parser splits on the first '=' so non-identifier key shapes (db.password=..., api-token=..., export DB_PASSWORD=...) still flow through the value check. Inline '# comment' is NOT honored (Kustomize env_file format treats '#' as a comment only at the start of a line). Non-comment lines without '=' are flagged as malformed. The blocked condition is centralized in scripts/adr_guard/adr_guard.py; violation messages name the repo-relative path and the variable name only, never the rejected value. Backstops gitleaks for low-entropy committed credentials it ignores and prevents reintroduction of the failure mode resolved by #1207 / #1195.",
        "checks": [
          "no-populated-secret-env-files"
        ]
      },
      {
        "id": "ADR-004-R10",
        "description": "Every Terraform module that defines an `aws_iam_role` whose attached `aws_iam_role_policy` grants `secretsmanager:GetSecretValue` (or any wildcard that covers it \u2014 `secretsmanager:*`, `secretsmanager:Get*`, `*`) on a secret encrypted with the portal Secrets Manager CMK must also attach a single `aws_iam_role_policy` statement granting `kms:Decrypt` on that CMK. The grant must satisfy all three predicates in the SAME IAM Statement: Action covering `kms:Decrypt`; Resource set to `var.secrets_manager_kms_key_arn` or `var.secrets_kms_key_arn` (both are accepted module-input names referring to the portal CMK; preferred) or `\"*\"` (accepted when the same statement carries the service condition); Condition `StringEquals` (or `StringLike`) `kms:ViaService = \"secretsmanager.<region>.amazonaws.com\"`. Spreading the three predicates across separate statements does NOT satisfy IAM evaluation. Additionally, any IAM statement granting `kms:Decrypt` on `Resource=\"*\"` (or `[\"*\"]`) must carry a `kms:ViaService` condition pinning to some service \u2014 unconditioned wildcard `kms:Decrypt` is too broad. The check is implemented in `scripts/check_tf_kms_secrets_grant/check_tf_kms_secrets_grant.py` and wired as the `check-tf-kms-secrets-grant` pre-commit hook plus a CI step in `.github/workflows/_quality.yml`. Currently scoped to `platform/terraform/modules/engine-provisioner/iam.tf`, `platform/terraform/modules/portal/ec2/main.tf`, and `platform/terraform/modules/guacamole/iam.tf`; expand the hook's `files:` regex and the CI invocation when a new module starts reading portal Secrets Manager secrets. Backstops the silent failure mode resolved by #52 where a fresh Secrets Manager CMK rotation left multiple roles without `kms:Decrypt` and ECS task secrets injection aborted at startup with `AccessDeniedException: Access to KMS is not allowed`.",
        "checks": []
      },
      {
        "id": "ADR-004-R11",
        "description": "Checkov is a blocking gate for first-party Terraform under `platform/terraform/`. The pre-commit hook (`.pre-commit-config.yaml` `checkov`) and the GitHub Actions security-iac job (`.github/workflows/_quality.yml`) both consume the same canonical config at `platform/terraform/.checkov.yaml`; `--soft-fail` is not set on either surface. Accepted-risk waivers (Checkov `skip-check` entries in `.checkov.yaml` or inline `# checkov:skip=CKV_X:...` comments on individual resources) MUST have a matching entry in `docs/adr/exceptions.yaml` with `rule_id: ADR-004-R11`, owner, reason (containing the Checkov policy ID), `expires_on`, and the affected `paths`. `adr_guard.py` rejects expired exceptions, forcing owner re-review. GCP waivers MUST be placed inline on the exact Terraform resource; global `CKV_GCP_*` and `CKV2_GCP_*` skip lists are prohibited because they hide unrelated future resources. Terraform Checkov policy and Kubernetes Checkov policy are separate surfaces: the `security-k8s` job intentionally remains `soft_fail: true` while manifest hardening proceeds under a separate issue, and Kubernetes soft-fail debt does NOT justify Terraform soft-fail. If non-GCP rule-level policy grows beyond a flat skip list, centralize it in `platform/terraform/.checkov.yaml` only \u2014 do NOT duplicate skip semantics across pre-commit args and workflow inputs.",
        "checks": []
      },
      {
        "id": "ADR-004-R12",
        "description": "First-party AWS RDS DB instances under `platform/terraform/modules/portal/rds/main.tf` and `platform/terraform/modules/guacamole/rds.tf` MUST keep `iam_database_authentication_enabled = true` and MUST explicitly set `ca_cert_identifier` to a non-empty expression. Checkov covers IAM authentication through CKV_AWS_161, but CKV_AWS_211 currently passes when the CA attribute is absent; the repo-native `scripts/check_tf_rds_security/check_tf_rds_security.py` checker closes that gap. The checker is wired as the `check-tf-rds-security` pre-commit hook and a CI step in `.github/workflows/_quality.yml`, and its unittest suite is included in the `check_tf_*` checker tests.",
        "checks": []
      },
      {
        "id": "ADR-004-R13",
        "description": "Portal target-service security groups MUST NOT admit ingress from the whole public subnet tier. Every `aws_security_group_rule` ingress in `platform/terraform/environments/{dev,prod}/portal/main.tf` whose `security_group_id` is the Django EC2 SG (`module.ec2.security_group_id`) or the Guacamole client SG (`module.guacamole.guacamole_client_security_group_id`) MUST source either from a security-group reference (`source_security_group_id`, the preferred posture on the inspection-off path) or from the ALB-only `module.vpc.alb_ingress_subnet_cidrs` output. `module.vpc.public_subnet_cidrs`, `module.vpc.public_workload_subnet_cidrs`, or any other CIDR source is rejected because those tiers contain or may contain workloads other than the ALB (the standalone CTFd instance lives in the public-workload tier). AWS Network Firewall breaks SG referencing across the routed inspection middlebox, so the inspected ALB->target path legitimately needs a CIDR rule; scoping it to the ALB-only tier keeps CTFd fenced off Django:8000 / Guacamole:8080 while preserving the inspection path. Backstops the #911 NET-2 / #933 segmentation regression where the CIDR rule was scoped to `public_subnet_cidrs` and gave CTFd direct L4 reach past the ALB/WAF/`/admin` deny. The checker is `scripts/check_portal_target_sg_sources/check_portal_target_sg_sources.py`, wired as the `check-portal-target-sg-sources` pre-commit hook and a CI step in `.github/workflows/_quality.yml`, with its unittest suite included in the `check_tf_*` checker tests.",
        "checks": []
      },
      {
        "id": "ADR-004-R14",
        "description": "Tracked files MUST NOT contain live AWS infrastructure identifiers: 12-digit AWS account IDs, VPC IDs (`vpc-<hex>`), subnet IDs (`subnet-<hex>`), or Shifter S3 bucket names that are account-ID-suffixed (`shifter-...-<12 digits>`) or UUID-suffixed infra/state buckets (`shifter-[dev-]infra-<uuid>`); and, in IaC files (`.tf`/`.tfvars`/`.hcl`) only, globally-routable public IPv4 addresses in code (comments excluded), which are almost always an operator/participant allow-CIDR \u2014 a home/office IP, i.e. PII. Public-IP detection uses `ipaddress.is_global`, so private (RFC1918), loopback, link-local, CGNAT, and documentation (RFC5737: 192.0.2/198.51.100/203.0.113) ranges pass; a small in-code allowlist covers well-known public infra constants (Google/Cloudflare public DNS; GCP load-balancer health-check, IAP, and googleapis VIP ranges). These are low-entropy but reconnaissance-sensitive in a public repo and are not caught by gitleaks (which targets high-entropy secrets); this is the complementary backstop. Detection is by pattern in the centralized `no-live-cloud-identifiers` check in `scripts/adr_guard/adr_guard.py`, never by a denylist of real values. The allowlist is a small fixed set of 12-digit runs that are not Shifter accounts: AWS documentation example account IDs (123456789012, 111122223333), the all-zero placeholder, and public AMI-publisher account IDs (Canonical 099720109477, OffSec/Kali 679593333241). Placeholder and example forms (`vpc-xxxxxxxx`, `<your-account-id>`) are not matched because the patterns require hex / 12 literal digits, so there is no universal `<...>` wildcard a real value can hide behind. Real values that MUST stay committed are cleared via scoped `docs/adr/exceptions.yaml` entries with `rule_id: ADR-004-R14`, owner, reason, `expires_on`, and `paths`: vendor connector templates under `platform/cloudformation/` (Prisma Cloud account IDs must be exact), S3 backend/state buckets read directly by `terraform init` (`*.s3.tfbackend`, the remote-state data sources in `platform/terraform/environments/*/portal/main.tf`, and the operational state-bucket map in `mcp/ops/index.js`), and synthetic 12-digit PAN firewall serial-number fixtures in `shifter/engine/provisioner/tests/test_main.py`. `.lock` files and binary assets are skipped. Violation messages name the repo-relative path, line, and identifier kind only \u2014 never the value. Dependency lock files and binary assets are not scanned. The check runs at the `fast` and `ci` levels and is wired into `.pre-commit-config.yaml` and `.github/workflows/_quality.yml`. Closes the #911 SEC-2 / NET-10 / DP-7 identifier-strip gap and blocks reintroduction.",
        "checks": [
          "no-live-cloud-identifiers"
        ]
      },
      {
        "id": "ADR-004-R15",
        "description": "Committed Terraform under `platform/terraform/` must not ship operational placeholders in `.tf` sources: hardcoded `YOUR_EMAIL@example.com` budget-alert recipients, `subscriber_email_addresses` literals pointing at `@example.com`, or a managed `AdministratorAccess` attachment on the GitHub Actions OIDC role in `platform/terraform/global/iam/github-oidc.tf`. Real alert recipients belong in gitignored `local.auto.tfvars` or the per-environment `TF_VARS_<ENV>_CORE` / `TF_VARS_<ENV>_PORTAL` deploy secrets; CI OIDC permissions stay on scoped policies. Enforced by `no-terraform-operational-placeholders` and `github-oidc-no-admin-access` in `scripts/adr_guard/adr_guard.py` at the `fast` and `ci` levels.",
        "checks": [
          "no-terraform-operational-placeholders",
          "github-oidc-no-admin-access"
        ]
      },
      {
        "id": "ADR-004-R16",
        "description": "Mission Control runtime code MUST NOT contain hardcoded CTF challenge flag literals. The `no-mission-control-flag-literals` check in `scripts/adr_guard/adr_guard.py` scans the `shifter/shifter_platform/mission_control/` package (all runtime; its tests live under `shifter/shifter_platform/tests/mission_control/`, outside scope) and the `shifter/shifter_platform/templates/mission_control/` template tree (covering inline `<script>` JavaScript) for answer-shaped `FLAG{...}` literals (case-insensitive). Detection is by pattern, never by a denylist of real values. Format-hint placeholders that describe the answer shape rather than carry one are intentionally NOT flagged: an empty body (`FLAG{}`), the ellipsis form (`FLAG{...}`), and angle-bracket templates (`FLAG{<16-hex>}`). The path scope deliberately excludes tests, docs, the native `ctf` app (`CTFChallenge`/`CTFFlag` and `ctf.services`/templates, where `FLAG{...}` is a documented format hint), and Polaris scenario content under `scenario-dev/polaris/`, where flags are legitimate challenge content. Challenge answers belong to the CTF/CTFd content domain, not the Mission Control application path. CTF flags are low-entropy and are not caught by gitleaks (which targets high-entropy secrets); this is the complementary repo-specific backstop. Violation messages name the repo-relative path and line only \u2014 never the matched value. The check runs at the `fast` and `ci` levels via the existing `python3 scripts/adr_guard/adr_guard.py --all --level ci` invocation in pre-commit and `.github/workflows/_quality.yml`. Closes the #560 regression gap (the `box_info` literal-flag map removed during the mission_control views package split) and blocks reintroduction.",
        "checks": [
          "no-mission-control-flag-literals"
        ]
      },
      {
        "id": "ADR-004-R17",
        "description": "The shared range *guest* instance role (`aws_iam_role.range_instance` in `platform/terraform/modules/range/vpc/iam.tf`) MUST NOT be granted SSM Parameter Store access on a Resource that wildcards across the environment or range segment. Specifically, any `aws_iam_role_policy`/`aws_iam_policy` attached to a range-instance role whose statement carries an SSM parameter action (`ssm:PutParameter`/`GetParameter`/`GetParameters`/`GetParametersByPath`/`GetParameterHistory`/`DeleteParameter`/`DeleteParameters`/`LabelParameterVersion`, or a wildcard such as `ssm:*`/`ssm:Get*` covering them) MUST NOT use a Resource matching `parameter/shifter/*/range/...` (environment wildcard), `parameter/shifter/<env>/range/*` that is not bound to a concrete `${var.range_id}`/`${range_id}` token (range wildcard), or a full `*` Resource (which covers every environment and range). The checker is fail-closed for the all-wildcard shapes: a full wildcard `Action = \"*\"` is treated as granting SSM parameter access, and a full wildcard `Resource = \"*\"` is a violation, so a broad statement cannot slip past by omitting the literal `ssm:` action or `parameter/shifter` ARN. A correctly range-scoped grant `parameter/shifter/<env>/range/${var.range_id}/*` is allowed. The provisioner orchestrator role (`aws_iam_role.ecs_task` in `platform/terraform/modules/engine-provisioner/iam.tf`) legitimately holds an env-scoped `parameter/shifter/${var.environment}/range/*` grant and is NOT a range-instance role, so it is not inspected. Range guests do not use their instance role for Parameter Store at all: guest setup is brokered by the provisioner, and secret-bearing password delivery uses a host-key-pinned SSH stdin channel after non-secret SSM bootstrap, so a direct guest-role grant is both over-broad and unnecessary. Backstops the cross-tenant credential-access exposure resolved by #1178 (the role previously granted SSM Put/Get/Delete on `parameter/shifter/*/range/*`, wildcarded across every environment and range) and blocks reintroduction. Implemented in `scripts/check_tf_iam_ssm_range_scope/check_tf_iam_ssm_range_scope.py`, wired as the `check-tf-iam-ssm-range-scope` pre-commit hook and a CI step in `.github/workflows/_quality.yml`, with its unittest suite included in the `check_tf_*` checker tests. Currently scoped to `platform/terraform/modules/range/vpc/iam.tf`; expand the hook's `files:` regex and the CI invocation when another module defines a range-instance role.",
        "checks": []
      },
      {
        "id": "ADR-004-R18",
        "description": "The GitHub Actions OIDC deploy role in `platform/terraform/global/iam/github-oidc.tf` MUST keep its managed-policy attachments consolidated by AWS service category and at or below 6 `aws_iam_role_policy_attachment` resources, preserving headroom under AWS's hard limit of 10 managed policies per role. A new AWS service surface MUST be added by extending one of the existing category policies (`compute`, `networking`, `data`, `security`, `management`), not by adding another attachment. The cap is enforced by `scripts/check_tf_iam_role_naming/check_tf_iam_role_naming.py` (`OIDC_ATTACHMENT_CAP`), wired as the `check-tf-iam-role-naming` pre-commit hook, with its unittest suite included in the `check_tf_*` checker tests. The same checker preserves the deploy-role naming seam (`role/shifter-*`), the `iam:AttachRolePolicy` `iam:PolicyArn` allowlist, and the OIDC `iam_scoped` trust scoping. Consolidation moves IAM statements between category policies without broadening scopes or conditions; the migration uses `moved` blocks so existing environments replace attachment addresses in place (destroy-before-create) and never exceed 10 attachments mid-apply. Established by #254 when the role's 10 by-service policies were consolidated into 5 by-category policies.",
        "checks": []
      },
      {
        "id": "ADR-004-R19",
        "description": "Because the GitHub Actions OIDC deploy role consolidates many AWS services into 5 category managed policies (ADR-004-R18), each category policy document MUST stay under AWS's hard limit of 6,144 characters for a customer-managed policy, so a category can be extended with new deploy verbs without the deploy hitting `LimitExceeded` at apply time. The limit is enforced by `scripts/check_tf_iam_role_naming/check_tf_iam_role_naming.py` (`OIDC_POLICY_DOC_LIMIT`, `check_github_oidc_policy_doc_size`), wired as the `check-tf-iam-role-naming` pre-commit hook, with its unittest suite included in the `check_tf_*` checker tests. The checker measures the whitespace-stripped HCL of each `aws_iam_policy` block, a conservative over-estimate of the rendered JSON because the `${...account_id}`/`${...aws_region}` interpolations are longer than the values they render to, so a passing check guarantees the rendered document is also under the limit. When a category approaches the limit it MUST be compacted or split rather than allowed to overflow. Established by #254 when the by-category policies were extended to cover the full platform deploy surface under least privilege.",
        "checks": []
      },
      {
        "id": "ADR-004-R20",
        "description": "The self-hosted GitHub Actions deploy runner MUST fail closed on account-default-VPC placement by default. Durable placement is a dedicated, non-default runner network outside range provisioning and DNS scope, with private hosts and outbound egress. Issue #1437 selects reproducible isolated placement using the existing platform/terraform/global/github-runner execution root and modules/github-runner-network module introduced by #1433; do not add a second runner or network root. The standard managed path uses var.create_runner_network and var.runner_network_cidr. Preserve var.vpc_id / var.subnet_id for an explicitly supplied compliant network; the portal private tier is an optional existing-network choice, never a fresh-account prerequisite. Runner account ownership must also satisfy ADR-053-R3; VPC isolation does not authorize development runners in product/operator deploy-target accounts. The Terraform default-VPC and subnet-membership lifecycle preconditions remain mandatory; var.allow_default_vpc stays false by default and must never be an implicit recovery fallback. A default-VPC departure requires explicit opt-in and documented risk acceptance; new or renewed exceptions use docs/adr/exceptions.yaml with owner, scope, reason, and expiry. A non-default ID alone does not prove isolation: effective range permissions must exclude runner-network mutation, and private-zone associations or Resolver forwarding must not reintroduce range DNS scope. Use the existing runner state/backend boundary and bootstrap/teardown owners; supported entry points must agree on placement and destruction must preserve the applied managed, external, or exceptional-default topology. Live identifiers remain untracked per ADR-004-R14. The expression-presence guard is scripts/check_tf_runner_network/check_tf_runner_network.py, wired through pre-commit and _quality.yml; it does not prove behavioral enforcement or operational adoption. #1437 standardizes the repository: dev.tfvars and proof.tfvars select var.create_runner_network, bootstrap selects managed creation, default-subnet discovery never runs when a managed network is created, and scripts/bootstrap/aws_env_destroy.py resolves managed, exceptional-default, and explicit external topology from positive state evidence, failing closed when it cannot. Live migration of existing runners and its operational evidence remain outstanding and are not claimed complete by this ADR. See docs/architecture/github-runner-placement-preflight-1437.md for concrete validation, IAM, secret-transport, lifecycle, and evidence gaps. Established by #1222; escape hatch added by #1425; durable direction recorded by #1437.",
        "checks": []
      },
      {
        "id": "ADR-004-R21",
        "description": "The per-range Polaris Bedrock agent role (`aws_iam_role.polaris_agent` in `shifter/engine/provisioner/terraform/modules/range/iam.tf`) MUST stay scoped to exactly the narrow shape #1377 established. Its inline policy (`aws_iam_role_policy.polaris_agent`) MUST grant only `bedrock:InvokeModel` and `bedrock:InvokeModelWithResponseStream` (no other action, and never a `bedrock:*` or full `*` wildcard), and its `Resource` fields MUST reference only the four `polaris_agent_main_inference_profile_arn` / `polaris_agent_small_inference_profile_arn` / `polaris_agent_main_backing_model_arns` / `polaris_agent_small_backing_model_arns` variables (never `Resource = \"*\"` or any other wildcard ARN); the statement granting access to the backing foundation models MUST carry a `bedrock:InferenceProfileArn` condition scoping it to the approved inference profiles, since those models are reachable only through those profiles. The role's trust policy MUST bind `Principal.AWS` to `var.range_instance_role_arn` (never a wildcard or a service principal) AND MUST carry a `StringEquals` condition on `ec2:SourceInstanceARN`, so no range host other than the exact Polaris EC2 instance can assume it even though the shared range-instance role's own IAM policy allows assuming anything in the shifter-${environment}-*-polaris-agent namespace. The role MUST also set a permissions boundary (`var.polaris_agent_permissions_boundary_arn`) and the standard Shifter tags (`local.common_tags`). No S3, SSM, IAM, KMS, Secrets Manager, or arbitrary STS access is granted. Enforced by `scripts/check_tf_iam_bedrock_agent_scope/check_tf_iam_bedrock_agent_scope.py`, wired as the `check-tf-iam-bedrock-agent-scope` pre-commit hook and a CI step in `.github/workflows/_quality.yml` right after `tflint --recursive`, with its unittest suite included in the `check_tf_*` checker tests. Established by #1377.",
        "checks": []
      },
      {
        "id": "ADR-004-R22",
        "description": "The packer.yml base-image `build` job MUST assume a dedicated least-privilege image-pipeline role (`aws_iam_role.github_actions_image` in `platform/terraform/global/iam/github-oidc.tf`), never the broad `github_actions` deploy role: the deploy role legitimately passes portal EC2, ECS, Lambda, RDS-monitoring, and every range role to AWS services, so it cannot simultaneously prove that a base-image verification instance may receive ONLY the range instance role. This dedicated principal IS the IAM boundary the workflow's inline `dev|main` ref gate is not (a feature-branch copy of the workflow could weaken that gate before it runs). Its OIDC `assume_role_policy` MUST pin the trust `sub` to the EXACT protected-branch subjects (`repo:${var.github_org}/${var.github_repo}:ref:refs/heads/dev` and `.../main`), never a `repo:...:*` wildcard, so a pull-request or feature-branch subject receives no AWS role. Its inline policy (`aws_iam_role_policy.image_pipeline`) MUST scope `iam:PassRole` to EXACTLY `role/shifter-${var.environment}-range-range-instance` with an `iam:PassedToService = ec2.amazonaws.com` condition - never `shifter-*`, `*-range-instance`, `role/*`, role tags, or profile-name validation (AWS warns role tags are not a PassRole boundary) - so the fresh-boot verifier can launch a range-profile instance while the role cannot exfiltrate a more-privileged profile. EC2 is scoped by action to the amazon-ebs builder + verifier + `always()` cleanup set (never `ec2:*`); SSM is the verifier (`DescribeInstanceInformation` / `SendCommand` / `GetCommandInvocation`) plus publication of the `/shifter/ami/*` base pointers only. No IAM mutation, Secrets Manager, arbitrary Parameter Store, or scenario-artifact access is granted, and `bake-scenario` MUST NOT use this base-image role; its separate principal/trust boundary is governed by ADR-004-R23. The exact-subject and exact-range-role invariants are enforced by `scripts/check_tf_iam_role_naming/check_tf_iam_role_naming.py` (`check_github_oidc_image_role_trust`, `check_github_oidc_image_passrole_scope`), wired as the `check-tf-iam-role-naming` pre-commit hook and the matching `_quality.yml` CI step, with its unittest suite included in the `check_tf_*` checker tests; the checks no-op when the role is absent so deploy-only fixtures are unaffected. The role ARN is published as the `github_actions_image_role_arn` global-IAM output and wired to the `AWS_IMAGE_ROLE_ARN_<ENV>` GitHub secret; the actual global-IAM `terraform apply` + secret creation + OIDC-subject verification is a post-merge operator cutover, not part of the implementation PR. Binding design note: `docs/architecture/packer-base-build-privilege-boundary-preflight-1656.md`. Established by #1656.",
        "checks": []
      },
      {
        "id": "ADR-004-R23",
        "description": "Credentialed `workflow_dispatch` jobs MUST establish reviewed-code provenance at the external cloud trust boundary before dispatched workflow code can obtain an identity. After verifying the repository's live default GitHub OIDC subject contract (`use_default: true`, `use_immutable_subject: false`), the general AWS deploy role in `platform/terraform/global/iam/github-oidc.tf` MUST trust only the exact protected-branch subjects needed by non-Environment callers and the exact environment-derived subjects needed by Environment-bound callers; `repo:${var.github_org}/${var.github_repo}:*` is forbidden. Every trusted GitHub Environment MUST restrict deployment branches to the protected branches because an Environment `sub` does not contain the source ref. GCP WIF used by deploy/image workflows MUST require the exact repository, an exact protected `assertion.ref`, and exact allowed `assertion.sub` values, and each service-account binding MUST name exact subject principals rather than a repository-wide `principalSet` binding; the CKV_GCP_125 repository-scope waiver is not permitted. Credentialed logic MUST execute from the authorized event commit (`github.sha`) or another immutable protected commit, never a caller-selected or re-resolved mutable ref. The GCP build, validate, promote, release-scan, deploy, and destroy capabilities use purpose-specific least-privilege identities instead of inheriting the shared build/deploy identity; the release scanner has repository-scoped read only and no deployment/runtime-secret authority. Deploy and destroy MUST NOT receive project-wide Compute Admin, instance/image administration, Storage Admin, Editor, or Owner roles: platform compute lifecycle uses network/security administration roles, while object and bucket lifecycle permissions are condition-bound to the deterministic platform-owned bucket names and exclude the release-evidence bucket. Under the default GitHub OIDC subject format, purposes that currently share an Environment also share the same `sub`; they MUST move to pairwise-distinct, purpose-scoped Environment subjects before separate service accounts can be claimed as an authorization boundary. Evidence bucket IAM MUST also preserve producer separation with object-prefix conditions: build creates immutable build-source records, validation reads only those records and creates validation records, release-scan and deploy create only their own evidence classes, and promotion reads only validation records. A bare mutable image label is not authoritative build or promotion evidence: the build producer binds the protected source revision to the server-assigned numeric image ID in immutable private evidence, validation requires that record to match its own protected revision and the exact candidate, and promotion binds the exact candidate to the successful protected validation run, revision, run attempt, and exact immutable private evidence objects. Promotion MUST fetch the exact redacted verdict artifact ID named on the candidate, verify its expected name, non-expired state, and originating successful protected run, and verify its opaque digest binds the candidate project/name/numeric ID/family/type/revision to the full private-evidence digest; possession of a platform GCP credential alone cannot mint this GitHub artifact. Missing, ambiguous, old-schema, malformed, or mismatched evidence fails closed. Raw build, scan, running-image, validation, and guest-SBOM records MUST stay in access-controlled retained storage; public Actions artifacts may expose only a redacted verdict, source revision, opaque locator, private-evidence digest, and opaque candidate-binding digest. The prod copy MUST remain outside the image family until READY state and provider-reported source image ID have been verified, so a failed verification cannot advance the deployment channel. Implementation MUST extend the existing AWS IAM checker for the general role and the focused GCP WIF semantic guard, with positive/negative tests and pre-commit/CI parity; workflow tests MUST inventory every credentialed caller, including shared-provider callers and `_gcp-dev`'s post-deploy authentication job. Live OIDC/IAM/WIF and GitHub Environment policy activation is a documented post-merge operator cutover with readback, not an effect of merging Terraform. Binding design notes: `docs/architecture/credentialed-workflow-dispatch-trust-preflight-1690.md` and `docs/architecture/gcp-ci-purpose-identities-promotion-integrity-preflight-1699.md`. Established by the architecture preflights for #1690 and #1699. For external deployment inventory (#2182, common contract owned by #2178), deployment IDs are data and purpose capabilities remain closed product policy. The same validated purpose mapping must drive exact repository/environment/ref/workflow trust tuples and disjoint service-account bindings; generic rendering must retain blocking CKV_GCP_125 coverage tied to the applied configuration, without tenant-name branches or a waiver. Bootstrap uses explicit initial operator authority and separate foundation/deployment state ownership; migration preserves existing resource ownership and removes obsolete trust. Binding boundary and validation guidance: `docs/architecture/gcp-external-inventory-identity-preflight-2182.md`. The common contract is implemented alongside the installation contract; the source guard enforces the generic template, and bootstrap checks resolved saved-plan trust, requires pinned CKV_GCP_125 coverage, applies only unchanged plan bytes and reads installed policies back. Numeric repository/owner IDs and exact workflow tuples are mandatory. External inventory explicitly selects legacy or immutable default subject syntax; bootstrap reads back the exact prefix and derives immutable subjects from the reviewed numeric IDs. The bootstrap Checkov adapter extends only the pinned CKV_GCP_125 repository parser for immutable syntax, rejects unexpected versions/parser patterns and preserves blocking evaluation; independent resolved-plan and installed-policy verification remain mandatory. Each deployment uses one project for application resources, runners and automation identities. Deploy and destroy retain trusted project-administration authority; exact WIF login restrictions do not isolate an authorized project administrator. Distinct bucket ownership scopes direct state grants. Optional two-project topology is deferred to #2189 by explicit operator direction. Native Terraform tests are registered in the validation inventory. Contract and migration procedure: `docs/architecture/deployment-inventory-contract.md` and `docs/dev/gcp-inventory-bootstrap.md`. Live cutover evidence remains deployment-specific and is not implied by local tests.",
        "checks": []
