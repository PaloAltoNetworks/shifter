    "rules": [
      {
        "id": "ADR-032-R1",
        "description": "Authored RAES intent is consumed verbatim, never re-derived or guessed. The node image is taken from the RAES source (name/version), sizing from resources (ram/cpu), and os_family selects only the OS realization dialect and serves as a cross-check. Realization must not infer the image from os_family, invent sizing, or override authored intent with backend heuristics.",
        "checks": []
      },
      {
        "id": "ADR-032-R2",
        "description": "Concrete artifacts (image ids, machine sizes, subnets, provider configuration, secrets) are resolved at realization time from the authored identity via backend-owned configuration (the registry/prebake seam), never carried as authored RAES semantics. A backend may fast-path a recognized authored identity or compiled-plan signature to a prebaked artifact, but recognition must be keyed on authored/compiled content, must fail loud or fall through, and must never reshape parsing or the model. Sniffing a field to hardcode a specific scenario into a backend is prohibited.",
        "checks": []
      },
      {
        "id": "ADR-032-R3",
        "description": "The only authored provisioning-intent artifact crossing the platform -> provisioner boundary is the serialized RAES compiled ProvisioningPlan; the provisioner reads it with a standalone, version-gated plain-data accessor whose semantics mirror released public RAES accessors (spec.node.source, spec.node.resources, spec.infrastructure) without importing the RAES module family. For source-backed content, dispatch may carry a versioned server-owned delivery binding beside -- never inside -- that plan, limited to the compiled content resource address, sha256 content digest, normalized content-addressed object key, and bounded byte count. The binding contains no payload bytes, bucket or URL, credential, guest path, command, generated configuration, or client-controlled locator; it is persisted separately from range_config and the launch-intent payload, revalidated and joined exactly to the plan before retrieval or mutation, and is not an authored contract, public DTO, or second provisioning model. A process-local realization projection may exist only behind fail-closed consumer validation and only to drive backend realization. Shifter must not introduce a parallel SDL, a persisted/API provisioning-intent schema, or a Shifter-owned intermediate contract that replaces RAES.",
        "checks": []
      },
      {
        "id": "ADR-032-R4",
        "description": "Shifter depends on the exact released PyPI pair raes==3.5.0 and raes-env-packs==5.2.0. Neither contract may use a range, git ref, non-released build, or alternate name. New realization accepts only raes-provisioning-plan-v2 with producer 3.5.0. Cleanup alone may read the previous exact raes-provisioning-plan-v1 / 2.0.0 pair through an isolated view preserving resource and secret identities, without rewriting persisted bytes or allowing old producers for new realization. The RAES module family is imported only within shared.raes (ADR-024, ADR-031-R1); the engine, provisioner, and other layers consume the serialized plan as plain data without importing it.",
        "checks": []
      },
      {
        "id": "ADR-032-R5",
        "description": "A node that declares no RAES source still requires a boot OS; the backend supplies a base OS image resolved from backend-owned configuration keyed on os_family. This base-OS default for a source-LESS node is legitimate backend policy and is the only sanctioned use of os_family to select an image; it is distinct from and does not license inferring an image from os_family for an authored source (ADR-032-R1), and it must fail loud when no base image is registered for the os_family.",
        "checks": []
      },
      {
        "id": "ADR-032-R6",
        "description": "RAES composition capability claims form an honest, fail-closed realizability ledger, not an inventory of fields the backend parses or preserves. A content, account, or feature term may be declared only when every plan shape admitted by that public capability has a genuine guest effect backed by cross-boundary evidence; creating only a parent/destination, writing a marker or descriptor, retaining a projection field, echoing authored intent, submitting an asynchronous bootstrap, or observing command/VM success is not realization. Every admitted guest-local composition item must have its claimed state read back on every concrete target instance before apply returns, operation success/runtime-snapshot evidence is emitted, or the range becomes READY; directory-scoped accounts and SPNs instead require one readback from the declared authoritative directory under the domain realization contract and must not be duplicated per member VM. Sanitized snapshot evidence may identify a verified item only by compiled resource address, composition resource type, and a bounded verified status; it must not carry authored values, target instances, guest output, provider detail, or secrets, and plan-derived entries may be emitted only after exact guest-check coverage succeeds. Coarse capabilities stay narrowed when the public contract cannot distinguish a genuinely realized variant from an unsupported one. Materialized account features must also be revalidated through the canonical RAES extractor against an evidence-backed realization envelope independent of the manifest declaration before dispatch. A removed term is re-declared only with its genuine realization and conformance evidence; realization remains driven only by authored/compiled content, never scenario-sniffed.",
        "checks": []
      },
      {
        "id": "ADR-032-R7",
        "description": "The serialized ProvisioningPlan transport must select and validate supported contract and exact producer versions before payload access or realization. The separate plain-data consumer distinguishes absent optional fields from present malformed fields and must reject missing required values, wrong resource/domain combinations, unknown resource types, malformed payloads, duplicate identities, duplicate aliases, dangling node/network/composition references, domain-topology carriers outside Shifter's supported profiles, and unsupported domain-scoped account terms before any cloud, Terraform, SSH, SSM, or guest mutation. The full canonical compiled resource address is the neutral logical-name fallback and stable identity; provider-safe conversion remains backend policy. Shared admission must invoke the public RAES domain-topology diagnostics against the provisioner's explicitly declared supported_domain_profiles, including the current runtime snapshot for incremental apply. Compatibility tests must use released public RAES accessors, public compiler/conformance fixtures, and Shifter-owned serialized fixtures generated by the exact pin; private reference-backend helpers are not a compatibility contract.",
        "checks": []
      },
      {
        "id": "ADR-032-R8",
        "description": "RAES Node.services entries are authored layer-4 transport exposure intent, not informational labels, guest service installation, participant authorization, or an override of authored ACLs. The GCE realization must validate the compiled spec.node.services payload again at the separate provisioner trust boundary and realize supported TCP/UDP ports as deterministic per-node-tag ingress policy sourced only from concrete CIDRs declared by networks in that same compiled range. It must never widen a service to 0.0.0.0/0, platform/portal/operator CIDRs, or another range by default. The existing management-plane allow remains higher precedence than authored ACLs; authored ACLs remain higher precedence than service-derived allows. Unsupported or malformed service shapes and any priority/source scope that cannot be represented without widening must fail before cloud mutation. The projection is process-local realization data only; it must not become a second SDL, persisted schema, API DTO, setting, or participant-access contract.",
        "checks": []
      },
      {
        "id": "ADR-032-R9",
        "description": "RAES feature bindings use an honest, shape-aware realization ledger. Package/baked services require package presence plus enabled/running in-guest verification before READY; source-backed artifact/configuration bytes reuse the immutable content-addressed delivery channel and independent in-guest digest readback. Unsupported feature types or values fail through the common validate/apply path before dispatch. A versioned server-owned delivery binding may identify a compiled content-placement or feature-binding by resource type plus resource address and bounded payload kind, but remains byte-free and separate from the serialized RAES plan. Feature types must not be modeled as content/account capabilities, features must not masquerade in a legacy content_address, and the backend must not execute pack-supplied commands or installer hooks.",
        "checks": []
      },
      {
        "id": "ADR-032-R10",
        "description": "RAES agents.interactive_access remains participant-domain intent and MUST NOT be injected into the serialized ProvisioningPlan, RaesPlan, provisioning node payloads, backend capability manifest, or redacted runtime snapshot. shared.raes may lower only the released compiler's typed ParticipantBehaviorRuntime interactive-access projection into a versioned, bounded, non-secret sidecar of resolved compiled node address, closed channel, and resolved compiled account address. The sidecar is persisted separately from range_config, carried through the generation-fenced RAES operation input, and joined fail-closed to the separately parsed provisioning nodes/accounts before any provider or secret mutation. Shifter continues to claim no RAES participant_runtime capability. Because current product authorization has no trusted Shifter-actor to RAES-participant mapping, participant-local binding sets may be used only when they are invariant across compiled participant behaviors; they MUST NOT be unioned, guessed from role/name/team, or selected by an endpoint request. Each current binding requires an explicit enabled local account on the same single-instance target, a channel-compatible existing account credential strategy, and exact declaration-to-result equality; omitted/default accounts, domain accounts, count fan-out/implicit #0 selection, and exposure of the reserved provisioner-management account/key fail closed. The bounded realized member/access projection travels only in the authoritative terminal-ready operation result and is atomically persisted with READY, while credential values remain confined to guest installation and the existing terminal/Guacamole connection boundary.",
