        "id": "ADR-039-R1",
        "description": "The published range-substrate port has exactly four operations: provision, destroy, pause, and resume. Each operation covers the complete request-owned resource set -- networks, instances, optional NGFW, and remote-access readiness/bindings -- and reaches an observed postcondition or returns a classified failure. Task or Job submission is delivery, not substrate success; cancel is workflow policy, not a fifth operation.",
        "checks": []
      },
      {
        "id": "ADR-039-R2",
        "description": "Substrate inputs and results are closed and versioned. The port carries existing validated RequestSpec/RangeSpec or ADR-032 RAES ProvisioningPlan realization intent plus its immutable digest and must not introduce another scenario/topology schema, universal placement taxonomy, public status enum, provider API DTO, event family, repository, validator, or exception hierarchy. Scenario realization owns internal composition semantics; substrate lifecycle ownership is limited to provider-safe membership, ownership, state, cleanup, and logical access bindings. Results contain canonical non-secret bindings and a versioned adapter-state reference/projection, never raw provider responses or credential values.",
        "checks": []
      },
      {
        "id": "ADR-039-R3",
        "description": "Operations are request/generation scoped and convergent: same-key/same-intent provision, repeated destroy, and repeated pause/resume at the target state are successful no-ops; same-key/different-intent and concurrent conflicting mutations fail before mutation; timeout/partial outcomes are observed and reconciled before retry. Destroy distinguishes per-range from shared ownership, preserves recovery state until absence is observed, and never deletes shared NGFW/network resources.",
        "checks": []
      },
      {
        "id": "ADR-039-R4",
        "description": "Every adapter maps failures into the shared substrate codes and retry dispositions (invalid-intent, unsupported-capability, not-found, conflict, identity-or-policy, prerequisite, rate-limited, transient-provider, timeout-unknown, partial-failure, adapter-defect). Diagnostics are bounded and sanitized; raw SDK/Terraform errors, resource inventories, secret references/values, and provider payloads do not enter API/websocket errors, events, metrics, or logs.",
        "checks": []
      },
      {
        "id": "ADR-039-R5",
        "description": "Security-sensitive provider assumptions are interface obligations: least-privilege workload identity; installation/request ownership proof; protected and serialized state; fail-closed ingress, cross-range, management, metadata/API, DNS, and egress controls; secret-reference-only persistence/output; structured argv with no credentials/config blobs; and existing admission/runtime hardening. Substrate conformance does not override ADR-030 live-fire backend approval.",
        "checks": []
      },
      {
        "id": "ADR-039-R6",
        "description": "A canonical black-box conformance suite runs unchanged for every adapter and covers contract/version rejection before mutation, all resource families, four-operation replay/concurrency/partial-failure behavior, lossless pause/resume, access readiness, shared-NGFW behavior, ownership/orphan cleanup, error/redaction/observability, and adapter security probes. Stable maturity additionally requires disposable real-provider evidence. An adapter missing a mandatory operation cannot claim full conformance or stable eligibility for a profile requiring it.",
        "checks": []
      },
      {
        "id": "ADR-039-R7",
        "description": "The installation backend-bundle registry selects the provider family, and shared.range_instantiation_policy.RANGE_BACKENDS plus the persisted Range.range_backend binding are the sole range-adapter selection seam within a provider. AWS Terraform, GCP GCE, and GCP GDC are the initial adapters. GCE is the default approved live-fire GCP backend; GDC remains limited by ADR-030 to admitted non-user purposes, and its non-lossless pod lifecycle is an explicit conformance gap. Capability and evidence are scoped to the selected adapter and its complete admitted resource mix: evidence for GCE must not enable GDC, evidence for GDC must not enable GCE, and an unsupported mix fails before mutation. Azure may be added only as another registered bundle/adapter with its own settings and conformance evidence, without provider branches in domain workflows or shared public contracts.",
        "checks": []
      },
      {
        "id": "ADR-039-R8",
        "description": "Existing workflow/security/persistence incumbents remain authoritative: Mission Control/CTF/CMS own auth and audit; ResourceStatus owns public lifecycle state; installation owns config validation; Engine owns orchestration/state; ADR-025 owns durable events/reconciliation; provider secret stores plus Engine/Mission Control own remote-access secret resolution and Guacamole; and #478 owns replacement of the provisioner's direct Django-table integration. Substrate work must reuse rather than duplicate these layers.",
        "checks": []
      },
      {
        "id": "ADR-039-R9",
        "description": "GCP scenario-declared participant/operator endpoint access uses the existing platform-to-range VPC peering and existing portal browser-SSH / guacd Guacamole dialers. Range VMs remain private-only. Logical target/channel declarations and closed realized range-cell bindings are the authorization and persistence source; role, OS, scenario id, credential existence, browser input, and arbitrary host/port values are not. Provisioner management ingress and participant access ingress remain separate. Kubernetes default-deny plus access-workload-specific egress and cell-targeted GCE ingress admit only approved channel ports from dedicated access-workload source identities/ranges; peering alone grants no access. The GCE source identity is a disjoint VPC-native access-pod secondary range on an exclusive, required-placement node pool; missing access CIDR fails closed without falling back to portal, node, default-pod, or management CIDRs, and existing named firewall rules are reconciled rather than trusted merely because they exist. Authorization, READY/member/channel checks run before enqueue and again before credential resolution/dial, while participant removal, binding removal, pause, and destroy invalidate pending bootstraps and terminate or boundedly expire established browser SSH and Guacamole sessions. JSON-auth/bootstrap token expiry alone is not established-session revocation. RAES-native interactive access reaches this same closed binding only through the separately validated ADR-032-R10 participant sidecar; participant-local policies are never unioned and the reserved provisioner-management account/key is never exposed. Recorded by the architecture preflights for #1349, #1710, and #1711.",
        "checks": []
      },
      {
        "id": "ADR-039-R10",
        "description": "User-held client VPN is an ADR-039 remote-access specialization, not a fifth operation, browser-workspace transport, or scenario-authored service. Only a trusted product launch path may mint the closed capability beside scenario intent; product provenance and ownership stay at the product/CMS boundary, while the capability binds one authoritative participant-access target and an enforced server-owned access deadline. CMS persists one lease for every new CTF and Mission Control range: the current deadline is the sole automatic-cleanup authority and the immutable generation ceiling bounds certificate `notAfter`. CTF derives both from event cleanup. Mission Control uses one typed, server-owned lease policy: the deployment-configured 30/30/365 default is the fallback, an audited runtime tenant policy may replace it, and every matching persisted Django RBAC-group policy composes restrictively beneath the tenant (see ADR-011-R9 and the #2169 preflight). Durations resolve inside the cold-create or warm-claim transaction and are snapshotted per generation; the tenant/group extension-admission switch is live. Owners extend only through the existing empty-body action and the generation's server-selected increment, never beyond its immutable maximum; HTTP callers cannot select a deadline, increment, maximum, group, or switch. The DB-authoritative reconciler locks due rows and reuses canonical system-attributed destroy and existing product projections rather than a CTF- or Mission-Control-specific cleanup workflow. Any future product must supply the same enforced lease semantics or introduce an explicitly versioned renewal/revocation lifecycle; caller-supplied, silently expiring, and unbounded deadlines are prohibited, and topology alone never activates a VPN. A required profile terminates on a request-owned logical gateway inside the range containment boundary (never a cross-range shared gateway or the user-controlled target), creates one owner/generation-scoped profile secret reference during provision, and enforces server-side reachability only to the authoritative member target. The only public range ingress exception is the audited per-range mutual-TLS OpenVPN UDP/1194 listener in the request-owned NLB resource; the CIDR guard must match that exact path/resource/protocol/port tuple and its readiness responder is private to the portal network. Infrastructure creation returns pending metadata, and a bounded service-and-policy probe must pass before the binding is published as ready. Download resolves the existing secret after product ownership/state checks; pause disables access, resume restores the current generation, and destroy deletes all generation material. Because a downloaded credential cannot be recalled from a former owner, in-place reassignment is refused while a VPN binding exists; recovery for a new owner must destroy the old generation and provision a new one before readiness. The immutable provisioner-only issuer is retained until generation teardown so retries reuse the exact server/profile material. GCE uses a distinct no-role gateway service account per range generation with secretAccessor only on its own server secret; the provisioner writes serviceAccountUser only on that generated gateway account before Compute attaches it. Profile/private-key/CA signing values are prohibited from public contracts, Django/adapter/Terraform state, events, task payloads, environment, argv, logs, metrics, and errors. Every live-fire adapter eligible for an enabled product profile must pass the same real-client handshake, isolation, lifecycle, secret-deletion, and capacity conformance before advertising the capability; no product or SPA provider branch may compensate for a missing adapter capability.",
        "checks": []
      },
      {
        "id": "ADR-039-R11",
        "description": "Warm pooling is an optional range-warm-activation/v1 adapter capability beside the four-operation substrate. Existing provision may accept a trusted warm-prepared profile only when the exact backend/resource mix advertises that capability; its postcondition is a system-owned quarantined generation with the validated immutable realization ready but no participant credential, access binding, session, or reachable participant path. Atomic claim is an Engine/CMS database allocation transition above the adapter and commits before provider I/O. Activate consumes the unchanged compatibility/realization digests, expected state generation, and an Engine-minted owner/workspace/product projection; owner identity is prohibited from HTTP, environment, and argv. Success requires rotation/removal of every pre-claim guest/provider/access identity, fresh claimant bindings, negative residue checks, isolation, and observed readiness. Miss, race, disabled policy, and unsupported capability preserve the existing cold-provision path; a claimed or suspect generation is never re-offered and is removed only through canonical destroy. Compatibility uses immutable backend/partition/placement, purpose/product/access posture, RAES package/plan, resolved image/artifact bindings, and other realization inputs, never mutable aliases or caller keys. Because legacy RangeSpec embeds user_id, it remains cold-only until a versioned ownership-neutral intent exists; persisted intent must not be mutated or contradicted to make reassignment appear valid. The CTF recovery-spare policy remains a separate event-recovery workflow even if both use shared low-level claim, capacity, lifecycle, audit, or adapter primitives.",
        "checks": []
      }
