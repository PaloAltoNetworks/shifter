provider:
  name: gcp
profile: prod

deployment:
  profile: prod

capabilities:
  gcpBackendConfig: true
  gcpManagedTls: true
  kubernetesJobLauncher: true
  gcpAccessNodePool: true

images:
  platform: us-docker.pkg.dev/placeholder-project/shifter/platform@sha256:1111111111111111111111111111111111111111111111111111111111111111
  guacd: us-docker.pkg.dev/placeholder-project/shifter/guacd@sha256:2222222222222222222222222222222222222222222222222222222222222222
  guacamoleClient: us-docker.pkg.dev/placeholder-project/shifter/guacamole-client@sha256:3333333333333333333333333333333333333333333333333333333333333333

imagePullPolicy: Always

portal:
  replicas: 2

workers:
  cms:
    replicas: 2
  engine:
    replicas: 2
  mc:
    replicas: 2
  ctfScheduler:
    replicas: 1

guacd:
  replicas: 2

# Single guacamole-client replica: tokens are minted and served from task-local
# process memory, so N>1 replicas break first-click RDP (#928). Scale guacd for
# capacity, not the client.
guacamoleClient:
  replicas: 1

services:
  portal:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    backendConfig:
      enabled: true
  guacamoleClient:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'

network:
  ingressSourceCidrs:
    - 35.191.0.0/16
    - 130.211.0.0/22
  providerApiCidrs:
    - 199.36.153.4/30
    - 199.36.153.8/30

edge:
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: gce
