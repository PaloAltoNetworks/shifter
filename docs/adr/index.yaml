      {
        "id": "ADR-051-R11",
        "description": "CTF communications must not register triggers, audiences, channels, content renderers, RAES handlers, or workload ingress through ctf.extensions or AppConfig.ready. Existing trusted-Django-app flag/scoring extensions, CTFEvent branding projection, and Django LocaleMiddleware/gettext catalogs remain their separate CTF-014 incumbents. Authored message locale variants are immutable campaign data, not UI translation catalogs or a custom translation workflow; event branding never supplies content, link-host, email-template, or authorization policy.",
        "checks": []
