    "id": "ADR-047",
    "title": "Capacity-aware provisioning is an Engine-owned admission layer over a deployment-declared catalog",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "Event provisioning is admitted against observed provider headroom before spinup rather than discovering a shortfall mid-wave. CTF declares event intent (CTF-908), CMS keeps authenticated range creation, scenario hydration, and backend admission, and the Engine owns capacity assessment, durable reservation, and the admission decision; the provisioner realizes an already-admitted request and never makes a second, divergent decision. A declaration is intent, not an allocation: engine_capacity_declaration stays append-only, while engine_capacity_assessment is an immutable snapshot pinned to the partition, the catalog policy version, and the time the underlying readings were taken, and engine_capacity_reservation is the durable commitment that makes overlapping events account for one another. Partitions and metrics exist only because a deployment declared them in the capacity catalog (CAPACITY_PLANNING_CATALOG), which is parsed strictly and fails closed at the composition root; a partition is never inferred from an event name, scenario, organizer hint, or mutable global provider setting. Provider limits and usage are read through a read-only CAPACITY_INVENTORY backend capability under shared.cloud, outside any database transaction because provider state cannot be locked, and the transaction that follows re-reads committed overlapping reservations before writing its own. Per-metric freshness limits and safety margins carry the residual race. Enforcement is per metric and defaults to advisory: an over-limit advisory metric emits an operator warning and audit record and provisioning proceeds, while an enforcing metric refuses before dispatch. An unreadable, stale, or unsupported measurement is INDETERMINATE and is never converted to zero usage or to sufficient headroom. Raw quota limits, usage figures, account identifiers, and provider payloads stay inside the adapter and the operator-only assessment record; product surfaces carry bounded reason codes only. Assessment and admission are separate operations: assessment reads providers, decides, and sizes an event capacity budget once per wave, while admission draws one range's share from that budget on every event-scoped creation path using only the database. Welding them together would make each range re-reserve the whole event. Draws are idempotent on a stable pre-creation key (participant or spare identity), are refused before a range is created rather than after, are returned on failed creation and on teardown, and are bounded by database check constraints so a concurrent draw cannot exceed the committed budget. Budgets expire at the end of their window and the reconciler releases their open draws, because a ledger trusted indefinitely diverges from provider reality and a leaked draw refuses an event that would have fit.",
    "rules": [
      {
        "id": "ADR-047-R1",
        "description": "The Engine owns capacity assessment, reservation, and the admission decision. CTF and CMS reach it only through the existing ctf.bridges -> cms.services -> engine.services seam, and the provisioner must not reproduce capacity policy or re-decide an admitted request.",
        "checks": [
          "layer-imports"
        ]
      },
      {
        "id": "ADR-047-R2",
        "description": "Target partitions and metrics come from the deployment-declared capacity catalog and are validated at the composition root. Unknown keys, out-of-range safety margins or costs, non-positive freshness limits, unknown enum values, duplicate names, and metrics targeting an undeclared partition are configuration errors that fail closed; they must never be defaulted, clamped, or partially loaded.",
        "checks": []
      },
      {
        "id": "ADR-047-R3",
        "description": "An unsupported, unavailable, or stale capacity measurement is INDETERMINATE. It must never be recorded or treated as admitted, as zero usage, or as available headroom, and the least-permissive verdict across metrics is the assessment outcome.",
        "checks": []
      },
      {
        "id": "ADR-047-R4",
        "description": "Provider capacity reads happen outside any database transaction and through a read-only capability. Capacity-read identities are least-privilege and per partition; cross-account reads use explicitly enumerated role ARNs with no account wildcard, and the portal, scheduler, worker, and provisioner identities are not widened to inspect headroom.",
        "checks": []
      },
      {
        "id": "ADR-047-R5",
        "description": "Enforcement is per metric and defaults to advisory. A rejected assessment reserves no capacity. Raw quota limits, usage figures, account identifiers, provider responses, and policy blobs must not appear in verdicts, audit free text, logs, task arguments, task environment, notifications, or API error details; product surfaces carry bounded reason codes only.",
        "checks": []
      },
      {
        "id": "ADR-047-R6",
        "description": "Capacity assessment (provider reads, decision, budget sizing) and capacity admission (per-range draw-down) are separate operations. Admission performs no provider I/O, is idempotent on a stable identity known before the range exists, refuses before creation rather than after, and returns its draw on failed creation and on teardown. Consumption is bounded by database constraints rather than a read-then-write check alone, and budgets plus their open draws are released when their window ends.",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": [
      "agent-policy",
      "ci"
    ],
    "evidence": [
