{{- if and .Values.capabilities.kubernetesJobLauncher .Values.capabilities.featureArtifactAcquisition }}
{{- $acquisition := .Values.featureArtifactAcquisition }}
{{- $acquirerAnnotations := deepCopy $acquisition.serviceAccountAnnotations }}
{{- with .Values.identity.serviceAccountRoleArns.artifactAcquirer }}
{{- $_ := set $acquirerAnnotations "eks.amazonaws.com/role-arn" . }}
{{- end }}
# Isolated feature-artifact acquisition Jobs (ADR-034-R12, #2463). The launcher
# creates one Job per claimed attempt; the Job fetches a public upstream package,
# verifies it, and writes only the content-addressed delivery prefix. It holds no
# database access and never shares the platform or provisioner identity.
apiVersion: v1
kind: Namespace
metadata:
  name: shifter-acquisition
  labels:
    app.kubernetes.io/part-of: shifter
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-acquirer
  namespace: shifter-acquisition
  {{- with $acquirerAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acquisition-default-deny
  namespace: shifter-acquisition
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acquisition-dns-egress
  namespace: shifter-acquisition
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# GKE Workload Identity token mint from the node-local metadata server (same as
# the platform and jobs namespaces). Inert on EKS, where IRSA uses a projected token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acquisition-metadata-server-egress
  namespace: shifter-acquisition
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32 # NOSONAR - GKE metadata server (Workload Identity).
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 988
{{- if $acquisition.egressCidrs }}
---
# HTTPS to the upstream registry, the identity provider, and object storage, with
# the cluster's own ranges carved out so the Job cannot reach the Kubernetes API
# or in-cluster services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acquisition-https-egress
  namespace: shifter-acquisition
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range $acquisition.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- with $acquisition.egressExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: acquisition-budget
  namespace: shifter-acquisition
spec:
  hard:
    pods: "4"
    count/jobs.batch: "64"
    count/secrets: "0"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "8"
    limits.memory: 4Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 16Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acquisition-controller
  namespace: shifter-acquisition
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [batch]
    resources: [jobs/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acquisition-controller
  namespace: shifter-acquisition
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.provisionerLauncher.name }}
    namespace: {{ .Values.namespaces.platform }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acquisition-controller
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-feature-artifact-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [jobs]
  matchConditions:
    - name: acquisition-namespace
      expression: "request.namespace == 'shifter-acquisition'"
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: container
      expression: variables.pod.containers[0]
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:{{ .Values.namespaces.platform }}:{{ .Values.serviceAccounts.provisionerLauncher.name }}'"
      message: Only the provisioner launcher may create acquisition jobs.
    - expression: >-
        variables.pod.serviceAccountName == 'artifact-acquirer' &&
        has(variables.pod.automountServiceAccountToken) && !variables.pod.automountServiceAccountToken &&
        variables.pod.containers.size() == 1 &&
        (!has(variables.pod.initContainers) || variables.pod.initContainers.size() == 0) &&
        (!has(variables.pod.ephemeralContainers) || variables.pod.ephemeralContainers.size() == 0) &&
        (!has(variables.pod.imagePullSecrets) || variables.pod.imagePullSecrets.size() == 0)
      message: Acquisition jobs require the dedicated identity and a single container.
    - expression: >-
        variables.container.name == 'feature-artifact-acquisition' &&
        variables.container.image == '{{ .Values.images.platform }}' &&
        variables.container.imagePullPolicy == 'IfNotPresent' &&
        has(variables.container.command) &&
        variables.container.command == ['python', '-m', 'shared.feature_artifacts.job'] &&
        has(variables.container.args) && variables.container.args.size() == 3 &&
        variables.container.args[0].matches('^[a-z0-9][a-z0-9-]{0,63}$') &&
        variables.container.args[1].matches('^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$') &&
        variables.container.args[2].matches('^[a-z0-9][a-z0-9-]{0,63}$') &&
        (!has(variables.container.envFrom) || variables.container.envFrom.size() == 0) &&
        (!has(variables.container.lifecycle)) &&
        variables.container.env.size() <= 7 &&
        variables.container.env.all(e,
          e.name in ['AWS_REGION', 'CLOUD_PROVIDER', 'HOME', 'PYTHONDONTWRITEBYTECODE', 'RAES_CONTENT_DELIVERY_PREFIX', 'STORAGE_BUCKET_NAME', 'TMPDIR'] &&
          has(e.value) && !has(e.valueFrom)) &&
        ['CLOUD_PROVIDER', 'HOME', 'PYTHONDONTWRITEBYTECODE', 'RAES_CONTENT_DELIVERY_PREFIX', 'STORAGE_BUCKET_NAME', 'TMPDIR'].all(n,
          variables.container.env.exists(e, e.name == n))
      message: Acquisition jobs run only the pinned platform image and command with literal, non-secret inputs.
    - expression: >-
        variables.container.securityContext.readOnlyRootFilesystem &&
        variables.container.securityContext.runAsNonRoot &&
        variables.container.securityContext.runAsUser == 1000 &&
        variables.container.securityContext.runAsGroup == 1000 &&
        !variables.container.securityContext.allowPrivilegeEscalation &&
        variables.container.securityContext.capabilities.drop == ['ALL'] &&
        variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        variables.pod.volumes.size() == 1 &&
        variables.pod.volumes[0].name == 'work' &&
        !has(variables.pod.volumes[0].emptyDir.medium) &&
        variables.pod.volumes[0].emptyDir.sizeLimit == '4Gi' &&
        variables.container.volumeMounts.size() == 1 &&
        variables.container.volumeMounts[0].name == 'work' &&
        variables.container.volumeMounts[0].mountPath == '/work'
      message: Acquisition jobs require the restricted filesystem and process profile.
    - expression: >-
        object.spec.backoffLimit == 0 && object.spec.activeDeadlineSeconds == 1800 &&
        object.spec.ttlSecondsAfterFinished == 600 &&
        (!has(object.spec.parallelism) || object.spec.parallelism == 1) &&
        (!has(object.spec.completions) || object.spec.completions == 1) &&
        variables.container.resources.limits['cpu'] == '2' &&
        variables.container.resources.limits['memory'] == '1Gi' &&
        variables.container.resources.limits['ephemeral-storage'] == '4Gi'
      message: Acquisition jobs must fit the acquisition budget.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-feature-artifact-jobs
spec:
  policyName: restrict-feature-artifact-jobs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: shifter-acquisition
{{- end }}
