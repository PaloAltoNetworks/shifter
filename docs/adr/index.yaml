        "id": "ADR-051-R9",
        "description": "Legacy CTFNotification rows remain historical aggregate evidence and must not be expanded into invented recipient success. Draft/scheduled rows and pending SEND_NOTIFICATION tasks cut over atomically or fail migration; old and new writers do not dual-write. Legacy API projection may temporarily adapt the new service under ADR-040, while CTFEmailTemplate remains its existing placeholder-only email-wrapper contract and WebSocketNotification remains transport replay state.",
        "checks": []
