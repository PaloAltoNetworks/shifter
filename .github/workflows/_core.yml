name: Core

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      apply_changes:
        required: true
        type: boolean
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      TF_INFRA_STATE_BUCKET_PROOF:
        required: false
      AWS_ROLE_ARN_PROOF:
        required: false
      TF_VARS_DEV_CORE:
        required: false
      TF_VARS_PROOF_CORE:
        required: false
      TF_VARS_PROD_CORE:
        required: false

jobs:
  plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    name: Plan (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only: bound a hung step so it can't hold the self-hosted runner
    # for GitHub's 6h default (see #1220). Generous vs. real plan times (minutes)
    # so it never trips a legitimate cold plan.
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: platform/terraform/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -check -recursive
        working-directory: platform/terraform
      - name: Render local.auto.tfvars from deployment secret
        working-directory: platform/terraform/environments/${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VARS_DEV_CORE: ${{ secrets.TF_VARS_DEV_CORE }}
          TF_VARS_PROOF_CORE: ${{ secrets.TF_VARS_PROOF_CORE }}
          TF_VARS_PROD_CORE: ${{ secrets.TF_VARS_PROD_CORE }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              CORE_SECRET_NAME="TF_VARS_DEV_CORE"
              TF_VARS_CORE="${TF_VARS_DEV_CORE}"
              ;;
            proof)
              CORE_SECRET_NAME="TF_VARS_PROOF_CORE"
              TF_VARS_CORE="${TF_VARS_PROOF_CORE}"
              ;;
            prod)
              CORE_SECRET_NAME="TF_VARS_PROD_CORE"
              TF_VARS_CORE="${TF_VARS_PROD_CORE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${TF_VARS_CORE}" ]; then
            echo "::error::Required secret ${CORE_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          printf '%s\n' "${TF_VARS_CORE}" > local.auto.tfvars
      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            proof)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_PROOF"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROOF}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${{ inputs.environment }}" \
            --stack core \
            --github-env
      - run: terraform init -backend-config="${SHIFTER_BACKEND_CONFIG_PATH}"
      - run: terraform validate
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan && terraform show -no-color tfplan > plan.txt
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('platform/terraform/environments/${{ inputs.environment }}/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan - Core (${{ inputs.environment }})\n<details><summary>Show Plan</summary>\n\n\`\`\`terraform\n${plan.substring(0, 60000)}\n\`\`\`\n\n</details>`
            });

  apply:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    name: Apply (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220). Generous so a cold apply (RDS multi-AZ,
    # ElastiCache, ECS stabilization) is never cut off.
    timeout-minutes: 120
    environment: ${{ inputs.github_environment }}
    needs: plan
    if: |
      always() &&
      inputs.apply_changes &&
      (needs.plan.result == 'success' || needs.plan.result == 'skipped') &&
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: platform/terraform/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - name: Render local.auto.tfvars from deployment secret
        working-directory: platform/terraform/environments/${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VARS_DEV_CORE: ${{ secrets.TF_VARS_DEV_CORE }}
          TF_VARS_PROOF_CORE: ${{ secrets.TF_VARS_PROOF_CORE }}
          TF_VARS_PROD_CORE: ${{ secrets.TF_VARS_PROD_CORE }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              CORE_SECRET_NAME="TF_VARS_DEV_CORE"
              TF_VARS_CORE="${TF_VARS_DEV_CORE}"
              ;;
            proof)
              CORE_SECRET_NAME="TF_VARS_PROOF_CORE"
              TF_VARS_CORE="${TF_VARS_PROOF_CORE}"
              ;;
            prod)
              CORE_SECRET_NAME="TF_VARS_PROD_CORE"
              TF_VARS_CORE="${TF_VARS_PROD_CORE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${TF_VARS_CORE}" ]; then
            echo "::error::Required secret ${CORE_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          printf '%s\n' "${TF_VARS_CORE}" > local.auto.tfvars
      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            proof)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_PROOF"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROOF}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${{ inputs.environment }}" \
            --stack core \
            --github-env
      - run: terraform init -backend-config="${SHIFTER_BACKEND_CONFIG_PATH}"
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan && terraform show -no-color tfplan
      - run: terraform apply -lock-timeout=5m tfplan
      - run: terraform output -json
