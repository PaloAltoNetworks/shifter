          "layer-imports",
          "cross-layer-model-imports"
        ]
      },
      {
        "id": "ADR-048-R2",
        "description": "Organization read and update authority is resolved only from a persisted OrganizationMembership admin row for that organization, or from the platform-superuser override. It is never derived from a WorkspaceRole, Django is_staff/groups, Django model permissions, identity-provider claims, API-token scopes, cloud roles, or cached client capabilities (ADR-046-R8/R12). The WorkspaceOperation vocabulary and ROLE_OPERATIONS policy are not extended for organization authority.",
        "checks": []
