name: Range

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      apply_changes:
        required: true
        type: boolean
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false
      # Whole-file local.auto.tfvars payload per environment. The committed
      # terraform.tfvars is an example baseline; real per-deployment range
      # values are rendered from these secrets before plan/apply. Declared
      # required: false because GitHub evaluates reusable-workflow secrets at
      # dispatch time; the render step fails loud for the active environment.
      TF_VARS_DEV_RANGE:
        required: false
      TF_VARS_PROOF_RANGE:
        required: false
      TF_VARS_PROD_RANGE:
        required: false
      # Per-environment deployment shifter.yaml (full root installation config).
      # The range egress allowlist (victim_allowed_cidrs) is rendered from this
      # config's settings.range_egress, so it is the single source for the
      # deployed firewall and must NOT also be carried in TF_VARS_*_RANGE.
      # Declared required: false for the same dispatch-time reason as TF_VARS_*;
      # the render step fails loud for the active environment.
      SHIFTER_CONFIG_DEV_RANGE:
        required: false
      SHIFTER_CONFIG_PROOF_RANGE:
        required: false
      SHIFTER_CONFIG_PROD_RANGE:
        required: false
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      TF_INFRA_STATE_BUCKET_PROOF:
        required: false

jobs:
  plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    name: Plan (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only: bound a hung step so it can't hold the self-hosted runner
    # for GitHub's 6h default (see #1220). Generous vs. real plan times.
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: platform/terraform/environments/${{ inputs.environment }}/range
    steps:
      - uses: actions/checkout@v6
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: terraform fmt -check -recursive
        working-directory: platform/terraform
      - name: Render local.auto.tfvars from deployment secret
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VARS_DEV_RANGE: ${{ secrets.TF_VARS_DEV_RANGE }}
          TF_VARS_PROOF_RANGE: ${{ secrets.TF_VARS_PROOF_RANGE }}
          TF_VARS_PROD_RANGE: ${{ secrets.TF_VARS_PROD_RANGE }}
        run: |
          # Select strictly on inputs.environment in shell. Do not use an
          # `is_dev && DEV_SECRET || PROD_SECRET` expression here: an empty
          # active-environment secret is falsy and can fall through to the
          # other environment's secret instead of failing loud.
          case "$ENVIRONMENT" in
            dev)
              RANGE_SECRET_NAME="TF_VARS_DEV_RANGE"
              TF_VARS_RANGE="${TF_VARS_DEV_RANGE}"
              ;;
            proof)
              RANGE_SECRET_NAME="TF_VARS_PROOF_RANGE"
              TF_VARS_RANGE="${TF_VARS_PROOF_RANGE}"
              ;;
            prod)
              RANGE_SECRET_NAME="TF_VARS_PROD_RANGE"
              TF_VARS_RANGE="${TF_VARS_PROD_RANGE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${TF_VARS_RANGE}" ]; then
            echo "::error::Required secret ${RANGE_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          printf '%s\n' "${TF_VARS_RANGE}" > local.auto.tfvars
      - name: Render range egress allowlist from shifter.yaml
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
          SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
          SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
        run: |
          # Select strictly on inputs.environment in shell (same rule as the
          # local.auto.tfvars step): an empty active-environment config must
          # fail loud, never fall through to the other environment's secret.
          case "$ENVIRONMENT" in
            dev)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_DEV_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_DEV_RANGE}"
              ;;
            proof)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROOF_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROOF_RANGE}"
              ;;
            prod)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROD_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROD_RANGE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${ACTIVE_SHIFTER_CONFIG}" ]; then
            echo "::error::Required secret ${CONFIG_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          # Write the deployment config to an ephemeral file outside the repo tree,
          # then render its settings.range_egress into the AWS bridge tfvars
          # (victim_allowed_cidrs) so the deployed allowlist comes from shifter.yaml,
          # not a second secret. shifter.yaml holds secret *references*, not values,
          # but is still treated as sensitive: written by redirection, never echoed,
          # passed in argv, or uploaded as an artifact (#1015).
          CONFIG_FILE="${RUNNER_TEMP}/shifter.yaml"
          printf '%s\n' "${ACTIVE_SHIFTER_CONFIG}" > "${CONFIG_FILE}"
          uv run --project "${GITHUB_WORKSPACE}/shifter/installation" \
            shifter-config render "${CONFIG_FILE}" \
            --output victim_allowed_cidrs.auto.tfvars
      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            proof)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_PROOF"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROOF}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${{ inputs.environment }}" \
            --stack range \
            --github-env
      - run: terraform init -backend-config="${SHIFTER_BACKEND_CONFIG_PATH}"
      - run: terraform validate
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan && terraform show -no-color tfplan > plan.txt
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('platform/terraform/environments/${{ inputs.environment }}/range/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan - Range (${{ inputs.environment }})\n<details><summary>Show Plan</summary>\n\n\`\`\`terraform\n${plan.substring(0, 60000)}\n\`\`\`\n\n</details>`
            });

  apply:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    name: Apply (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220). Generous so a cold apply is never cut off.
    timeout-minutes: 120
    environment: ${{ inputs.github_environment }}
    needs: plan
    if: |
      always() &&
      inputs.apply_changes &&
      (needs.plan.result == 'success' || needs.plan.result == 'skipped') &&
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: platform/terraform/environments/${{ inputs.environment }}/range
    steps:
      - uses: actions/checkout@v6
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Render local.auto.tfvars from deployment secret
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VARS_DEV_RANGE: ${{ secrets.TF_VARS_DEV_RANGE }}
          TF_VARS_PROOF_RANGE: ${{ secrets.TF_VARS_PROOF_RANGE }}
          TF_VARS_PROD_RANGE: ${{ secrets.TF_VARS_PROD_RANGE }}
        run: |
          # Keep the apply job's rendering logic identical to plan so the
          # applied values cannot diverge from the reviewed plan inputs.
          case "$ENVIRONMENT" in
            dev)
              RANGE_SECRET_NAME="TF_VARS_DEV_RANGE"
              TF_VARS_RANGE="${TF_VARS_DEV_RANGE}"
              ;;
            proof)
              RANGE_SECRET_NAME="TF_VARS_PROOF_RANGE"
              TF_VARS_RANGE="${TF_VARS_PROOF_RANGE}"
              ;;
            prod)
              RANGE_SECRET_NAME="TF_VARS_PROD_RANGE"
              TF_VARS_RANGE="${TF_VARS_PROD_RANGE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${TF_VARS_RANGE}" ]; then
            echo "::error::Required secret ${RANGE_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          printf '%s\n' "${TF_VARS_RANGE}" > local.auto.tfvars
      - name: Render range egress allowlist from shifter.yaml
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
          SHIFTER_CONFIG_PROOF_RANGE: ${{ secrets.SHIFTER_CONFIG_PROOF_RANGE }}
          SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
        run: |
          # Select strictly on inputs.environment in shell (same rule as the
          # local.auto.tfvars step): an empty active-environment config must
          # fail loud, never fall through to the other environment's secret.
          case "$ENVIRONMENT" in
            dev)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_DEV_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_DEV_RANGE}"
              ;;
            proof)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROOF_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROOF_RANGE}"
              ;;
            prod)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROD_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROD_RANGE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${ACTIVE_SHIFTER_CONFIG}" ]; then
            echo "::error::Required secret ${CONFIG_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          # Write the deployment config to an ephemeral file outside the repo tree,
          # then render its settings.range_egress into the AWS bridge tfvars
          # (victim_allowed_cidrs) so the deployed allowlist comes from shifter.yaml,
          # not a second secret. shifter.yaml holds secret *references*, not values,
          # but is still treated as sensitive: written by redirection, never echoed,
          # passed in argv, or uploaded as an artifact (#1015).
          CONFIG_FILE="${RUNNER_TEMP}/shifter.yaml"
          printf '%s\n' "${ACTIVE_SHIFTER_CONFIG}" > "${CONFIG_FILE}"
          uv run --project "${GITHUB_WORKSPACE}/shifter/installation" \
            shifter-config render "${CONFIG_FILE}" \
            --output victim_allowed_cidrs.auto.tfvars
      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROOF: ${{ secrets.TF_INFRA_STATE_BUCKET_PROOF }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            proof)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_PROOF"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROOF}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${{ inputs.environment }}" \
            --stack range \
            --github-env
      - run: terraform init -backend-config="${SHIFTER_BACKEND_CONFIG_PATH}"
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan && terraform show -no-color tfplan
      - run: terraform apply -lock-timeout=5m tfplan
      - run: terraform output -json
