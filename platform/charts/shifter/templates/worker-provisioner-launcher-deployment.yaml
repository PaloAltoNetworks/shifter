{{- if .Values.capabilities.kubernetesJobLauncher }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-provisioner-launcher
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker-provisioner-launcher
spec:
  replicas: {{ .Values.workers.provisionerLauncher.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: worker-provisioner-launcher
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-provisioner-launcher
      annotations:
        checksum/runtime-config: {{ include "shifter.runtimeConfigChecksum" . }}
    spec:
      {{- include "shifter.podSecurityContext" . | nindent 6 }}
      automountServiceAccountToken: true
      serviceAccountName: {{ .Values.serviceAccounts.provisionerLauncher.name }}
      containers:
        - name: worker-provisioner-launcher
          image: {{ include "shifter.portalImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "shifter.containerSecurityContextApp" . | nindent 10 }}
          {{- include "shifter.tmpVolumeMount" . | nindent 10 }}
          args: ["python", "manage.py", "drain_provisioner_launch_outbox", "--loop", "--interval", "10"]
          envFrom:
            - configMapRef:
                name: platform-runtime
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/worker-provisioner-launcher-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.workers.provisionerLauncher.resources | nindent 12 }}
      {{- include "shifter.tmpVolume" . | nindent 6 }}
{{- end }}
