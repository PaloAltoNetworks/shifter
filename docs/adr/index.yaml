      {
        "id": "ADR-008-R7",
        "description": "GCP application workload identities (portal, workers, CTF scheduler, and provisioner) must not receive project-level Secret Manager payload/admin, Cloud Storage object-admin, or service-account IAM-admin (`iam.serviceAccounts.create`/`delete`/`setIamPolicy`) roles, whether predefined or via an equivalent project-level custom role. Static runtime access is bound on each named secret or bucket from the resource-owning module's outputs (portal/secrets `runtime_secret_ids`, portal/gcs `assets_bucket_name`), driven by a single canonical workload/resource matrix in `platform/terraform/gcp/modules/portal/iam/main.tf`. Dynamic provisioner-created secret lifecycle is isolated in one dedicated range-secret project per Shifter deployment, never a project per range/workspace/user and never a project shared by unrelated deployments; a creation broker is not selected. The dedicated project contains only ephemeral dynamic secrets. The provisioner receives an unconditioned create-only custom role on that parent because Google authorizes `secretmanager.secrets.create` before the new resource exists. That grant can create an arbitrary empty Secret resource inside the dedicated project and is bounded by deployment isolation, monitoring, quota, and bootstrap/operator cleanup; it must not permit creation in the platform or any unrelated project. Every existing-secret lifecycle permission is limited by the closed Secret Manager-only role and the fully qualified canonical `shifter-{environment}-dynamic-` resource prefix. Secret and SecretVersion calls use the same name boundary without a resource.type predicate; live GKE qualification for #1583 rejected the additional type predicate despite correct audit resource attributes. Participant suffix checks extract the secret ID from the version resource name before matching, including numbered and latest versions. The portal's read-only permission is narrower: it is conditioned on a finite, centrally classified set of canonical participant-access name classes, excludes Vertex keys, VPN issuer/server and non-published bootstrap/directory material, and does not admit future families by default; the migration-only legacy condition composes each known legacy prefix with only its published credential shapes, explicitly excludes the `shifter-range-{range}-raes-domain-...` namespace through supported `resource.name.extract(...)` classification, never uses a broad suffix list, and must remain at or below Google IAM's hard limit of 12 logical operators per binding. Participant-controlled range hosts retain only per-secret access. Static runtime/operator secrets remain in their owning project with named bindings. The single `dynamic_secret_project_id` operator/Terraform/runtime seam may be explicitly set equal to the platform project only during migration, omission fails closed, and the value must become distinct after legacy drain; canonical naming also requires a non-empty lowercase single-hyphen `ENVIRONMENT` namespace and has no implicit `dev` fallback. Platform, Vertex API, shared-key source, compute-host, and dynamic-secret project IDs must not be conflated. Read-before-create reconciliation probes every exact legacy/canonical container after a missing latest version and waits boundedly on an existing empty container, so migration cannot mint a competing canonical credential. Repo-native Terraform guards parse and enforce the exact IAM-condition local inputs and compositions; static effective-permission tests and live API probes under the real workload identities must cover direct, binding/policy, local-map, IAM-condition, cross-project, equivalent custom-role, positive, and negative shapes; parent-scoped create inside the dedicated project must not be misreported as prefix-restricted. The check is implemented in `scripts/check_tf_gcp_iam_resource_scope/check_tf_gcp_iam_resource_scope.py` and wired as the `check-tf-gcp-iam-resource-scope` pre-commit hook plus a CI step in `.github/workflows/_quality.yml`, with its unittest + effective-permission oracle suite included in the `check_tf_*` checker tests. The implementation removes the former portal `roles/secretmanager.secretAccessor` and provisioner `roles/secretmanager.admin` platform-project residuals; the guard admits only the named migration and dedicated-project bindings and has no permanent residual exemption. The provisioner's former project-level `iam.serviceAccounts.setIamPolicy` custom role (used to self-grant `serviceAccountUser` on dynamically created OpenVPN gateway service accounts, which GCP cannot resource-name-scope for setIamPolicy) is replaced by a pre-provisioned single-project gateway SA pool: Terraform pre-creates `sh-vpn-pool-<slot>` no-role service accounts and grants the provisioner `serviceAccountUser` on each specific member, and each active OpenVPN range reserves a slot via `Range.allocate_vpn_gateway_slot` bounded by `VPN_GATEWAY_POOL_SIZE` (must equal the Terraform `vpn_gateway_pool_size`). Preconfigured GCE range hosts use the same bounded-identity rule through a separate no-role `sh-range-host-<slot>` pool selected by the range's existing allocation index; Terraform grants the provisioner `serviceAccountUser` only on each specific member, and `GCP_RANGE_HOST_IDENTITY_POOL_SIZE` must match the Terraform `range_host_identity_pool_size`. This removes all runtime service-account administration from the provisioner with no cross-project or org-policy dependency (single isolated tenant), so the guard also fails a project-level service-account IAM-admin custom role attached to a workload identity. Recorded by the architecture preflights for #1517, #1586, #1896, and #2083.",
        "checks": []
      },
      {
        "id": "ADR-008-R8",
        "description": "The GCP-native self-hosted GitHub Actions runner (issue #1546) must live in a dedicated, custom-mode VPC (never the project default network) with the instance private-only (no external IP), SSH ingress admitted only from Google's IAP relay range (35.235.240.0/20) and targeted at the runner service account, and Cloud NAT for egress. This mirrors the AWS ADR-004-R20 default-VPC guard for GCP so the runner cannot be silently placed on a shared or default network. The runner-specific network invariants (dedicated custom VPC + IAP-scoped SSH, which Checkov does not assert) are enforced by `scripts/check_tf_gcp_runner_network/check_tf_gcp_runner_network.py`, wired as the `check-tf-gcp-runner-network` pre-commit hook plus a CI step in `.github/workflows/_quality.yml`, with its unittest included in the `check_tf_*` checker tests; the external-IP and world-open-SSH invariants are covered generically by Checkov. Recorded by the architecture preflight for #1546.",
