portal:
  replicas: 2

workers:
  cms:
    replicas: 2
  engine:
    replicas: 2
  mc:
    replicas: 2
  ctfScheduler:
    replicas: 1

guacd:
  replicas: 2

# Single guacamole-client replica: tokens are minted and served from task-local
# process memory, so N>1 replicas break first-click RDP (#928). Scale guacd for
# capacity, not the client.
guacamoleClient:
  replicas: 1

ingress:
  enabled: true
