name: Platform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      apply_changes:
        required: true
        type: boolean
      # Split per concern (#913). `apply_changes` is deployment
      # permission (environment branch / manual dispatch); these two
      # say which paths actually changed. Terraform plan/apply and the
      # Guacamole image publish run only for platform_changes;
      # the portal image build/deploy runs for either signal.
      platform_changes:
        description: Terraform/platform-infrastructure inputs changed (or manual dispatch)
        required: true
        type: boolean
      portal_image_changes:
        description: Portal image source changed (or manual dispatch)
        required: true
        type: boolean
      engine_image_digest:
        description: Engine provisioner image digest from the upstream build job
        required: false
        type: string
        default: ""
      eks_enabled:
        description: Explicitly enable the EKS lifecycle after migration prerequisites are ready
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      PLATFORM_BOOTSTRAP_STAFF_EMAILS:
        required: false
      PLATFORM_BOOTSTRAP_SUPERUSER_EMAILS:
        required: false
      # Whole-file local.auto.tfvars payload per environment. The committed
      # terraform.tfvars is an example.com baseline; the real per-deployment
      # values are rendered from these secrets before plan/apply. Declared
      # required: false — the render step fails loud when the active
      # environment's secret is empty. See docs/dev/deploy-secrets.md.
      TF_VARS_DEV_PORTAL:
        required: false
      TF_VARS_PROD_PORTAL:
        required: false
      TF_INFRA_STATE_BUCKET:
        required: false
      TF_INFRA_STATE_BUCKET_DEV:
        required: false
      # Protected JSON inputs for the isolated EKS root. These include
      # provider-derived runtime references but never secret payloads.
      TF_VARS_DEV_EKS:
        required: false
      TF_VARS_PROD_EKS:
        required: false
      # Per-environment deployment shifter.yaml (full root installation config).
      # The renderer-owned CLOUD_PROVIDER binding (PLAT-2005) is rendered from
      # this config's settings.backend, so it is the single source for the
      # deployed backend identity and must NOT also be carried in
      # TF_VARS_*_PORTAL. Declared required: false for the same dispatch-time
      # reason as TF_VARS_*; the render step fails loud for the active
      # environment. Reuses the same secrets _range.yml already declares.
      SHIFTER_CONFIG_DEV_RANGE:
        required: false
      SHIFTER_CONFIG_PROD_RANGE:
        required: false
      SMOKE_TEST_USER_EMAIL:
        required: false

jobs:
  push-guacamole-images:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      attestations: write
    name: Push Guacamole Images (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220); generous vs. real image-push times.
    timeout-minutes: 60
    environment: ${{ inputs.github_environment }}
    if: |
      inputs.apply_changes &&
      inputs.platform_changes &&
      github.event_name != 'pull_request'
    env:
      GUACD_REPO: ${{ inputs.environment == 'prod' && 'shifter-guacd' || format('shifter-{0}-guacd', inputs.environment) }}
      GUACAMOLE_CLIENT_REPO: ${{ inputs.environment == 'prod' && 'shifter-guacamole-client' || format('shifter-{0}-guacamole-client', inputs.environment) }}
      # Upstream Apache Guacamole version (documentation / build-arg).
      GUACAMOLE_VERSION: "1.5.5"
      # ECR image tag for both guac images. Bump the -rN provenance-rebuild suffix
      # HERE and in every environment's terraform.tfvars (guacd_image_tag /
      # guacamole_client_image_tag) together whenever the guac build context
      # changes: immutable ECR then receives a fresh, attested push (ADR-037-R5),
      # and the guac module resolves this tag to its @sha256 digest for a verified
      # deploy (ADR-037-R6). A guac-only change reaches this job through the
      # terraform.tfvars edit, which is inside the shifter_platform change filter.
      GUAC_IMAGE_TAG: "1.5.5-r1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
          role-duration-seconds: 21600
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Check guacd image tag
        id: guacd-image
        run: |
          if aws ecr describe-images --repository-name "$GUACD_REPO" --image-ids imageTag="$GUAC_IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push guacd image (with RDP file transfer support)
        id: build-guacd
        if: steps.guacd-image.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter/engine/guacd
          push: true
          build-args: |
            GUACAMOLE_VERSION=${{ env.GUACAMOLE_VERSION }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.GUACD_REPO }}:${{ env.GUAC_IMAGE_TAG }}
          no-cache: true
          # Build provenance (ADR-037-R5) for freshly built guacd images. Guac
          # images are version-pinned upstream bases on immutable ECR tags, so a
          # cached image is not re-pushed or re-attested here.
          provenance: mode=max
          sbom: true
      - name: Attest guacd build provenance
        if: steps.guacd-image.outputs.exists != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ env.GUACD_REPO }}
          subject-digest: ${{ steps.build-guacd.outputs.digest }}
          push-to-registry: false
      - name: Check guacamole-client image tag
        id: guacamole-client-image
        run: |
          if aws ecr describe-images --repository-name "$GUACAMOLE_CLIENT_REPO" --image-ids imageTag="$GUAC_IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push guacamole-client image (with OIDC extension)
        id: build-guacamole-client
        if: steps.guacamole-client-image.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter/engine/guacamole
          push: true
          build-args: |
            GUACAMOLE_VERSION=${{ env.GUACAMOLE_VERSION }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.GUACAMOLE_CLIENT_REPO }}:${{ env.GUAC_IMAGE_TAG }}
          no-cache: true
          # Build provenance (ADR-037-R5) for freshly built guacamole-client
          # images. See the guacd note above re: cached immutable-tag images.
          provenance: mode=max
          sbom: true
      - name: Attest guacamole-client build provenance
        if: steps.guacamole-client-image.outputs.exists != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ env.GUACAMOLE_CLIENT_REPO }}
          subject-digest: ${{ steps.build-guacamole-client.outputs.digest }}
          push-to-registry: false
      - name: Verify guac image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # ADR-037-R6: verify the OIDC-signed attestation for each guac
          # image@digest (resolved from its pinned GUAC_IMAGE_TAG) before the
          # apply job (which needs this one) deploys that same digest via the guac
          # module's data.aws_ecr_image lookup. Covers both freshly built and
          # cached-but-already-attested images. No bypass.
          set -euo pipefail
          verify() {
            repo="$1"; tag="$2"; label="$3"
            digest=$(aws ecr describe-images --repository-name "$repo" \
              --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::could not resolve a valid digest for ${label} (${repo}:${tag})"
              exit 1
            fi
            echo "Verifying provenance for ${label} (${repo}@${digest})"
            gh attestation verify "oci://${REGISTRY}/${repo}@${digest}" --repo Brad-Edwards/shifter
          }
          verify "$GUACD_REPO" "$GUAC_IMAGE_TAG" "guacd"
          verify "$GUACAMOLE_CLIENT_REPO" "$GUAC_IMAGE_TAG" "guacamole-client"

  apply:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    name: Apply (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220). Generous so a cold apply is never cut off.
    timeout-minutes: 120
    environment: ${{ inputs.github_environment }}
    needs: [push-guacamole-images]
    if: |
      always() &&
      inputs.apply_changes &&
      inputs.platform_changes &&
      (needs.push-guacamole-images.result == 'success' || needs.push-guacamole-images.result == 'skipped') &&
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: platform/terraform/environments/${{ inputs.environment }}/portal
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
          role-duration-seconds: 21600
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.13.3"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Render local.auto.tfvars from deployment secret
        # The committed terraform.tfvars ships an example.com baseline that
        # fails-loud on apply. Each deployment provides its real values via the
        # TF_VARS_<ENV>_PORTAL GitHub secret; this step renders that payload
        # into a gitignored local.auto.tfvars that Terraform auto-loads over
        # the baseline before plan and apply. See docs/dev/deploy-secrets.md.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VARS_DEV_PORTAL: ${{ secrets.TF_VARS_DEV_PORTAL }}
          TF_VARS_PROD_PORTAL: ${{ secrets.TF_VARS_PROD_PORTAL }}
        run: |
          # Select strictly on inputs.environment in shell. A GitHub Actions
          # `is_dev && DEV_SECRET || PROD_SECRET` expression is unsafe: an
          # empty active-environment secret is falsy and falls through to
          # the other environment's secret. Selecting in shell keeps an
          # empty active secret empty so the check below trips fail-loud.
          case "$ENVIRONMENT" in
            dev)
              PORTAL_SECRET_NAME="TF_VARS_DEV_PORTAL"
              TF_VARS_PORTAL="${TF_VARS_DEV_PORTAL}"
              ;;
            prod)
              PORTAL_SECRET_NAME="TF_VARS_PROD_PORTAL"
              TF_VARS_PORTAL="${TF_VARS_PROD_PORTAL}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${TF_VARS_PORTAL}" ]; then
            echo "::error::Required secret ${PORTAL_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          printf '%s\n' "${TF_VARS_PORTAL}" > local.auto.tfvars
      - name: Render cloud_provider.auto.tfvars from shifter.yaml
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
          SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
        run: |
          # Select strictly on inputs.environment in shell (same rule as the
          # local.auto.tfvars step above): an empty active-environment config
          # must fail loud, never fall through to the other environment's secret.
          case "$ENVIRONMENT" in
            dev)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_DEV_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_DEV_RANGE}"
              ;;
            prod)
              CONFIG_SECRET_NAME="SHIFTER_CONFIG_PROD_RANGE"
              ACTIVE_SHIFTER_CONFIG="${SHIFTER_CONFIG_PROD_RANGE}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${ACTIVE_SHIFTER_CONFIG}" ]; then
            echo "::error::Required secret ${CONFIG_SECRET_NAME} is not set. See docs/dev/deploy-secrets.md."
            exit 1
          fi
          # Write the deployment config to an ephemeral file outside the repo tree,
          # then render its settings.backend into the renderer-owned CLOUD_PROVIDER
          # tfvars (PLAT-2005), so the deployed backend identity comes from
          # shifter.yaml, not a hardcoded Terraform literal. shifter.yaml holds
          # secret *references*, not values, but is still treated as sensitive:
          # written by redirection, never echoed, passed in argv, or uploaded as
          # an artifact (#1015).
          CONFIG_FILE="${RUNNER_TEMP}/shifter.yaml"
          printf '%s\n' "${ACTIVE_SHIFTER_CONFIG}" > "${CONFIG_FILE}"
          uv run --project "${GITHUB_WORKSPACE}/shifter/installation" \
            shifter-config render-runtime "${CONFIG_FILE}" \
            --output cloud_provider.auto.tfvars
      - name: Render Terraform backend configs
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET_DEV"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_DEV}"
              ;;
            prod)
              BUCKET_SECRET_NAME="TF_INFRA_STATE_BUCKET"
              STATE_BUCKET="${TF_INFRA_STATE_BUCKET_PROD}"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Required secret ${BUCKET_SECRET_NAME} is not set for the ${ENVIRONMENT} Terraform backend"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${STATE_BUCKET}" \
            --env "${{ inputs.environment }}" \
            --stack portal \
            --github-env
      - run: terraform init -backend-config="${SHIFTER_BACKEND_CONFIG_PATH}"
      - name: Plan
        run: |
          terraform plan -detailed-exitcode -lock-timeout=5m -var-file="${SHIFTER_PORTAL_REMOTE_STATE_TFVARS}" -out=tfplan 2>&1 || PLAN_EXIT=$?
          if [ "${PLAN_EXIT:-0}" != "0" ] && [ "${PLAN_EXIT:-0}" != "2" ]; then
            echo "::error::Terraform plan failed with exit code ${PLAN_EXIT}"
            exit "${PLAN_EXIT}"
          fi
          if [ ! -f tfplan ]; then
            echo "::error::Terraform did not create the expected saved plan tfplan"
            exit 1
          fi
          terraform show -no-color tfplan
      - run: terraform apply -lock-timeout=5m tfplan
      - name: Assert portal inspection route/endpoint wiring
        # When portal east-west inspection is enabled, the direct private->NAT
        # default route is removed, so a stale / wrong-AZ / unhealthy firewall
        # endpoint silently blackholes egress while `terraform apply` still
        # succeeds. This post-apply check proves the live route tables point at
        # the healthy per-AZ Network Firewall endpoints from
        # firewall_status.sync_states and fails the deploy otherwise. It is a
        # no-op when inspection is disabled, so it runs for every environment.
        # See scripts/assert_portal_inspection/assert_portal_inspection.py.
        working-directory: platform/terraform/environments/${{ inputs.environment }}/portal
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/assert_portal_inspection/assert_portal_inspection.py" \
            --tf-outputs-from .
      - name: Verify RDS pending modifications applied (dev only)
        # Dev opts into apply_immediately=true so any post-apply
        # PendingModifiedValues means the deploy is incomplete. Prod
        # deliberately keeps apply_immediately=false so RDS changes flow
        # through the configured maintenance window — running the check
        # there would fail every legitimate prod deploy.
        # See scripts/check_rds_pending_modifications/check_rds_pending_modifications.py
        # and dev/terraform.md "RDS Change Application".
        if: inputs.is_dev
        working-directory: platform/terraform/environments/${{ inputs.environment }}/portal
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/check_rds_pending_modifications/check_rds_pending_modifications.py" \
            --tf-outputs-from .

  build:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      attestations: write
    name: Build (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220); generous vs. real image-build times.
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    needs: push-guacamole-images
    # EKS Terraform is applied by the explicit lifecycle after all image
    # identities are available. The build must not depend on or mutate the
    # retained legacy ECS/ASG portal root.
    if: |
      always() &&
      inputs.apply_changes &&
      github.event_name != 'pull_request' &&
      (inputs.platform_changes || inputs.portal_image_changes) &&
      (needs.push-guacamole-images.result == 'success' ||
       needs.push-guacamole-images.result == 'skipped')
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      ECR_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-portal' || format('shifter-{0}-portal', inputs.environment) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
          role-duration-seconds: 21600
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - name: Set image tag
        id: image
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "tag=${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter
          file: ./shifter/shifter_platform/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
          no-cache: true
          # Build provenance (ADR-037-R5): embed an SBOM and max provenance,
          # then attest below with a GitHub OIDC-signed statement.
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  eks-deploy:
    permissions:
      id-token: write
      contents: read
      attestations: read
    name: Deploy EKS bundle (${{ inputs.environment }})
    runs-on: self-hosted
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    needs: build
    if: |
      inputs.apply_changes &&
      inputs.eks_enabled &&
      github.event_name != 'pull_request' &&
      needs.build.result == 'success'
    env:
      AWS_REGION: us-east-2
      ENVIRONMENT: ${{ inputs.environment }}
      PORTAL_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
      ENGINE_IMAGE_DIGEST: ${{ inputs.engine_image_digest }}
      SHIFTER_CONFIG_DEV: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
      SHIFTER_CONFIG_PROD: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.34.1
      - name: Install Helm for the canonical EKS bundle (hermetic, version-pinned, checksum-verified)
        env:
          HELM_VERSION: v3.15.4
          # Reviewed, digest-pinned SHA-256 of helm-v3.15.4-linux-amd64.tar.gz.
          # Pinned in reviewed repo content rather than fetched from get.helm.sh
          # (the same mutable origin as the binary), so a compromised release
          # bucket/CDN/publishing credential cannot supply a matching checksum
          # for a tampered tarball. Bump both fields together on a Helm upgrade.
          HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          curl -fsSL -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          mv "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm-bin/helm"
          echo "${RUNNER_TEMP}/helm-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm-bin/helm" version --short

      - name: Preflight EKS deployment prerequisites
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          TF_INFRA_STATE_BUCKET: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_VARS_DEV_EKS: ${{ secrets.TF_VARS_DEV_EKS }}
          TF_VARS_PROD_EKS: ${{ secrets.TF_VARS_PROD_EKS }}
          SHIFTER_CONFIG_DEV_RANGE: ${{ secrets.SHIFTER_CONFIG_DEV_RANGE }}
          SHIFTER_CONFIG_PROD_RANGE: ${{ secrets.SHIFTER_CONFIG_PROD_RANGE }}
        working-directory: scripts/bootstrap
        run: uv run python -m preflight --cloud aws --env "$ENVIRONMENT" --component eks --headless

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev) ROLE_ARN="$AWS_ROLE_ARN_DEV" ;;
            prod) ROLE_ARN="$AWS_ROLE_ARN_PROD" ;;
            *) echo "::error::Unsupported AWS environment: $ENVIRONMENT"; exit 1 ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::The protected AWS deploy role is not configured"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
          role-duration-seconds: 21600

      - name: Render isolated EKS backend and protected inputs
        env:
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
          TF_INFRA_STATE_BUCKET_PROD: ${{ secrets.TF_INFRA_STATE_BUCKET }}
          TF_VARS_DEV_EKS: ${{ secrets.TF_VARS_DEV_EKS }}
          TF_VARS_PROD_EKS: ${{ secrets.TF_VARS_PROD_EKS }}
          DEPLOYMENT_ROLE_ARN: ${{ steps.aws-role.outputs.role_arn }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)
              STATE_BUCKET="$TF_INFRA_STATE_BUCKET_DEV"
              EKS_INPUTS="$TF_VARS_DEV_EKS"
              ;;
            prod)
              STATE_BUCKET="$TF_INFRA_STATE_BUCKET_PROD"
              EKS_INPUTS="$TF_VARS_PROD_EKS"
              ;;
          esac
          if [ -z "$STATE_BUCKET" ] || [ -z "$EKS_INPUTS" ]; then
            echo "::error::The protected EKS state bucket or Terraform input payload is not configured"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "$STATE_BUCKET" \
            --env "$ENVIRONMENT" \
            --stack eks \
            --github-env
          install -m 600 /dev/null "${RUNNER_TEMP}/eks.tfvars.json"
          printf '%s' "$EKS_INPUTS" |
            jq --arg role "$DEPLOYMENT_ROLE_ARN" '.deployment_role_arn = $role' \
              > "${RUNNER_TEMP}/eks.tfvars.json"
          jq -e 'type == "object"' "${RUNNER_TEMP}/eks.tfvars.json" >/dev/null
          echo "SHIFTER_EKS_TFVARS_PATH=${RUNNER_TEMP}/eks.tfvars.json" >> "$GITHUB_ENV"

      - name: Render protected root config and attested image identities
        env:
          GUACD_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-guacd' || format('shifter-{0}-guacd', inputs.environment) }}
          GUACAMOLE_CLIENT_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-guacamole-client' || format('shifter-{0}-guacamole-client', inputs.environment) }}
          PORTAL_REPOSITORY: ${{ inputs.environment == 'prod' && 'shifter-portal' || format('shifter-{0}-portal', inputs.environment) }}
          PROVISIONER_REPOSITORY: shifter-${{ inputs.environment }}-pulumi-provisioner
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev) ROOT_CONFIG="$SHIFTER_CONFIG_DEV" ;;
            prod) ROOT_CONFIG="$SHIFTER_CONFIG_PROD" ;;
          esac
          if [ -z "$ROOT_CONFIG" ]; then
            echo "::error::The protected shifter.yaml payload is not configured"
            exit 1
          fi
          install -m 600 /dev/null "${RUNNER_TEMP}/shifter.yaml"
          printf '%s' "$ROOT_CONFIG" > "${RUNNER_TEMP}/shifter.yaml"

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ ! "$ENGINE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The EKS deployment requires the upstream engine provisioner digest"
            exit 1
          fi
          guacd_digest="$(aws ecr describe-images --repository-name "$GUACD_REPOSITORY" \
            --image-ids imageTag=1.5.5-r1 --query 'imageDetails[0].imageDigest' --output text)"
          client_digest="$(aws ecr describe-images --repository-name "$GUACAMOLE_CLIENT_REPOSITORY" \
            --image-ids imageTag=1.5.5-r1 --query 'imageDetails[0].imageDigest' --output text)"
          jq -n \
            --arg platform "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PORTAL_REPOSITORY}@${PORTAL_IMAGE_DIGEST}" \
            --arg guacd "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${GUACD_REPOSITORY}@${guacd_digest}" \
            --arg client "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${GUACAMOLE_CLIENT_REPOSITORY}@${client_digest}" \
            --arg provisioner "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROVISIONER_REPOSITORY}@${ENGINE_IMAGE_DIGEST}" \
            '{platform:$platform,guacd:$guacd,guacamoleClient:$client,provisioner:$provisioner}' \
            > "${RUNNER_TEMP}/images.json"

      - name: Deploy through the canonical AWS bundle entrypoint
        run: |
          uv run --project scripts/bootstrap \
            python scripts/bootstrap/deploy.py eks-deploy \
            --config "${RUNNER_TEMP}/shifter.yaml" \
            --images "${RUNNER_TEMP}/images.json" \
            --backend-config "${SHIFTER_BACKEND_CONFIG_PATH}" \
            --terraform-inputs "${SHIFTER_EKS_TFVARS_PATH}"

  post-deploy-smoke:
    permissions:
      id-token: write
      contents: read
      issues: write
    name: Post-deploy smoke (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220).
    timeout-minutes: 60
    environment: ${{ inputs.github_environment }}
    needs: eks-deploy
    if: |
      inputs.is_dev &&
      inputs.apply_changes &&
      github.event_name != 'pull_request' &&
      needs.eks-deploy.result == 'success'
    continue-on-error: true
    env:
      AWS_REGION: us-east-2
      ENV: ${{ inputs.environment }}
      SMOKE_TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
        run: |
          if [ -z "${AWS_ROLE_ARN_DEV}" ]; then
            echo "::error::Required secret AWS_ROLE_ARN_DEV is not set"
            exit 1
          fi
          echo "role_arn=${AWS_ROLE_ARN_DEV}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: us-east-2
          role-duration-seconds: 21600

      - name: Render Terraform backend configs
        env:
          TF_INFRA_STATE_BUCKET_DEV: ${{ secrets.TF_INFRA_STATE_BUCKET_DEV }}
        run: |
          if [ -z "${TF_INFRA_STATE_BUCKET_DEV}" ]; then
            echo "::error::Required secret TF_INFRA_STATE_BUCKET_DEV is not set"
            exit 1
          fi
          python3 scripts/terraform/render_aws_backend_configs.py \
            --bucket "${TF_INFRA_STATE_BUCKET_DEV}" \
            --env "${ENV}" \
            --stack portal \
            --github-env

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.34.1

      - name: Run linux post-deploy smoke
        id: smoke
        continue-on-error: true
        run: bash scripts/smoke-test.sh --variant linux

      - name: Open smoke failure issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = `[smoke-test][${process.env.ENV}][linux] ${context.sha.slice(0, 12)}`;
            const body = [
              '## Post-deploy smoke test failed',
              '',
              `- Environment: \`${process.env.ENV}\``,
              `- Provider: \`aws\``,
              `- Variant: \`linux\``,
              `- Commit: \`${context.sha}\``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'See the **Run linux post-deploy smoke** step logs for details.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'smoke-test'],
            });

      - name: Fail smoke job after issue creation
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Post-deploy smoke failed; issue opened and deploy was not blocked (continue-on-error)."
          exit 1
