StylesPath = .vale/styles
MinAlertLevel = error
Packages = Google

[*.md]
BasedOnStyles = Google

# Generated artifact: CHANGELOG.md is produced by release-please from the
# Conventional Commit history (#1776). It is machine-owned release output plus
# preserved release history, not hand-written prose, so it is not prose-linted.
[CHANGELOG.md]
BasedOnStyles =

# Internal / off-site documentation is kept in-repo but excluded from the
# published mkdocs site (see mkdocs.yml exclude_docs). It is not prose-linted,
# so Vale's scope matches the published set rather than internal design notes,
# deprecated content, and scratch.
[docs/_deprecated/**]
BasedOnStyles =

[docs/architecture/**]
BasedOnStyles =

[docs/ctf/**]
BasedOnStyles =

[docs/technical/notes/**]
BasedOnStyles =

[docs/technical/plans/**]
BasedOnStyles =
