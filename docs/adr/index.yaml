    "id": "ADR-044",
    "title": "Platform control-plane workloads use one backend-neutral Helm package",
    "status": "accepted",
    "scope": "platform_packaging",
    "decision": "The Shifter Helm chart is the canonical control-plane workload package for supported Kubernetes backends. Root-selected backend bundles provision provider prerequisites and render validated identity, edge, network, image, runtime, and secret-reference values into the one chart. New AWS deployments use EKS plus Helm; existing ECS/ASG platform deployments remain a documented compatibility path with separate state and controlled cutover. Platform packaging, task delivery, range-substrate lifecycle, cloud backend selection, and user identity remain distinct concerns.",
    "rules": [
      {
        "id": "ADR-044-R1",
        "description": "platform/charts/shifter is the single canonical control-plane workload package for GKE and EKS. Backend-specific Terraform and bootstrap code may supply layered values and provider prerequisites, but must not fork the chart or create an ad hoc kubectl workload deployment path; raw GCP manifests remain supporting/parity evidence during migration.",
        "checks": []
      },
      {
        "id": "ADR-044-R2",
        "description": "The chart's neutral defaults must not emit provider-specific CRDs, annotations, ingress classes, load-balancer/API CIDRs, image roots, or credentials. Backend renderers project validated Terraform outputs and verified image digests into schema-validated values. Secret payloads are prohibited from Helm values/history and ConfigMaps and must flow through provider secret stores or Kubernetes Secrets using the existing hydration boundary.",
        "checks": []
      },
      {
        "id": "ADR-044-R3",
        "description": "For root-configured backend=aws deployments, EKS is the canonical platform compute without introducing an aws-eks backend. AWS range-substrate ownership remains ADR-039 and Cognito/OIDC remains the user-identity boundary. When EKS enables the Kubernetes provisioner Job launcher, it must use the existing provider-neutral KubernetesTaskRunner mechanics with an AWS-specific adapter/profile, exact-subject IRSA for the launcher and provisioner service accounts, and the same dedicated-launcher RBAC, fail-closed admission, restricted-PSS, and default-deny-network contracts required by ADR-006-R4; it must not reuse GCP literal environment, Workload Identity, or range-cell assumptions. That capability requires rendered parity and effective-permission tests before it is enabled for an AWS profile.",
        "checks": []
      },
      {
        "id": "ADR-044-R4",
        "description": "Every supported provider values render must preserve ADR-006 restricted Pod Security and default-deny network policy, least-privilege workload identity, private placement, HTTPS edge policy, exact attested OCI digests, atomic/waiting Helm rollout, and provider-appropriate health evidence. Branch names do not select deployments; CI validates bundle examples and owned artifacts through an explicit backend matrix while credentialed mutation remains explicitly invoked and protected.",
        "checks": [
          "k8s-deployment-security-context",
          "k8s-network-policy-coverage"
        ]
      },
      {
        "id": "ADR-044-R5",
        "description": "EKS infrastructure and legacy ECS/ASG infrastructure retain separate Terraform state and ownership. Compatibility migration must prevent both control planes from acting as concurrent active schedulers, queue consumers, outbox drainers, migration runners, or range launchers; cutover and rollback are explicit and must not rename, import, destroy, or silently adopt legacy resources.",
        "checks": []
      },
      {
        "id": "ADR-044-R6",
        "description": "For root-configured backend=aws deployments the EKS control plane composes over the existing portal and range data plane and must not introduce a standalone EKS data plane. The AWS EKS Terraform roots (platform/terraform/environments/*/eks) source cross-stack values (control-plane database endpoint and IAM-auth resource id, secrets KMS key, agent bucket, range VPC/subnets/route table/availability zone, prebaked AMIs, and range/NGFW instance roles) through native AWS data sources and SSM Parameter Store, never terraform_remote_state, keeping the consumer loosely coupled to producer state. The provisioner Job environment is one provider-neutral contract that AWS and GCP emit identically into the backend-neutral chart's runtimeEnv ConfigMap (ADR-044-R2), with secret payloads flowing only as references through the existing in-process hydration boundary.",
        "checks": [
          "eks-cross-stack-sourcing"
        ]
      },
      {
        "id": "ADR-044-R7",
        "description": "The EKS module owns the AWS Load Balancer Controller permission document and attaches it only to the exact kube-system/aws-load-balancer-controller IRSA role. Protected deployment inputs must not supply an arbitrary controller policy ARN. Controller mutations stay constrained to the EKS VPC, deployment account/region, exact cluster ownership tags, and the deterministic <cluster>-platform ALB ARN namespace used where WAFv2 does not support the ELB ownership-tag condition; IAM actions and elasticloadbalancing:* are forbidden. The incumbent scripts/check_tf_iam_elb_scope guard, its focused negative tests, pre-commit hook, and CI invocation enforce the same policy file.",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": [
      "agent-policy",
      "ci"
    ],
