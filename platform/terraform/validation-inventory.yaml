# Terraform validation inventory (issue #1528).
#
# The single machine-readable classification of every git-tracked Terraform
# directory in this repository, consumed by
# scripts/check_tf_roots/check_tf_roots.py to:
#   - fail closed when a new root or module is added without an inventory entry
#     (validation ownership is mandatory);
#   - emit the pull-request CI matrix that runs a backendless, locked
#     `terraform init` + `terraform validate` per execution root.
#
# This is NOT a copy of the AWS apply order, the bootstrap backend registry,
# or the deploy path filters — each of those owns a narrower concern. See
# docs/architecture/terraform-root-pr-validation-preflight-1528.md.
#
# Provider version constraints stay canonical in each root's Terraform
# `required_providers`; resolved versions and checksums stay canonical in each
# root's committed `.terraform.lock.hcl`. The `providers` list below records
# the provider *source addresses* only, and the checker verifies it against the
# lockfile so it cannot drift silently.

schema_version: 1

# Named toolchain profiles. A root references a profile; CI never carries a
# parallel root-to-version mapping. These represent the three live consumer
# pins today (AWS deploy CI 1.13.3, GCP validation/deploy 1.7.1, provisioner
# runtime image 1.14.3); unifying them is deliberately out of scope for #1528.
profiles:
  aws-1.13.3:
    terraform_version: "1.13.3"
    provider_family: aws
  gcp-1.7.1:
    terraform_version: "1.7.1"
    provider_family: gcp
  provisioner-1.14.3:
    terraform_version: "1.14.3"
    provider_family: aws

# Execution roots: the provisioner stages/executes the two `modules/{range,ngfw}`
# directories, so despite the name they are runtime roots (each declares a
# backend and owns a lockfile). Polaris is a real root without a remote backend.
roots:
  - id: aws-dev-core
    path: platform/terraform/environments/dev
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-dev-portal
    path: platform/terraform/environments/dev/portal
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/archive
      - registry.terraform.io/hashicorp/aws
      - registry.terraform.io/hashicorp/random
  - id: aws-dev-range
    path: platform/terraform/environments/dev/range
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-proof-core
    path: platform/terraform/environments/proof
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-proof-portal
    path: platform/terraform/environments/proof/portal
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/archive
      - registry.terraform.io/hashicorp/aws
      - registry.terraform.io/hashicorp/random
  - id: aws-proof-range
    path: platform/terraform/environments/proof/range
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-prod-core
    path: platform/terraform/environments/prod
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-prod-portal
    path: platform/terraform/environments/prod/portal
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/archive
      - registry.terraform.io/hashicorp/aws
      - registry.terraform.io/hashicorp/random
  - id: aws-prod-range
    path: platform/terraform/environments/prod/range
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: gcp-dev
    path: platform/terraform/gcp/environments/gcp-dev
    owner: "@Brad-Edwards"
    toolchain: gcp-1.7.1
    providers:
      - registry.terraform.io/hashicorp/archive
      - registry.terraform.io/hashicorp/google
      - registry.terraform.io/hashicorp/random
  # GCP-native self-hosted runner (issue #1546). A dedicated execution root and
  # state prefix, separate from the gcp-dev platform root, so a platform destroy
  # never removes the runner (dev-tenant containment).
  - id: gcp-global-github-runner
    path: platform/terraform/gcp/global/github-runner
    owner: "@Brad-Edwards"
    toolchain: gcp-1.7.1
    providers:
      - registry.terraform.io/hashicorp/google
  - id: aws-global-iam
    path: platform/terraform/global/iam
    owner: "@Brad-Edwards"
    toolchain: aws-1.13.3
    providers:
      - registry.terraform.io/hashicorp/aws
  - id: aws-global-github-runner
