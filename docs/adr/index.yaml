        "description": "The organization profile API addresses organizations by immutable public uuid only and never emits the integer primary key. It uses the shared bearer-first authentication chain and is session-only (a platform token principal is refused; token access would require new exact scopes). Reads and updates use explicit DRF serializers (no writable ModelSerializer, unknown fields rejected), the shared error envelope, and the generated OpenAPI/TypeScript client. A missing organization, an organization outside authority, and insufficient authority return one opaque denial.",
        "checks": []
      },
      {
        "id": "ADR-048-R6",
        "description": "An organization profile update is atomic: it locks the organization row, re-checks live authority under the lock, applies only supplied fields whose value actually changed (PATCH mask; absent is unchanged, empty string clears), and emits one strict shared.audit event in the same transaction so an audit-write failure rolls the update back. A no-op change writes nothing and records no audit event. Audit state carries changed field names, the internal organization id, and the superuser_override flag only, never the field values. Mutable fields are explicit typed domain fields; generic settings/branding/defaults JSON and tenant-scoping the ADR-046-R7 deployment-global concerns are prohibited.",
        "checks": []
