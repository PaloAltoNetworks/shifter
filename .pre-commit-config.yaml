fail_fast: true

# Pre-commit is scoped to FAST hygiene + secrets checks only. Expensive gates
# (mypy, checkov/bandit/kube-linter/kubeconform/helm, terraform validate/tflint,
# import-linter, Django model/migration checks) and ALL test suites
# (pytest/jest/mcp) are deferred to CI (.github/workflows/_quality.yml), which
# remains the authoritative blocking gate. Keep local commits fast; let CI do
# the heavy, comprehensive verification.

repos:
  # =============================================================================
  # STAGE 0: Commit message policy (commit-msg hook)
  # =============================================================================
  - repo: local
    hooks:
      - id: block-agent-attribution-commit-msg
        name: block agent attribution in commit messages
        entry: python3 scripts/adr_guard/block_agent_attribution_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  # =============================================================================
  # STAGE 1: Fast checks (linting, formatting, syntax) + secrets
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^assets/styles/
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML constructors (mkdocs plugins)
        exclude: ^platform/charts/.*/templates/.*\.ya?ml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        # Exclude: tests (check key format strings) + key-handling modules that hold only PEM armor
        # labels, never key material: crypto.py (SSH key generation), ensure_vpn_pki.py (formats the
        # generated OpenVPN tls-crypt key) and vpn_access.py (validates that key's armor) (#2480).
        exclude: ^(shifter/engine/provisioner/tests/|shifter/shifter_platform/tests/engine/ssh/|scripts/bootstrap/tests/|shifter/engine/provisioner/utils/crypto\.py|scripts/gcp/ensure_vpn_pki\.py|shifter/engine/provisioner/vpn_access\.py)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.yml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # Python - Ruff (linting + formatting)
  # Note: Ruff handles import sorting via "I" rules - no separate isort needed
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        name: ruff (shifter_platform)
        args: [--fix]
        files: ^shifter/shifter_platform/
      - id: ruff-format
        name: ruff-format (shifter_platform)
        files: ^shifter/shifter_platform/
      - id: ruff
        name: ruff (provisioner)
        args: [--fix]
        files: ^shifter/engine/provisioner/
      - id: ruff-format
        name: ruff-format (provisioner)
        files: ^shifter/engine/provisioner/
      - id: ruff
        name: ruff (packer)
        args: [--fix]
        files: ^shifter/packer/
      - id: ruff-format
        name: ruff-format (packer)
        files: ^shifter/packer/
      - id: ruff
        name: ruff (bootstrap)
        args: [--fix]
        files: ^scripts/bootstrap/
      - id: ruff-format
        name: ruff-format (bootstrap)
        files: ^scripts/bootstrap/
      - id: ruff
        name: ruff (gcp scripts)
        args: [--fix]
        files: ^scripts/gcp/
      - id: ruff-format
        name: ruff-format (gcp scripts)
        files: ^scripts/gcp/
      - id: ruff
        name: ruff (check_layer_imports)
        args: [--fix]
        files: ^scripts/check_layer_imports/
      - id: ruff-format
        name: ruff-format (check_layer_imports)
        files: ^scripts/check_layer_imports/
      - id: ruff
        name: ruff (check_rds_pending_modifications)
        args: [--fix]
        files: ^scripts/check_rds_pending_modifications/
      - id: ruff-format
        name: ruff-format (check_rds_pending_modifications)
        files: ^scripts/check_rds_pending_modifications/
      - id: ruff
        name: ruff (assert_portal_inspection)
        args: [--fix]
        files: ^scripts/assert_portal_inspection/
      - id: ruff-format
        name: ruff-format (assert_portal_inspection)
        files: ^scripts/assert_portal_inspection/
      - id: ruff
        name: ruff (handle_sd_replacement)
        args: [--fix]
        files: ^scripts/handle_sd_replacement/
      - id: ruff-format
        name: ruff-format (handle_sd_replacement)
        files: ^scripts/handle_sd_replacement/
      - id: ruff
        name: ruff (installation)
        args: [--fix]
        files: ^shifter/installation/
      - id: ruff-format
        name: ruff-format (installation)
        files: ^shifter/installation/
      - id: ruff
        name: ruff (event-load-harness)
        args: [--fix]
        files: ^uat/event-load-harness/
      - id: ruff-format
        name: ruff-format (event-load-harness)
        files: ^uat/event-load-harness/

  # JavaScript/CSS linting (fast, auto-fixing hygiene)
  - repo: local
    hooks:
      - id: eslint-shifter-platform
        name: eslint (shifter_platform)
        entry: bash -c 'cd shifter/shifter_platform && npx eslint --fix static/js/'
        language: system
        files: ^shifter/shifter_platform/static/js/.*\.js$
        types: [javascript]

      - id: eslint-mcp-shifter-db
        name: eslint (mcp/shifter-db)
        entry: bash -c 'cd mcp/shifter-db && npx eslint .'
        language: system
        files: ^mcp/shifter-db/.*\.js$
        types: [javascript]

      - id: eslint-mcp-ngfw
        name: eslint (mcp/ngfw)
        entry: bash -c 'cd mcp/ngfw && npx eslint .'
        language: system
        files: ^mcp/ngfw/.*\.js$
        types: [javascript]

      - id: eslint-mcp-aws
        name: eslint (mcp/aws)
        entry: bash -c 'cd mcp/aws && npx eslint .'
        language: system
        files: ^mcp/aws/.*\.js$
        types: [javascript]

      - id: stylelint-shifter-platform
        name: stylelint (shifter_platform)
        entry: bash -c 'cd shifter/shifter_platform && npx stylelint --fix static/css/'
        language: system
        files: ^shifter/shifter_platform/static/css/.*\.css$
        types: [css]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/

  # Terraform formatting (fast). Validation/tflint/checkov are deferred to CI.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        files: ^platform/terraform/

  # Custom fast Terraform IAM/security/network scoping checks (pure-Python HCL
  # parsers, no terraform init) — security hygiene that stays local. The checker
  # test suites and the checkov-parity check are deferred to CI.
  - repo: local
    hooks:
      - id: check-tf-sg-cidrs
        name: AWS SG ingress CIDR scoping (provisioner range modules)
        entry: python3 scripts/check_tf_sg_cidrs/check_tf_sg_cidrs.py
        language: system
        files: ^shifter/engine/provisioner/terraform/modules/range/.*\.tf$

      - id: check-portal-target-sg-sources
        name: Portal target-service SG ingress source scoping (#933)
        entry: python3 scripts/check_portal_target_sg_sources/check_portal_target_sg_sources.py
        language: system
        files: ^platform/terraform/environments/(dev|prod)/portal/main\.tf$

      - id: check-tf-iam-ec2-scope
        name: AWS EC2 lifecycle IAM scoping (shared provisioner IAM)
        entry: python3 scripts/check_tf_iam_ec2_scope/check_tf_iam_ec2_scope.py
        language: system
        files: ^platform/terraform/modules/provisioner-iam/main\.tf$

      - id: check-tf-iam-elb-scope
        name: AWS ELBv2 (GWLB/VPN NLB/EKS ALB controller) IAM scoping
        entry: python3 scripts/check_tf_iam_elb_scope/check_tf_iam_elb_scope.py
        language: system
        files: ^(platform/terraform/modules/provisioner-iam/main|platform/terraform/modules/portal/eks/load_balancer_controller_iam|shifter/engine/provisioner/terraform/modules/range/vpn)\.tf$

      - id: check-tf-iam-ssm-scope
        name: AWS SSM Run Command IAM scoping (shared provisioner IAM)
        entry: python3 scripts/check_tf_iam_ssm_scope/check_tf_iam_ssm_scope.py
        language: system
        files: ^platform/terraform/modules/provisioner-iam/main\.tf$

      - id: check-tf-iam-role-naming
        name: AWS IAM role naming seam (shifter-* prefix)
        entry: python3 scripts/check_tf_iam_role_naming/check_tf_iam_role_naming.py
        language: system
        files: ^platform/terraform/(modules/.+|global/iam/github-oidc\.tf|environments/.+/main\.tf)$

      - id: check-tf-runner-network
        name: GitHub runner default-VPC isolation (ADR-004-R20)
        entry: python3 scripts/check_tf_runner_network/check_tf_runner_network.py
        language: system
        files: ^platform/terraform/global/github-runner/main\.tf$

      - id: check-tf-gcp-runner-network
        name: GCP runner network isolation (ADR-008)
        entry: python3 scripts/check_tf_gcp_runner_network/check_tf_gcp_runner_network.py
        language: system
        files: ^platform/terraform/gcp/modules/github-runner-network/main\.tf$

      - id: check-tf-gcp-wif-trust
        name: GCP WIF exact-subject trust (ADR-004-R23)
        entry: python3 scripts/check_tf_gcp_wif_trust/check_tf_gcp_wif_trust.py
        language: system
        pass_filenames: false
        files: ^platform/terraform/gcp/modules/cicd-oidc-identity/.*\.tf$

      - id: check-tf-iam-ssm-range-scope
        name: AWS range-instance SSM parameter IAM scoping (#1178)
        entry: python3 scripts/check_tf_iam_ssm_range_scope/check_tf_iam_ssm_range_scope.py
        language: system
        files: ^platform/terraform/modules/range/vpc/iam\.tf$

      - id: check-tf-kms-secrets-grant
        name: Secrets Manager kms:Decrypt grant (portal CMK readers)
        entry: >-
          bash -c '
          python3 scripts/check_tf_kms_secrets_grant/check_tf_kms_secrets_grant.py
          platform/terraform/modules/provisioner-iam/*.tf
          '
        language: system
        files: ^platform/terraform/modules/provisioner-iam/.+\.tf$
        pass_filenames: false

      - id: check-tf-gcp-iam-resource-scope
        name: GCP workload IAM resource scoping (ADR-008-R7)
        entry: >-
          bash -c '
          python3 scripts/check_tf_gcp_iam_resource_scope/check_tf_gcp_iam_resource_scope.py
          platform/terraform/gcp/modules/portal/iam/*.tf
          '
        language: system
        files: ^platform/terraform/gcp/modules/portal/iam/.*\.tf$
        pass_filenames: false

      - id: check-tf-rds-security
        name: RDS IAM auth and CA certificate (portal + Guacamole)
        entry: >-
          python3 scripts/check_tf_rds_security/check_tf_rds_security.py
          platform/terraform/modules/portal/rds/main.tf
        language: system
        files: ^platform/terraform/modules/portal/rds/main\.tf$
        pass_filenames: false

  # k8s image-registry + PSS-label grep guards (fast, no schema downloads).
  # kube-linter / kubeconform / helm lint are deferred to CI.
  - repo: local
    hooks:
      - id: k8s-image-registry
        name: k8s image registry check
        entry: >-
          bash -c 'for f in platform/k8s/gcp/overlays/*/kustomization.yaml; do
          if grep -E "newName:" "$f" | grep -qv "pkg\.dev/"; then
          echo "ERROR: Images must use Artifact Registry (pkg.dev) in $f" && exit 1; fi; done'
        language: system
        files: ^platform/k8s/gcp/overlays/.*/kustomization\.yaml$
        pass_filenames: false

      - id: k8s-pss-labels
        name: architecture (k8s PSS labels)
        entry: >-
          bash -c 'for f in platform/k8s/gcp/base/namespaces.yaml; do if ! grep
          -q "pod-security.kubernetes.io/enforce" "$f"; then echo "ERROR: $f
          must include Pod Security Standards labels" && exit 1; fi; done'
        language: system
        files: ^platform/k8s/gcp/base/namespaces\.yaml$
        pass_filenames: false

  # =============================================================================
  # STAGE 2: Architecture (fast adr-guard passes only)
  #
  # The fast adr-guard checks + the live-cloud-identifier scan (a secrets-class
  # hygiene check) stay local. import-linter, check-layer-imports,
  # check-model-fks, and the missing-migrations check boot uv/Django and are
  # deferred to the CI Architecture jobs.
  # =============================================================================
  - repo: local
    hooks:
      - id: adr-guard-fast
        name: architecture (adr guard fast)
        entry: python3 scripts/adr_guard/adr_guard.py --changed --level fast
        language: system
        files: ^(docs/adr/|scripts/adr_guard/|\.github/workflows/|\.github/(CODEOWNERS|pull_request_template\.md|copilot-instructions\.md)$|\.claude/|shifter/shifter_platform/.*\.py$|shifter/engine/provisioner/cloud/.*\.py$|platform/terraform/environments/.*\.tfvars$|\.pre-commit-config\.yaml$|AGENTS\.md$|\.importlinter$|\.tflint\.hcl$|\.gitleaks\.toml$|\.kube-linter\.yaml$|\.shifter\.yaml$|mcp/.*\.(js|mjs|cjs)$)
        pass_filenames: false
        verbose: true

      # ADR-004-R13 identifier hygiene runs on every commit against the
      # changed set: live cloud identifiers can be reintroduced in ANY tracked
      # file, so this hook deliberately has no narrowing `files:` filter. The
      # check itself skips binary / lock files, so the scan stays cheap.
      - id: adr-guard-identifiers
        name: architecture (adr guard live cloud identifiers)
        entry: python3 scripts/adr_guard/adr_guard.py --checks no-live-cloud-identifiers --changed
        language: system
        pass_filenames: false
        verbose: true

      - id: adr-guard-k8s
        name: architecture (adr guard k8s deployments)
        entry: python3 scripts/adr_guard/adr_guard.py --checks k8s-deployment-security-context --files
        language: python
        additional_dependencies:
          - pyyaml>=6.0
        files: ^(platform/k8s/gcp/base/.*\.ya?ml$|platform/charts/shifter/.*)
        pass_filenames: true
        verbose: true

      - id: adr-guard-gcp-overlay-identity
        name: architecture (adr guard gcp overlay deploy identity)
        entry: python3 scripts/adr_guard/adr_guard.py --checks no-live-gcp-deploy-identity --files
        language: system
        files: ^platform/k8s/gcp/overlays/.*
        pass_filenames: true
        verbose: true
