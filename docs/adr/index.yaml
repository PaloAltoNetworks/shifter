    "id": "ADR-026",
    "title": "Commercial self-serve ranges may use a no-default-route zero-egress posture",
    "status": "accepted",
    "scope": "repository",
    "decision": "Commercial self-serve training ranges with untrusted users may run in an explicit zero-egress posture where runtime participant subnets have no outbound NAT/default-route internet path. On AWS, participant route tables have no `0.0.0.0/0` route and no NAT or Internet Gateway target. On GCP/GCE, participant subnets are not named by any Cloud NAT configuration and instances have no external interface; target-tagged firewall denial is defense in depth rather than a substitute for absent NAT. This extends ADR-020 with a route/NAT posture alongside the existing AWS Network Firewall and GCP Cloud NAT paths, and extends ADR-017 by reusing the existing range-egress vocabulary/renderer boundary rather than creating another public schema. `none` is not ADR-017 `deny-all`: `deny-all` retains a native routed egress path with firewall enforcement, while `none` removes that path. Runtime package/tool/agent/phone-home needs for `none` ranges must move to image bake time, in-range services, omitted integrations, or an explicitly classified management path outside participant subnets.",
    "rules": [
      {
        "id": "ADR-026-R1",
        "description": "Zero-egress must be selected by an explicit validated mode. It must not be inferred from an empty or missing firewall endpoint, from `enable_network_firewall = false`, or from an empty allowlist. In `none` mode runtime range route tables must not create `aws_route.firewall`, any NAT target, or any `0.0.0.0/0` route.",
        "checks": []
      },
      {
        "id": "ADR-026-R2",
        "description": "If zero-egress is operator-facing, it must extend the existing `settings.range_egress` / `RangeEgressPolicy` / `shifter-config render` path. Provider/runtime Terraform variables are bridge inputs only and must retain direct validation backstops. Operators must not maintain the egress mode in both root config and hand-authored tfvars or workflow inputs.",
        "checks": []
      },
      {
        "id": "ADR-026-R3",
        "description": "Stable range VPC service endpoints reachable from participant subnets in the commercial shape (SSM, S3 gateway, STS, Bedrock, Route 53 Resolver, or future endpoints) must be deliberately classified as management-plane requirements, disabled for `none`, or replaced by in-range/proxy paths. Leaving an endpoint reachable by accident is not an acceptable zero-egress implementation.",
        "checks": []
      },
      {
        "id": "ADR-026-R4",
        "description": "`none` ranges must boot without public internet dependencies. Runtime package installs, tooling fetches, XDR/XSIAM installer downloads, public DNS/NTP, and simulated phone-home must move to AMI bake time, in-range services, omitted integrations, or a proxy outside participant subnets. Existing allowlist-mode behavior must remain unchanged.",
        "checks": []
      },
      {
        "id": "ADR-026-R5",
        "description": "Validation must include both infrastructure state and inside-range behavior: no NAT/IGW/default route on AWS `none` subnet route tables; no Cloud NAT configuration naming GCE `none` participant subnets and no guest external interface; no reachability to external IPs or domains including previously allowlisted lanes; and focused regression coverage that compatibility mode still creates the native AWS/GCP egress path.",
        "checks": []
      },
