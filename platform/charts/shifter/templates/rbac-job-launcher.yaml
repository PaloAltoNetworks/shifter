apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-launcher
  namespace: {{ .Values.namespaces.jobs }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # delete: the task runner unwinds a Job (and its Secret) when owner-reference
    # installation fails, to avoid orphaning the per-Job Secret.
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # Sensitive provisioner env vars flow through a per-Job Secret (issue #1185)
    # that the task runner creates, patches with the Job ownerReference (so it is
    # garbage-collected with the Job), and deletes on the unwind path. Without
    # this rule range launch fails at create_namespaced_secret with a 403.
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-launcher-portal
  namespace: {{ .Values.namespaces.jobs }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.portal.name }}
    namespace: {{ .Values.namespaces.platform }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-launcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-launcher-ctf-scheduler
  namespace: {{ .Values.namespaces.jobs }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.ctfScheduler.name }}
    namespace: {{ .Values.namespaces.platform }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-launcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-launcher-workers
  namespace: {{ .Values.namespaces.jobs }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.workers.name }}
    namespace: {{ .Values.namespaces.platform }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-launcher
