        "checks": []
      },
      {
        "id": "ADR-029-R2",
        "description": "SPA data access goes only through the canonical DRF /api/v1/ surface -- no ad hoc JSON routes and no legacy per-app /*/api/ endpoints in SPA code paths. Do not add csrf_exempt for session-authenticated browser calls: the browser sends the session cookie plus the X-CSRFToken header. Do not place shf_ API tokens in the browser. Backend validation and domain behavior stay server-side; the SPA must not duplicate backend validation rules.",
