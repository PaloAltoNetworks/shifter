name: shifter-launch-access-ambiguous
description: >
  Two participants declaring *different* interactive access. Shifter has no
  trusted actor-to-participant mapping, so this is ambiguous and must be
  rejected before dispatch rather than unioned (#1710, ADR-032-R10).

nodes:
  lan:
    type: Switch
  web:
    type: compute
    os: linux
    os_distribution: x-shifter:alpine
    os_version: "3.19"
    source: {name: "alpine", version: "3.19"}
    resources: {ram: 512 mib, cpu: 1}

infrastructure:
  lan:
    count: 1
    properties: {cidr: 10.51.0.0/24, gateway: 10.51.0.1}
  web:
    count: 1
    links: [lan]
    properties:
      - lan: 10.51.0.10

entities:
  analyst-team:
    description: Participant team the interactive access is offered to.
    role: blue

accounts:
  analyst:
    username: analyst
    node: web
    auth_method: key

agents:
  analyst:
    entity: analyst-team
    description: Participant offered SSH to the web host.
    starting_accounts: [analyst]
    interactive_access:
      web-ssh:
        target_ref: web
        channel: ssh
        account_ref: analyst
  observer:
    entity: analyst-team
    description: Participant offered no interactive access.

realization:
  constraints:
    - field_pointer: /nodes/web
      concern: compute-substrate
      posture: exact
      domain: {kind: exact, value: virtual-machine}
