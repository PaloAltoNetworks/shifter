    legacy_field: DCConfig, InstanceSpec role/join_domain, DCConfigExt, AssetSpec.join_domain, DomainSpec, and ForestSpec
    category: ACES schema/profile gap
    aces_target: aces-sdl 0.23 public domain identity, DC binding, domain-join relation, account-domain anchor, semantic validation, supported_domain_profiles capability, and domain_topology_plan_diagnostics gate
