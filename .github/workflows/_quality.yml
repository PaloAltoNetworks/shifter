        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Check import contracts
        working-directory: shifter/shifter_platform
        run: uv run lint-imports --config ../../.importlinter

  # ===========================================================================
  # SAST (Bandit)
  #
  # Policy (#1193): every Bandit job in this workflow is BLOCKING. There
  # are no advisory Bandit jobs by default. Owner: @Brad-Edwards. Scope
  # covers every Python package that ships from this repo — runtime
  # (shifter_platform, provisioner), build (packer), bootstrap and
  # install scripts (scripts/bootstrap, shifter/installation), operator
  # scripts (scripts/gcp), and dev-tool linters
  # (scripts/check_layer_imports). Adding a new Bandit job MUST NOT
  # introduce `continue-on-error: true` — fix the finding, narrow the
  # scan, or use a documented `# nosec` with an inline justification.
  # ===========================================================================

  shifter-platform-sast:
    permissions:
      contents: read
    name: SAST (shifter_platform)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r shifter/shifter_platform/ --skip B101 --exclude shifter/shifter_platform/tests,shifter/shifter_platform/.venv

  provisioner-sast:
    permissions:
      contents: read
    name: SAST (provisioner)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.provisioner == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        # B404: subprocess import, B603: subprocess call, B607: partial path
        # Provisioner uses subprocess for Pulumi CLI calls with hardcoded commands
        run: |
          uv tool install bandit
          bandit -r shifter/engine/provisioner/ --skip B101,B404,B603,B607 --exclude shifter/engine/provisioner/tests,shifter/engine/provisioner/.venv

  packer-sast:
    permissions:
      contents: read
    name: SAST (packer)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.packer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r shifter/packer/ --skip B101 --exclude shifter/packer/tests,shifter/packer/.venv

  bootstrap-sast:
    permissions:
      contents: read
    name: SAST (bootstrap)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.bootstrap == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r scripts/bootstrap/ --skip B101 --exclude scripts/bootstrap/tests,scripts/bootstrap/.venv

  gcp-scripts-sast:
    permissions:
      contents: read
    name: SAST (gcp scripts)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.gcp_scripts == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r scripts/gcp/ --skip B101,B108 --exclude scripts/gcp/tests,scripts/gcp/.venv

  check-layer-imports-sast:
    permissions:
      contents: read
    name: SAST (check_layer_imports)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.check_layer_imports == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        working-directory: scripts/check_layer_imports
        run: |
          uv tool install 'bandit[toml]'
          bandit -r . -c pyproject.toml

  installation-sast:
    permissions:
      contents: read
    name: SAST (installation)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.installation == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        run: |
          uv tool install bandit
          bandit -r shifter/installation/ --skip B101 --exclude shifter/installation/tests,shifter/installation/.venv

  event-load-harness-sast:
    permissions:
      contents: read
    name: SAST (event-load-harness)
    needs: [paths]
    if: ${{ (needs.paths.outputs.run_all == 'true' || needs.paths.outputs.event_load_harness == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run Bandit
        working-directory: uat/event-load-harness
        run: |
          uv tool install 'bandit[toml]'
          bandit -r . -c pyproject.toml

  # ===========================================================================
  # Python Tests
  # ===========================================================================

  shifter-platform-tests:
    permissions:
      contents: read
    name: Tests (shifter_platform)
    needs: [paths, shifter-platform-lint, shifter-platform-lint-js, shifter-platform-sast]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.shifter_platform == 'true')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shifter
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis backs the real-stack ASGI/Channels integration evidence (#924).
      # It is consumed only by the dedicated redis-posture step below; the main
      # test step stays on the in-memory channel layer (no REDIS_HOST), so the
      # default test ergonomics are unchanged.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/shifter_platform
        run: uv sync --group dev

      - name: Run tests
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: shifter
          DB_USER: test
          DB_PASSWORD: test
        run: |
          uv run python manage.py collectstatic --noinput
          uv run pytest tests/ --ignore=tests/documentation -m "not redis and not postgres" --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml

      # Real-stack Redis channel-layer evidence (#924). Runs only the
      # redis-marked integration tests against the Redis service, with xdist
      # disabled (-n0) for deterministic stateful isolation. CHANNEL_LAYER_BACKEND
      # / REDIS_HOST are scoped to this step, so the main suite above stays
      # in-memory.
      - name: Run Redis channel-layer integration tests
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: shifter
          DB_USER: test
          DB_PASSWORD: test
          CHANNEL_LAYER_BACKEND: redis
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          uv run pytest tests/integration/asgi -m redis -n0 -p no:cacheprovider

      # Real PostgreSQL concurrency evidence (#1182). submit_flag()'s
      # select_for_update() guard (#1135, #1137) needs real row-level locking
      # to prove it serializes concurrent requests, which SQLite (the main
      # suite's backend above) cannot provide. TEST_DB_BACKEND=postgres tells
      # tests/ctf/test_services/conftest.py to redirect the ORM at this job's
      # postgres service instead of SQLite; TESTING stays "1" so unrelated
      # test-mode settings are unaffected. DB_NAME/DB_USER/DB_PASSWORD match
      # the postgres service block above. Runs with -n0 (like the redis step
      # above): these tests drive their own thread-level concurrency, so xdist
      # distribution adds no value and races the per-worker DB setup.
      - name: Run CTF submission concurrency tests (PostgreSQL)
        working-directory: shifter/shifter_platform
        env:
          TESTING: "1"
          TEST_DB_BACKEND: postgres
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: shifter
          DB_USER: test
          DB_PASSWORD: test
        run: |
          uv run pytest tests/ctf/test_services/test_submission_concurrency.py -m postgres -n0 -p no:cacheprovider

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shifter-platform
          path: shifter/shifter_platform/coverage.xml
          if-no-files-found: error
          retention-days: 1

  shifter-engine-tests:
    permissions:
      contents: read
    name: Tests (provisioner)
    needs: [paths, provisioner-lint, provisioner-sast]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.provisioner == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/engine/provisioner
        run: uv sync --group dev

      - name: Run tests
        working-directory: shifter/engine/provisioner
        env:
          TESTING: "1"
        run: uv run --with pytest-cov pytest tests/ --cov=. --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-provisioner
          path: shifter/engine/provisioner/coverage.xml
          if-no-files-found: error
          retention-days: 1

  packer-tests:
    permissions:
      contents: read
    name: Tests (packer)
    needs: [paths, packer-lint]
    if: ${{ !inputs.skip_tests && ((needs.paths.outputs.run_all == 'true' || needs.paths.outputs.packer == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/packer
        run: uv sync --group dev

      - name: Run tests
        working-directory: shifter/packer
        run: uv run --with pytest-cov pytest tests/ --cov=. --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-packer
          path: shifter/packer/coverage.xml
          if-no-files-found: error
          retention-days: 1

  cyberscript-tests:
    permissions:
