<!doctype html>
{% load i18n static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />
    <title>{% trans "Password changed" %}</title>
  </head>
  <body>
    <main>
      <h1>{% trans "Password changed" %}</h1>
      <p id="reset-complete">{% trans "Your password has been set. You can now sign in with your new password." %}</p>
      <p><a href="{% url 'platform_login' %}">{% trans "Go to sign in" %}</a></p>
    </main>
  </body>
</html>
