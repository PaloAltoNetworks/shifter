[project]
name = "shifter-platform"
version = "0.1.0"
description = "Self-service cyber range platform"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.23.0",
    "bleach>=6.4.0",
    "boto3",
    "channels",
    "channels-redis",
    "daphne",
    "django>=6.0.6",
    # GCP transactional-email backends (SendGrid / Mailgun) for PLAT-002 parity;
    # AWS continues to use django-ses. See config/_email.py.
    "django-anymail",
    "django-encrypted-model-fields>=0.6.5",
    "django-health-check<5.0",
    "django-ses",
    "djangorestframework",
    "drf-spectacular>=0.29.0",
    "drf-spectacular-sidecar>=2026.6.1",
    "firebase-admin",
    # GCP Cloud Monitoring publisher for the portal capacity emitter (PLAT-002);
    # AWS uses boto3/CloudWatch. Lazy-imported so AWS flows never load it.
    "google-cloud-monitoring",
    "gunicorn",
    "markdown",
    "mozilla-django-oidc",
    "paramiko",
    "psycopg[binary]",
    "pycurl>=7.45.7",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    # Promoted from a transitive dep (via channels-redis) to a direct dep so the
    # built-in Django RedisCache backend for launch-endpoint rate limiting (#322)
    # does not rely on another package's transitive pin.
    "redis>=5.0",
    "regex>=2026.6.28",
    "requests",
    # ACES contract/profile/conformance tooling + RuntimeTarget runtime (issue
    # #1262). shared.aces.runtime_target imports the manifest builder and the
    # aces_runtime/aces_backend_protocols/aces_contracts packages at runtime to
    # construct a live RuntimeTarget. Installed from the published PyPI wheel so
    # the hash-pinned portal image build (uv export --no-dev + --require-hashes)
    # can integrity-verify it; a git source has no emittable hash and broke the
    # build when this was promoted to a runtime dep (issue #1445). ACES is a
    # deliberate, PyPI-pinned stack commitment (ADR-032-R4). Upgrade policy
    # (ADR-032-R7): this floor is the supported-producer floor the provisioner
    # consumer enforces (aces_plan.MINIMUM_ACES_SDL_VERSION, kept in agreement by
    # tests/shared/aces/test_plan_provisioner_parity.py); changing it requires
    # passing the ACES conformance gate (test_backend_conformance_gate.py).
    # aces-scenario-packs 2.0.1 requires this exact SDL release.
    "aces-sdl==0.23.0",
    # ACES scenario-pack contract and canonical content-digest implementation
    # used by the uniform content-ingestion path (#1578, ADR-034). Keep this
    # exact: its schemas, validator, digest profile, and aces-sdl dependency are
    # one versioned consumer contract.
    "aces-scenario-packs==2.0.1",
    "uvicorn-worker",
    # uvicorn's WebSocket protocol backend. Not imported directly: the
    # Gunicorn/Uvicorn ASGI workers (entrypoint.sh) need websockets (or wsproto)
    # installed to accept WebSocket upgrades. Without it the built image's
    # uvicorn logs "No supported WebSocket library detected" and the portal's
    # terminal / range-status / notification sockets fail at runtime while
    # /health still passes - the exact container-only regression class the #922
    # stack smoke exists to catch.
    "websockets",
    "whitenoise",
]

[dependency-groups]
dev = [
    "import-linter>=2.7.0",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.3",
    "pytest-django>=4.11.1",
    "ruff>=0.15.13",
    "bandit>=1.9.2",
    "pre-commit>=4.5.0",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.5.0",
    "freezegun>=1.5.5",
    "mypy>=2.1.0",
    "django-stubs>=6.0.4",
    "types-requests>=2.33.0.20260513",
    "types-bleach>=6.3.0.20260508",
    "types-Markdown>=3.7.0",
    "cel-python>=0.5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
pythonpath = [".."]  # Add shifter/ to path so cyberscript is importable
# This suite mixes fast unit tests with a large number of Django DB tests.
# Uncapped `-n auto` over-parallelizes the DB-heavy portion and spends too much
# time on worker/database setup. A capped worker pool plus loadscope improves
# end-to-end runtime on representative slices while keeping full-suite
# parallelism enabled.
addopts = "-n auto --maxprocesses=4 --dist loadscope --reuse-db"
markers = [
    "redis: integration tests requiring a real Redis channel layer (run with -m redis -n0; needs a Redis service)",
    "postgres: integration tests requiring a real PostgreSQL backend (run with -m postgres; needs TEST_DB_BACKEND=postgres and a Postgres service)",
]
# Warning policy (#1529 / REV1 Q6). pytest applies these top-to-bottom and the
# LAST matching entry wins, so the narrow third-party ``ignore`` allowances sit
# after the broad ``error`` rules and take precedence for their exact messages.
filterwarnings = [
    # Correctness failures (AC5): a coroutine left un-awaited or a resource
    # (subprocess, socket, event loop) left unclosed is a real defect and must
    # fail regardless of test order or xdist worker. Fix the originating
    # fixture/mock -- never downgrade to ``ignore`` (see the LOCAL_PROVISIONER
    # pin in conftest.py and the create_task stub in tests/mission_control/consumers).
    "error::ResourceWarning",
    "error:coroutine .* was never awaited:RuntimeWarning",
    # First-party -- and any new/unclassified third-party -- deprecation fails
    # (AC6). It must be fixed or explicitly baselined below, never buried under a
    # blanket ``ignore::DeprecationWarning``.
    "error::DeprecationWarning",
    # Third-party deprecation allowances (AC6). Owner: @Brad-Edwards.
    # django-health-check (pinned <5.0) deprecated its class-based checks for the
    # v4 view-based API; migration + removal tracked in #1601. Matched by exact
    # message so a new or changed deprecation still fails.
    "ignore:The `health_check.db` app is deprecated:DeprecationWarning",
    "ignore:`DatabaseBackend` is deprecated:DeprecationWarning",
    "ignore:`DefaultFileStorageHealthCheck` is deprecated:DeprecationWarning",
    "ignore:`CacheBackend.cache_key` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# ``source = ["."]`` makes coverage record paths from the
# shifter_platform package root so coverage.xml has unambiguous
# repo-relative names (``cms/services/_common.py`` rather than
# ``services/_common.py`` rooted at the ``cms`` source directory).
# Without this, SonarCloud cannot disambiguate when two Django apps
# happen to share a sub-path (e.g. ``cms/services/_common.py`` and
# ``engine/services/_common.py``) and attributes coverage to whichever
# source root it picks, leaving the loser at 0%.
#
# Production-only measurement (#1529 / REV1 Q6): keeping ``source = ["."]``
# preserves the repo-relative naming above, but tests, fixtures, and
# conftest hooks must NOT participate in the metric — coverage of tests by
# tests was inflating the reported number (94% observed vs ~88% real). The
# ``omit`` list below excludes the whole test tree, all conftest hooks, and
# migrations so the coverage report reflects owned production behavior only.
# CI invokes ``--cov`` (no ``=.``) so this configuration — not the command
# line — defines the measured universe.
source = ["."]
omit = [
    "tests/*",
    "*/tests/*",
    "conftest.py",
    "*/conftest.py",
    "*/migrations/*",
]

[tool.coverage.report]
# Non-regression floor (#1529 / REV1 Q6). Measured production-only baseline is
# 88% (tests excluded -- the self-covering ``source = ["."]`` metric reported 94%);
# the floor sits one point under it to absorb run-to-run variance and ratchets up
# as coverage improves (a real reduction needs a reviewed exception). SonarCloud
# owns the changed-code floor. See docs/dev/testing.md.
fail_under = 87

# Ruff - linting and formatting
[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "C901",   # mccabe per-function complexity (ADR-012)
]
ignore = [
    "S101",   # assert - OK in tests
    "S105",   # hardcoded password - false positives on empty strings
    "RUF012", # Django Meta class attributes don't need ClassVar
    "S608",   # false positive on f-strings in error messages
]

# Per-function McCabe complexity limit (ADR-012). Existing offenders carry
# `# noqa: C901`; threshold ratchets down as the backlog shrinks.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded passwords in test fixtures OK
    "S106",   # same
]
"config/settings.py" = [
    "S105",   # empty password string for default
    "F403",   # ``from config._<topic> import *`` re-exports Django settings
    "F405",   # ditto — names land via star-imports declared with __all__
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Bandit - security scanning
[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]  # assert OK in production code for this project

# Mypy - static type checking
#
# Type-check policy (#564). This package is an ENFORCED, blocking mypy scope:
# the `shifter-platform-typecheck` CI job and the `mypy-shifter-platform`
# pre-commit hook both run `mypy .` here and fail on any error. The enforced
# scope is the whole package minus the TRANSITIONAL / out-of-scope dirs listed
# in `exclude` below (migrations, tests, the local venv). The strictness flags
# are intentionally permissive and tightened incrementally via per-module
# `[[tool.mypy.overrides]]` (see `cms.services` for the strict precedent);
# tightening is enforced as it lands, not deferred behind a swallowed CI step.
# To temporarily exempt a module that cannot yet pass, add an explicit
# per-module override with `ignore_errors = true` here - never reintroduce
# `|| true` or `continue-on-error` in the workflow. This keeps the
# enforced/transitional boundary in one machine-readable place that CI and
# pre-commit share.
[tool.mypy]
python_version = "3.12"
mypy_path = ".."  # Add shifter/ to path so cyberscript is importable
plugins = ["mypy_django_plugin.main"]
# Transitional / out-of-scope: not part of the enforced type-check estate.
exclude = [
    "migrations/",
    ".venv/",
    "tests/",
]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true
# Per-module overrides for stricter checking on new code
[[tool.mypy.overrides]]
module = "cms.services"
disallow_untyped_defs = true
warn_return_any = true

# uv - dependency constraints for transitive security fixes
[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "pyopenssl>=26.0.0",
    "pyasn1>=0.6.3",
    "ujson>=5.13.0",
    "cbor2>=5.9.0",
    "urllib3>=2.6.3",
    "filelock>=3.20.3",
    "virtualenv>=20.36.1",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "pyjwt>=2.13.0",
]

[tool.django-stubs]
django_settings_module = "config.settings"
