name: Shifter Engine

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      is_dev:
        required: true
        type: boolean
      deploy_changes:
        required: true
        type: boolean
      first_deploy:
        description: >-
          Allow the engine deploy to skip when the ECS task definition family
          does not exist yet. Set true only for the first-ever deploy to a fresh
          AWS environment, before the platform Terraform apply has created the
          provisioner task definition. Automatic deploys always require the
          family to exist, so a typo'd family name fails the run.
        required: false
        type: boolean
        default: false
    outputs:
      image_tag:
        description: Run-scoped ECR tag pushed for the engine provisioner image
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: Immutable ECR digest pushed for the engine provisioner image
        value: ${{ jobs.build.outputs.image_digest }}
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ROLE_ARN_DEV:
        required: true
      AWS_ROLE_ARN_PROOF:
        required: false

env:
  AWS_REGION: us-east-2

jobs:
  test:
    name: Test provisioner (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        working-directory: shifter/engine/provisioner
        run: uv sync --group dev

      - name: Run provisioner tests
        working-directory: shifter/engine/provisioner
        env:
          TESTING: "1"
        run: uv run --with pytest-cov pytest tests/ --cov=. --cov-report=xml:coverage.xml

  validate:
    name: Validate (${{ inputs.environment }})
    # Engine image-shape validation (local `docker build`, no cloud credentials).
    # This reusable workflow is only ever called by deploy.yml's PR-gated
    # `shifter-engine` job, so `validate` runs on the trusted deploy path, never
    # on pull_request. Run it on the same self-hosted runner class as
    # build/deploy: on GitHub-hosted runners a runner-acquisition stall can
    # cancel the job with zero steps started and skip the whole Platform stage
    # (#1474), and GitHub Actions has no runner-class fallback to repair a job
    # that never acquired a runner.
    needs: test
    runs-on: self-hosted
    # Defense in depth: ADR-003-R5 (`deploy-workflow-runner-exposure`) requires
    # every self-hosted job in a reusable deploy workflow to fail closed on
    # pull_request, so the workflow stays safe if a future caller is added.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    # Backstop only (see #1220); generous vs. a single local --no-cache build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build provisioner image locally
        run: docker build --no-cache -f shifter/engine/provisioner/Dockerfile -t shifter-engine-validate ./shifter

  build:
    name: Build (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220); generous vs. real image-build times.
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    needs: [test, validate]
    permissions:
      id-token: write
      contents: read
      attestations: write
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      ECR_REPOSITORY: shifter-${{ inputs.environment }}-pulumi-provisioner
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set image tag
        id: image
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "tag=${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./shifter
          file: ./shifter/engine/provisioner/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
          no-cache: true
          # Build provenance (ADR-037-R5): embed an SBOM and max provenance in
          # the pushed image, then attest it below with a GitHub OIDC-signed
          # statement bound to the exact repository and digest.
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: self-hosted
    # Backstop only (see #1220); generous vs. real deploy times.
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
      attestations: read
    needs: [test, build]
    if: inputs.deploy_changes && github.event_name != 'pull_request'
    env:
      TASK_FAMILY: ${{ inputs.environment }}-portal-pulumi-provisioner
    steps:
      - name: Resolve AWS deploy role
        id: aws-role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROOF: ${{ secrets.AWS_ROLE_ARN_PROOF }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$ENVIRONMENT" in
            dev)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_DEV"
              ROLE_ARN="$AWS_ROLE_ARN_DEV"
              ;;
            proof)
              ROLE_SECRET_NAME="AWS_ROLE_ARN_PROOF"
              ROLE_ARN="$AWS_ROLE_ARN_PROOF"
              ;;
            prod)
              ROLE_SECRET_NAME="AWS_ROLE_ARN"
              ROLE_ARN="$AWS_ROLE_ARN_PROD"
              ;;
            *)
              echo "::error::Unsupported AWS environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Required secret ${ROLE_SECRET_NAME} is not set"
            exit 1
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Verify image build provenance
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          ECR_REPOSITORY: shifter-${{ inputs.environment }}-pulumi-provisioner
          GH_TOKEN: ${{ github.token }}
        run: |
          # ADR-037-R6: verify the GitHub OIDC-signed provenance attestation for
          # the exact image@digest and the fixed Brad-Edwards/shifter identity
          # before it is registered into the ECS task definition. No bypass mode.
          if [[ -z "$IMAGE_DIGEST" || ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not produce a valid ECR image digest to verify"
            exit 1
          fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_REF="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          echo "Verifying provenance for ${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          gh attestation verify "oci://${IMAGE_REF}" --repo Brad-Edwards/shifter

      - name: Update ECS task definition
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          ECR_REPOSITORY: shifter-${{ inputs.environment }}-pulumi-provisioner
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          if [[ -z "$IMAGE_DIGEST" || ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not produce a valid ECR image digest"
            exit 1
          fi
          # Get AWS account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          NEW_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          # Get current task definition. A missing family must fail the deploy:
          # an unconditional skip means a typo'd family name silently skips every
          # engine deploy forever. The only legitimate skip is the first-ever
          # deploy to a fresh environment, before the platform Terraform apply
          # has created the family — that is gated on the explicit first_deploy
          # bootstrap input (mirrors gcp_require_active_certificate).
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" --query 'taskDefinition' 2>/dev/null) || {
            if [ "${FIRST_DEPLOY}" = "true" ]; then
              echo "::warning::Bootstrap (first_deploy): task definition ${TASK_FAMILY} does not exist yet; skipping engine deploy. The platform Terraform apply will create it. Re-run without aws_first_deploy once the platform stack has been applied."
              exit 0
            fi
            echo "::error::ECS task definition family ${TASK_FAMILY} does not exist or could not be read; the engine deploy cannot proceed. For the first-ever deploy to a fresh environment, re-run via workflow_dispatch with aws_first_deploy=true; otherwise verify TASK_FAMILY matches the Terraform-managed provisioner family."
            exit 1
          }

          # Swap the image into the existing task definition and strip the
          # read-only fields AWS rejects on register. Re-registering the whole
          # definition (rather than cherry-picking individual fields) carries
          # every Terraform-managed field forward verbatim — volumes,
          # mountPoints, runtimePlatform, ephemeralStorage, etc. Cherry-picking
          # silently dropped `volumes` once Terraform added them (#1103),
          # breaking every deploy with "Unknown volume 'provisioner-workspace'".
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition revision
          aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF"

          echo "Registered new task definition with image: ${NEW_IMAGE}"
