portal:
  replicas: 2

workers:
  cms:
    replicas: 2
  engine:
    replicas: 2
  mc:
    replicas: 2
  ctfScheduler:
    replicas: 1

guacd:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 32
    maxReplicas: 48
    cpuUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 900

# guacamole-client scales horizontally. Session affinity (GENERATED_COOKIE) on
# the GCE BackendConfig ensures the GCE L7 LB pins each browser session to one
# pod so in-memory Guacamole tunnels survive reconnects.
# POSTGRESQL_ABSOLUTE_MAX_CONNECTIONS is set per-replica; replicas × value must
# stay below the Cloud SQL max_connections limit (1000).
guacamoleClient:
  replicas: 2
  postgresqlAbsoluteMaxConnections: 500
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 900

services:
  guacamoleClient:
    backendConfig:
      enabled: true
      sessionAffinity:
        enabled: true
        affinityType: GENERATED_COOKIE
        affinityCookieTtlSec: 86400

ingress:
  enabled: true
