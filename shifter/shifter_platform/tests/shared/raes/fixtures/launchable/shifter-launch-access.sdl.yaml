name: shifter-launch-access
description: >
  Provisioning-only RAES scenario that additionally authors participant
  interactive access, so the #1710 sidecar projection can be exercised from real
  compiled output rather than hand-built runtime objects. Authored against
  RAES 3.5.0.

nodes:
  lan:
    type: Switch
  web:
    type: compute
    os: linux
    os_distribution: x-shifter:alpine
    os_version: "3.19"
    source: {name: "alpine", version: "3.19"}
    resources: {ram: 512 mib, cpu: 1}

infrastructure:
  lan:
    count: 1
    properties: {cidr: 10.51.0.0/24, gateway: 10.51.0.1}
  web:
    count: 1
    links: [lan]
    properties:
      - lan: 10.51.0.10

entities:
  analyst-team:
    description: Participant team the interactive access is offered to.
    role: blue

accounts:
  analyst:
    username: analyst
    node: web
    auth_method: key

agents:
  analyst:
    entity: analyst-team
    description: Participant offered SSH to the web host.
    starting_accounts: [analyst]
    interactive_access:
      web-ssh:
        target_ref: web
        channel: ssh
        account_ref: analyst

realization:
  constraints:
    - field_pointer: /nodes/web
      concern: compute-substrate
      posture: exact
      domain: {kind: exact, value: virtual-machine}
