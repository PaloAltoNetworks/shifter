        "id": "ADR-051-R8",
        "description": "Communication content and recipient evidence use bounded retention separate from transport/audit retention: the typed CTF communication retention setting defaults to 90 days after the latest target event and is constrained to 1-365 days; shared WebSocket notifications keep their independent replay TTL; body-free shared.audit evidence keeps its own archive policy. Delivery coordinates use the existing field-encryption boundary and never appear in task metadata, logs, audit free text, metrics labels, argv, environment dumps, manifests, Terraform state, or public errors.",
        "checks": []
