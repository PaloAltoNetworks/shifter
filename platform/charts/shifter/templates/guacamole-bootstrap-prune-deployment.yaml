apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-bootstrap-prune
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "shifter.partOfLabels" . | nindent 4 }}
    app.kubernetes.io/component: guacamole-bootstrap-prune
spec:
  replicas: {{ .Values.workers.guacamolePrune.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shifter
      app.kubernetes.io/component: guacamole-bootstrap-prune
  template:
    metadata:
      labels:
        {{- include "shifter.partOfLabels" . | nindent 8 }}
        app.kubernetes.io/component: guacamole-bootstrap-prune
      annotations:
        checksum/runtime-config: {{ include "shifter.runtimeConfigChecksum" . }}
    spec:
      {{- include "shifter.podSecurityContext" . | nindent 6 }}
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.workers.name }}
      containers:
        - name: guacamole-bootstrap-prune
          image: {{ include "shifter.portalImage" . }}
          imagePullPolicy: {{ .Values.images.portal.pullPolicy }}
          {{- include "shifter.containerSecurityContextApp" . | nindent 10 }}
          {{- include "shifter.tmpVolumeMount" . | nindent 10 }}
          args: ["python", "manage.py", "run_guacamole_bootstrap_prune"]
          envFrom:
            - configMapRef:
                name: platform-runtime
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/guacamole-bootstrap-prune-heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.workers.guacamolePrune.resources | nindent 12 }}
      {{- include "shifter.tmpVolume" . | nindent 6 }}
