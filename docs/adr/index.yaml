    "id": "ADR-054",
    "title": "Dedicated-customer deployment with explicit internal authority",
    "status": "accepted",
    "scope": "repository",
    "decision": "The first BigRAE SaaS release on GCP is operated as one customer security and administration boundary per deployment. Unrelated customers do not share its product control plane, PostgreSQL authority, runtime secret authority, or product workload identities. Organizations and workspaces remain internal authorization scopes rather than customer-isolation boundaries, and dedicated deployment never flattens organization, workspace, event, participant, application-operator, cloud-operator, or external-client authority. Deployment-local services own admission, policy, validation, persistence, lifecycle effects, secrets, audit, and effect results; external clients act only through the versioned public API and never become a second effect owner. ADR-051's event workspace binding is a staged migration: the current pre-#2048 model remains deployment-global with event-native authorization; the post-migration model becomes operative only after every event is deterministically backfilled, unresolved mappings fail closed, the schema requires one immutable workspace_id, and supported creation persists the binding through workspaces.services. The binding proves tenant confinement only and never grants event participation or authority. Effective configuration, IAM, datastore, secret, network, and evidence controls prove the deployment boundary; names and labels do not. Dependency loss never invents authority or an unobserved successful effect.",
    "interface_contract": {
      "kind": "dedicated-customer-authority/v1",
      "deployment": {
        "customer_count": 1,
        "unrelated_customer_shared_control_plane": false,
        "isolation_proof": "effective-config-identity-network-data-secret-evidence"
      },
      "authorities": {
        "composition": "owning-service-boundaries",
        "workspace_membership_grants_event_authority": false,
        "external_client_effect_ownership": false,
        "scopes": [
          "deployment-customer",
          "organization",
          "workspace",
          "event",
          "participant",
          "application-operator",
          "cloud-operator",
          "external-client"
        ]
      },
