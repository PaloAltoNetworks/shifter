{% load i18n static %}
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />
    <title>{% trans "Risk Register — Shifter" %}</title>
    {% for href in spa_css %}
    <link rel="stylesheet" href="{{ href }}" />
    {% endfor %}
  </head>
  <body>
    <div id="root"></div>
    <noscript>{% trans "The Risk Register workspace requires JavaScript." %}</noscript>
    {% if spa_js %}
    <script type="module" src="{{ spa_js }}"></script>
    {% endif %}
  </body>
</html>
