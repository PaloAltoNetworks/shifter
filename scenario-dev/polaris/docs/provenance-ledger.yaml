schema_version: environment-pack-provenance/v3
pack:
  name: polaris
sources:
  - source_id: original-design
    name: Shifter Operation NORTHSTORM design
    license: proprietary
    usage: reused
    attribution_required: false
artifacts:
  - artifact_id: concepts
    path: docs/concepts.md
    classification: open
  - artifact_id: topology
    path: sdl/polaris.sdl.yaml
    classification: internal-only
content_safety:
  no_real_malware: true
  no_real_third_party_targets: true
  no_real_credentials: true
  no_sensitive_data: true
  offensive_tooling_boundary: true
review:
  status: approved
  gates:
    - gate_id: licensing
      status: approved
    - gate_id: attribution
      status: approved
    - gate_id: sensitive-data
      status: approved
    - gate_id: offensive-tooling
      status: approved
