      {
        "id": "ADR-048-R3",
        "description": "A Django superuser (is_superuser) is the sole platform-operator override: it may read and update any organization and every such action is recorded distinctly in audit (superuser_override). is_staff without superuser or an admin membership is denied. The override is enforced inside workspaces.services, never as an incidental Django-permission shortcut at the HTTP layer.",
