  {
    "id": "ADR-039",
    "title": "Provider-neutral range substrate",
    "status": "accepted",
    "scope": "range_provisioning",
    "decision": "Each root-selected backend bundle selects a provider family, and a provider's persisted registered range-backend binding selects exactly one provider-neutral range-substrate adapter exposing four convergent operations -- provision, destroy, pause, and resume -- over the complete range resource set (networks, instances, optional NGFW, and remote-access bindings). The port consumes existing validated RangeSpec or RAES realization intent rather than a new topology schema, returns closed versioned non-secret resource bindings, uses one classified error contract and request-scoped idempotency semantics, and is trusted only after the shared black-box lifecycle/security conformance suite passes. Task dispatch, backend metadata, public workflow/status, RAES semantic conformance, and Guacamole credential/session construction remain separate concerns. AWS Terraform, GCP GCE, and GCP GDC are the initial adapters; capability and evidence are scoped to the selected adapter and its admitted resource mix, while Azure is deferred until its adapter passes conformance. Warm preparation is an internal provision profile and fresh-owner activation is a separately advertised optional capability; neither weakens the four-operation core contract or permits ownership transfer without credential and runtime-state replacement.",
    "interface_contract": {
      "kind": "range-substrate/v1",
      "operations": [
        "provision",
        "destroy",
        "pause",
        "resume"
      ],
      "optional_capabilities": {
        "warm_activation": {
          "kind": "range-warm-activation/v1",
          "provision_profile": "warm-prepared",
          "operations": [
            "activate"
          ],
          "unsupported_code": "unsupported-capability"
        }
      },
      "resources": [
        "network",
        "instance",
        "ngfw",
        "remote-access"
      ],
      "conformance": {
        "shared_black_box_suite": true,
