# Example root installation config for the GCP backend.
#
# Copy this file to ./shifter.yaml at the repository root and edit it for your
# deployment, then validate it from the repo root with:
#   uv run --project shifter/installation shifter-config validate shifter.yaml
# See shifter/installation/README.md for the full field reference.
#
# This file is user-authored installation intent only. It holds *references* to
# secrets, never secret values — store the values in Google Secret Manager / GitHub
# Actions secrets and reference them by name here.
version: 1
backend: gcp

deployment:
  # DNS-label-safe identifier for this installation (lowercase, digits, internal hyphens).
  name: shifter
  # Public hostname users reach this deployment at. Must be a real DNS name.
  domain: shifter.example.com
  # Deployment tier. One of: prod, dev.
  profile: prod

# References to the secrets this deployment needs. The names on the right are
# resolved by the GCP backend bundle at deploy/runtime (a Secret Manager resource
# name, a GitHub Actions secret name, an environment variable, or the literal "prompt").
secrets:
  django_secret_key: projects/your-gcp-project/secrets/shifter-django-secret-key/versions/latest

# Backend-specific settings. The root schema checks that this is a mapping.
# Deployment tooling validates the values it consumes.
settings:
  region: us-central1
  project_id: your-gcp-project
  # Pre-create one Secret Manager project per Shifter deployment. This may equal
  # project_id only while following the documented expand/cut-over migration.
  dynamic_secret_project_id: your-gcp-range-secrets

  # Optional operator-created inputs read by the provisioner. Keys are closed
  # to the supported GDC/Vertex inputs and values must be full, versionless
  # Secret Manager resource names. One declaration drives both exact IAM and
  # runtime publication; omit the map when none are used.
  # provisioner_static_secret_refs:
  #   GDC_ACCESS_SECRET_ID: projects/your-gcp-project/secrets/shifter-prod-gdc-access
  #   GDC_VM_IMAGE_GCS_SECRET_ID: projects/your-gcp-project/secrets/shifter-prod-gdc-vm-image-gcs
  #   GDC_VMSERIES_IMAGE_GCS_SECRET_ID: projects/your-gcp-project/secrets/shifter-prod-gdc-vm-image-gcs
  #   GCP_RANGE_VERTEX_SHARED_KEY_SECRET_ID: projects/vertex-project/secrets/shared-vertex-key

  # PLAT-220: range network egress policy. Same shape on AWS and GCP. Omit the
  # block entirely (or set mode: status-quo) to preserve the backend's existing
  # posture. CIDRs are operator configuration, not secrets — but the actual list
  # for *your* deployment should live in a gitignored local override (see
  # docs/dev/deploy-secrets.md and docs/architecture/range-egress-ip-allowlist.md),
  # not in this committed example.
  range_egress:
    mode: status-quo
    # When mode: allowlist, list CIDRs here. Default-route entries (0.0.0.0/0, ::/0)
    # are rejected — allow-all is a separate mode (not yet defined).
    # allowed_cidrs:
    #   - 203.0.113.0/24

  # #28: range warm pool for faster initial launch. Same shape on AWS and GCP, but
  # warm activation is an optional per-backend capability (ADR-039-R11) — only the
  # GCE range-cell backend is warm-activation-capable today, so a bucket declared
  # for aws/gdc safely never yields a claim (launch falls back to cold provisioning).
  # Disabled by default; omit the block (or set enabled: false) to keep cold launches.
  warm_pool:
    enabled: true
    replenish_interval_seconds: 300
    replenish_concurrency: 2
    scale_down: oldest-first
    replacement: destroy-and-replace
    buckets:
      - id: gce-polaris-vpn
        backend: gce
        scenario: polaris
        capacity_partition: default
        # Compatibility narrows to this region + access mode; the authoritative
        # match at claim time is the immutable-input compatibility digest.
        region: us-central1
        access_mode: vpn
        target: 2
        minimum: 1
        maximum: 4
        idle_ttl_seconds: 3600
