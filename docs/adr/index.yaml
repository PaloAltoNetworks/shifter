    "id": "ADR-043",
    "title": "Provisioner persistence crosses a versioned operation boundary, not Django tables",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "Engine owns the request, range, instance, app, subnet, allocation, outbox, and audit persistence schemas. The separately deployed provisioner integrates through one operation-shaped boundary anchored to the existing ProvisionerLaunchIntent operation_id: an immutable versioned input projection consumed by the provisioner and an append-only versioned result inbox consumed by an Engine-owned applier. The applier validates ownership, lifecycle generation, contract version, ordering, idempotency, and payload shape before applying domain state, audit intent, and any ADR-025 RangeEventOutbox notification in a platform-owned transaction. Direct provisioner reads/writes of Django domain tables and direct inserts into the range-event outbox are compatibility shims to be removed with their grants; synchronous subnet reservation must remain serialized but move behind an Engine-owned stable coordination contract rather than remain an undocumented table exception.",
    "rules": [
      {
        "id": "ADR-043-R1",
        "description": "The provisioner MUST NOT use Django model tables, columns, joins, migration history, arbitrary field updates, or the range-event outbox as its service API. At completed cutover its database principal may read only the immutable operation-input integration surface, append only to the result inbox, and use an explicitly reviewed stable coordination surface for synchronous reservations; all legacy domain-table and outbox grants MUST be revoked by forward migration and proved absent with PostgreSQL effective-privilege tests.",
        "checks": []
      },
      {
        "id": "ADR-043-R2",
        "description": "Provisioner command, input, and result contracts MUST be operation-shaped, provider-neutral, versioned independently of application releases, bounded, runtime-validated at every process boundary, secret-free except for existing encrypted envelopes and provider-native secret references, and anchored to the existing operation_id generation. AWS and GCP MUST NOT use different generation or persistence contracts. Unknown versions, stale generations, wrong ownership, invalid transitions/order, oversized payloads, and a repeated result id with a different digest MUST fail closed without domain mutation.",
        "checks": []
      },
      {
        "id": "ADR-043-R3",
        "description": "Engine is the sole result applier. Applying a provisioner result, recording its idempotent disposition, writing Engine domain state and system audit intent, and enqueueing any ADR-025 notification MUST share one platform-owned transaction. Delivery is at-least-once with idempotent application; launch retry, result-apply retry, range-event delivery, and CMS/Mission Control reconciliation remain distinct workflows and MUST NOT share tables, payloads, status meanings, or DLQ semantics.",
        "checks": []
      },
      {
        "id": "ADR-043-R4",
        "description": "Operation payloads MUST compose the existing shared persisted RangeSpec/RAES ProvisioningPlan, range-cell, backend-admission, remote-access, RAES content/evidence, ResourceStatus, NGFW attachment, audit, error, and logging contracts. They MUST NOT introduce table-shaped DTOs, a second authored/runtime state model, duplicate validators/status enums/event constants/exception hierarchies, raw provider-response persistence, or a generic repository/query/patch interface.",
        "checks": []
      },
      {
        "id": "ADR-043-R5",
        "description": "Process argv is limited to the canonical resource/operation, request or legacy identifiers, and optional operation-generation UUID correlation; payloads, capabilities, credentials, database tokens, signed URLs, VPN profiles, provider responses, and environment maps MUST NOT enter argv, logs, audit context, range error text, events, or public error envelopes. Existing IAM/Cloud SQL DB auth, TLS, sensitive-env projection, env inventories/renderers, admission policy, shared.log_sanitize/provisioner log_redact, and shared API error envelopes remain authoritative.",
        "checks": []
      },
      {
        "id": "ADR-043-R6",
        "description": "Subnet/CIDR reservation is synchronous pre-mutation coordination, not an eventual provisioner result. Its Engine-owned boundary MUST accept only current, operation-appropriate range or raes-range generations and preserve the existing PostgreSQL serialization, uniqueness, cloud-drift observation, ownership, release, and failure-compensation semantics. Realized CIDRs MUST live in allocation/subnet state and operation contracts; the provisioner MUST NOT continue mutating authored range_config as runtime scratch state.",
        "checks": []
      },
      {
        "id": "ADR-043-R7",
        "description": "The operation boundary MUST retain immutable input until terminal recovery is no longer possible, support an explicit rolling producer/consumer version window, and provide bounded retry/DLQ plus operator-visible signals for inbox lag, unsupported versions, stale/conflicting results, and operations lacking terminal results. A crash after cloud mutation but before result append MUST be recoverable through idempotent re-drive or provider/Terraform reconciliation; ADR-025 projection reconciliation alone is insufficient.",
        "checks": []
