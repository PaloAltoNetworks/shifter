    "id": "ADR-025",
    "title": "Range events use transactional outbox and authoritative reconciliation for durable delivery",
    "status": "accepted",
    "scope": "shifter_platform",
    "decision": "PostgreSQL is the authoritative state store for range, request, and instance state. Range events are correctness-critical propagation signals, not best-effort notifications. Every such event is made recoverable through two complementary layers: (1) a transactional outbox — the provisioner enqueues each event into `engine_range_event_outbox` in the same DB transaction as the authoritative state write, and the `drain_range_event_outbox` portal management command publishes PENDING rows to the SNS topic / Pub/Sub with exponential-backoff retry and a DLQ terminal state after max_attempts; (2) a DB-authoritative reconciler — the `reconcile_range_events` portal management command re-reads authoritative `engine.Range` state and idempotently re-drives stale CMS `RangeInstance` projections through the existing handler seam. Consumer handlers propagate transient failures rather than swallowing them, engaging the worker ack-after-handler SQS retry and DLQ. Mission Control websocket fanout remains advisory. AWS SNS/SQS and GCP Pub/Sub messaging surfaces maintain dead-letter, retry-policy, and Cloud Monitoring alert parity.",
    "rules": [
      {
        "id": "ADR-025-R1",
        "description": "PostgreSQL is the authoritative state store for range, request, and instance state. Range events are correctness-critical propagation signals, not a replacement state store and not best-effort notifications. A lost or undelivered event must not leave CMS range projections or Engine state permanently stale without an operator-visible signal.",
        "checks": []
      },
      {
        "id": "ADR-025-R2",
        "description": "Every correctness-critical event must have at least one durable recovery path: either (a) transactional outbox (`engine_range_event_outbox` enqueued atomically with the authoritative state write) with a drainer that publishes with exponential-backoff retry, a DLQ terminal state after max_attempts, and an operator alert; or (b) idempotent DB-authoritative reconciliation that re-reads `engine.Range` state and re-drives the affected domain projections through existing handler/orchestrator/bridge seams. The two paths are complementary and both are present in the shipping implementation.",
        "checks": []
      },
      {
        "id": "ADR-025-R3",
        "description": "Consumer handlers must propagate transient DB or broker failures so the worker ack-after-handler retry and DLQ engage. Swallowing a transient exception and returning normally is not acceptable for correctness-critical events. Invalid, permanently unprocessable, or duplicate payloads may be deliberately logged and acknowledged; the distinction must be explicit in the handler.",
        "checks": []
      },
      {
        "id": "ADR-025-R4",
        "description": "Mission Control websocket fanout is advisory only. It is a projection of authoritative state and is not a recovery path for lost events. CMS state convergence and Engine status transitions must not depend on one-shot best-effort websocket delivery.",
        "checks": []
      },
      {
        "id": "ADR-025-R5",
        "description": "The `engine_range_event_outbox` (`RangeEventOutbox`) durable persistence surface is a first-class Django model with an explicit Django migration. It carries ownership (engine app), retention (PENDING rows drained to terminal PUBLISHED or DLQ state by the drainer; rows with a terminal status are eligible for periodic cleanup), idempotency (each outbox row covers one atomic state write; the drainer publishes exactly once per PENDING row and transitions to terminal state on success), and replay semantics (PENDING rows can be re-drained by re-running `drain_range_event_outbox`). Hiding retry state in JSON columns, cache, Redis channels, local files, or task memory is not acceptable.",
        "checks": []
      },
      {
        "id": "ADR-025-R6",
        "description": "AWS SNS/SQS and GCP Pub/Sub messaging surfaces must maintain parity on dead-letter configuration, retry/backoff policy, and operator-visible alerting (CloudWatch alarms on AWS; Cloud Monitoring alerts on GCP). Adding dead-letter, retry, or alerting posture to one provider requires the same change on the other provider's messaging module.",
        "checks": []
      }
    ],
    "exceptions": [],
    "enforcement": ["agent-policy", "ci"],
    "evidence": [
      "shifter/shifter_platform/engine/models.py",
      "shifter/shifter_platform/engine/migrations/0023_range_event_outbox.py",
