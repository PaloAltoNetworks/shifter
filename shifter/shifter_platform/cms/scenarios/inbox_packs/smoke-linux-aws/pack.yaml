name: smoke-linux-aws
title: Smoke Linux (AWS)
version: 0.3.0
status: built
description: >-
  Minimal platform post-deploy smoke range: a Kali attacker and an Ubuntu
  victim on one switched LAN, both reachable over an SSH participant access
  channel. Portable-addressing variant of smoke-linux for the AWS EC2 range
  backend (subnet CIDRs allocated inside the range VPC, no authored addressing).
  Built entirely from base range images (no agent, no scenario content) to
  validate range provisioning, guest connectivity, and teardown.
authors:
  - Shifter maintainers
provenance_ledger: docs/provenance-ledger.yaml
associated_artifact_manifest: associated-artifacts.json
